name: Security regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-regression:
    name: Security regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the proposed changes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check browser security and development API requests
        run: node --test tests/*.test.mjs

  backend-linux:
    name: Linux backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # A disposable loopback-only cluster belongs to this job, not Azure.
      # Missing configuration or skipped tests must fail backend.ci_tests.
      SORT_TESTER_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5433/sort_tester_unittest_scratch
    services:
      # A throwaway cluster for this job alone, reached only over loopback.
      # Trust auth is scoped to this container; no credential or connection
      # to the staging database is used. Published on 5433 so it never
      # collides with the runner's own preinstalled 5432 instance.
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out the proposed changes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Create fresh environment and record Python version
        run: |
          set -euo pipefail
          python -m venv backend/.venv
          version="$(backend/.venv/bin/python -VV)"
          echo "$version"
          echo "Python used: $version" >> "$GITHUB_STEP_SUMMARY"

      - name: Install and check backend dependencies
        run: |
          set -euo pipefail
          backend/.venv/bin/python -m pip install -r backend/requirements.txt
          backend/.venv/bin/python -m pip check

      - name: Pin the PostgreSQL client to the server's major (16)
        run: |
          set -euo pipefail
          # Ubuntu's default pg_dump/pg_restore are the newest client major
          # installed (17), which emits `SET transaction_timeout = 0;` -- a
          # GUC that does not exist before 17. Restoring that into the 16
          # service container errors, and pg_restore then exits non-zero, so
          # the dump/restore test fails. Put the matching 16 client, shipped
          # with the runner's own 16 server, ahead of it on PATH. $GITHUB_PATH
          # prepends, so psql, pg_dump and pg_restore resolve to 16 below.
          bindir=/usr/lib/postgresql/16/bin
          test -x "$bindir/pg_restore" || {
            echo "Expected the PostgreSQL 16 client at $bindir."; exit 1
          }
          echo "$bindir" >> "$GITHUB_PATH"

      - name: Confirm the loopback PostgreSQL cluster is reachable
        run: |
          set -euo pipefail
          # Existing role/dump/restore tests discover psql, pg_dump and
          # pg_restore via PATH; the step above pins them to the 16 client.
          command -v pg_restore
          pg_restore --version
          psql -h 127.0.0.1 -p 5433 -U postgres -d postgres --no-password -v ON_ERROR_STOP=1 -c 'SELECT version()'

      - name: Run backend unit tests
        run: |
          set -euo pipefail
          backend/.venv/bin/python -m backend.ci_tests

      - name: Check live health response on loopback
        run: |
          set -euo pipefail
          port="$(python -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')"
          stdout="$RUNNER_TEMP/uvicorn-stdout.log"
          stderr="$RUNNER_TEMP/uvicorn-stderr.log"
          backend/.venv/bin/python -m uvicorn backend.main:app --host 127.0.0.1 --port "$port" >"$stdout" 2>"$stderr" &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; wait "$server" 2>/dev/null || true; cat "$stdout" "$stderr" 2>/dev/null || true' EXIT
          response=""
          for _ in $(seq 1 30); do
            if ! kill -0 "$server" 2>/dev/null; then
              echo 'Uvicorn exited before responding.'; exit 1
            fi
            if response="$(curl -fsS --max-time 2 "http://127.0.0.1:$port/health")"; then
              break
            fi
            response=""
            sleep 0.5
          done
          if [ -z "$response" ]; then
            echo 'Uvicorn did not respond within 15 seconds.'; exit 1
          fi
          if [ "$response" != '{"status":"ok"}' ]; then
            echo "Unexpected health response: $response"; exit 1
          fi
          echo "GET /health returned HTTP 200 and $response"
