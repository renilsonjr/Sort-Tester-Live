name: Security regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-regression:
    name: Security regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the proposed changes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check browser security and development API requests
        run: node --test tests/*.test.mjs

  backend-linux:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # A new loopback-only cluster belongs to this job, not Azure. Missing
      # configuration or skipped tests must fail backend.ci_tests.
      SORT_TESTER_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5433/sort_tester_unittest_scratch
    steps:
      - name: Check out the proposed changes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Create fresh environment and record Python version
        run: |
          python -m venv backend/.venv
          version="$(backend/.venv/bin/python -VV)"
          echo "$version"
          echo "Python used: $version" >> "$GITHUB_STEP_SUMMARY"

      - name: Install and check backend dependencies
        run: |
          backend/.venv/bin/python -m pip install -r backend/requirements.txt
          backend/.venv/bin/python -m pip check

      - name: Start an isolated loopback PostgreSQL cluster
        run: |
          # The runner ships server binaries outside PATH. Highest version
          # wins, so a runner image upgrade does not pin this job to an old
          # cluster. Existing role/dump/restore tests discover these tools
          # via PATH, so the directory is exported for later steps.
          pgbin="$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | sort -V | tail -1)"
          if [ -z "$pgbin" ] || [ ! -x "$pgbin/initdb" ]; then
            echo 'The hosted runner must provide PostgreSQL server binaries.' >&2
            exit 1
          fi
          echo "$pgbin" >> "$GITHUB_PATH"
          data="$RUNNER_TEMP/sort-tester-ci-postgres"
          log="$RUNNER_TEMP/sort-tester-ci-postgres.log"
          if [ -e "$data" ]; then
            echo 'Expected a fresh PostgreSQL data directory.' >&2
            exit 1
          fi
          # The runner's packaged PostgreSQL defaults its socket directory to
          # /var/run/postgresql, which belongs to the postgres user and which
          # this job's user cannot write, so the server dies at startup. This
          # cluster is reached over loopback TCP and needs no shared socket:
          # the socket goes beside the data directory.
          sockets="$RUNNER_TEMP/sort-tester-ci-postgres-sockets"
          mkdir -p "$sockets"
          # Trust is restricted to this disposable job's loopback listener.
          # No credential or connection to the staging database is used.
          "$pgbin/initdb" -D "$data" -U postgres --auth=trust --encoding=UTF8 --locale=C
          echo "SORT_TESTER_CI_PGDATA=$data" >> "$GITHUB_ENV"
          # pg_ctl reports only that the server would not start; what it
          # refused is in the server log, so print it rather than leaving the
          # next failure as undiagnosable as this step's first one was.
          if ! "$pgbin/pg_ctl" -D "$data" -l "$log" \
              -o "-h 127.0.0.1 -p 5433 -c timezone=UTC -c unix_socket_directories=$sockets" \
              -w -t 60 start; then
            echo '--- PostgreSQL server log ---' >&2
            cat "$log" >&2 || true
            exit 1
          fi
          "$pgbin/psql" -h 127.0.0.1 -p 5433 -U postgres -d postgres --no-password -v ON_ERROR_STOP=1 -c 'SELECT version()'

      - name: Run backend unit tests
        run: backend/.venv/bin/python -m backend.ci_tests

      - name: Check live health response on loopback
        run: |
          port="$(backend/.venv/bin/python -c 'import socket;s=socket.socket();s.bind(("127.0.0.1",0));print(s.getsockname()[1]);s.close()')"
          stdout="$RUNNER_TEMP/uvicorn-stdout.log"
          stderr="$RUNNER_TEMP/uvicorn-stderr.log"
          backend/.venv/bin/python -m uvicorn backend.main:app \
            --host 127.0.0.1 --port "$port" >"$stdout" 2>"$stderr" &
          server=$!
          # Always report what the server said and never leave it running,
          # however this step ends.
          trap 'kill "$server" 2>/dev/null || true; wait "$server" 2>/dev/null || true; cat "$stdout" "$stderr" 2>/dev/null || true' EXIT
          body=''
          for _ in $(seq 30); do
            if ! kill -0 "$server" 2>/dev/null; then
              echo 'Uvicorn exited before responding.' >&2
              exit 1
            fi
            if body="$(curl --silent --fail --max-time 2 "http://127.0.0.1:$port/health")"; then
              break
            fi
            body=''
            sleep 0.5
          done
          if [ -z "$body" ]; then
            echo 'Uvicorn did not respond within 15 seconds.' >&2
            exit 1
          fi
          if [ "$body" != '{"status":"ok"}' ]; then
            echo "Unexpected health response: $body" >&2
            exit 1
          fi
          echo "GET /health returned HTTP 200 and $body"

      - name: Stop the job PostgreSQL cluster
        if: always()
        run: |
          if [ -n "${SORT_TESTER_CI_PGDATA:-}" ] && [ -f "$SORT_TESTER_CI_PGDATA/postmaster.pid" ]; then
            pg_ctl -D "$SORT_TESTER_CI_PGDATA" -m fast -w -t 60 stop
          fi
