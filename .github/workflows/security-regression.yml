name: Security regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-regression:
    name: Security regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the proposed changes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check browser security and development API requests
        run: node --test tests/*.test.mjs

  backend-windows:
    name: Windows backend tests
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      # A new loopback-only cluster belongs to this job, not Azure. Missing
      # configuration or skipped tests must fail backend.ci_tests.
      SORT_TESTER_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5433/sort_tester_unittest_scratch
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the proposed changes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Create fresh environment and record Python version
        run: |
          python -m venv backend/.venv
          $python = 'backend/.venv/Scripts/python.exe'
          $version = & $python -VV
          Write-Output $version
          "Python used: $version" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Install and check backend dependencies
        run: |
          $python = 'backend/.venv/Scripts/python.exe'
          & $python -m pip install -r backend/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Start an isolated loopback PostgreSQL cluster
        run: |
          if (-not $env:PGBIN -or -not (Test-Path (Join-Path $env:PGBIN 'initdb.exe'))) {
            throw 'The hosted runner must provide PostgreSQL binaries in PGBIN.'
          }
          # Existing role/dump/restore tests discover these tools via PATH.
          $env:PGBIN | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          $postgresData = Join-Path $env:RUNNER_TEMP 'sort-tester-ci-postgres'
          $postgresLog = Join-Path $env:RUNNER_TEMP 'sort-tester-ci-postgres.log'
          if (Test-Path $postgresData) { throw 'Expected a fresh PostgreSQL data directory.' }
          # Trust is restricted to this disposable job's loopback listener.
          # No credential or connection to the staging database is used.
          & (Join-Path $env:PGBIN 'initdb.exe') -D $postgresData -U postgres --auth=trust --encoding=UTF8 --locale=C
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "SORT_TESTER_CI_PGDATA=$postgresData" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & (Join-Path $env:PGBIN 'pg_ctl.exe') -D $postgresData -l $postgresLog -o '-h 127.0.0.1 -p 5433 -c timezone=UTC' -w -t 60 start
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $env:PGBIN 'psql.exe') -h 127.0.0.1 -p 5433 -U postgres -d postgres --no-password -v ON_ERROR_STOP=1 -c 'SELECT version()'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run backend unit tests
        run: |
          & backend/.venv/Scripts/python.exe -m backend.ci_tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check live health response on loopback
        run: |
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = $listener.LocalEndpoint.Port
          $listener.Stop()
          $python = (Resolve-Path 'backend/.venv/Scripts/python.exe').Path
          $stdout = Join-Path $env:RUNNER_TEMP 'uvicorn-stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'uvicorn-stderr.log'
          $server = Start-Process -FilePath $python -ArgumentList @('-m', 'uvicorn', 'backend.main:app', '--host', '127.0.0.1', '--port', "$port") -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $response = $null
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              if ($server.HasExited) { throw 'Uvicorn exited before responding.' }
              try {
                $response = Invoke-WebRequest "http://127.0.0.1:$port/health" -TimeoutSec 2
                break
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if ($null -eq $response) { throw 'Uvicorn did not respond within 15 seconds.' }
            if ($response.StatusCode -ne 200) { throw "Expected HTTP 200, got $($response.StatusCode)." }
            if ($response.Content.Trim() -ne '{"status":"ok"}') { throw "Unexpected health response: $($response.Content)" }
            Write-Output "GET /health returned HTTP 200 and $($response.Content)"
          } finally {
            if (-not $server.HasExited) {
              Stop-Process -Id $server.Id -Force
              Wait-Process -Id $server.Id -ErrorAction SilentlyContinue
            }
            Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
          }

      - name: Stop the job PostgreSQL cluster
        if: always()
        run: |
          if ($env:SORT_TESTER_CI_PGDATA -and (Test-Path (Join-Path $env:SORT_TESTER_CI_PGDATA 'postmaster.pid'))) {
            & (Join-Path $env:PGBIN 'pg_ctl.exe') -D $env:SORT_TESTER_CI_PGDATA -m fast -w -t 60 stop
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
