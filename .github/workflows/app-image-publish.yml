name: App image publish

# Publishes the production image to GHCR and prints the digest to paste
# into the Container Apps deployment (issue #41).
#
# Manual only, and only after the App image workflow has passed on the
# commit being published.
#
# Visibility: the image carries the Ranked question bank, and the owner
# made the package PRIVATE on 2026-11-14. The workflow checks that the
# package is what the person publishing says it should be (private by
# default), and it checks BEFORE pushing, so a surprise stops the run
# while nothing has been published.
on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: 'Type the word publish to confirm'
        required: true
        type: string
      expected_visibility:
        description: 'What the GHCR package visibility must be'
        required: true
        type: choice
        default: private
        options:
          - private
          - public

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish the app image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/sort-tester-live-app
      PACKAGE_API: users/${{ github.repository_owner }}/packages/container/sort-tester-live-app
      EXPECTED: ${{ inputs.expected_visibility }}
    steps:
      - name: Check the confirmation
        run: |
          [ "${{ inputs.confirm_publish }}" = "publish" ] \
            || { echo 'Not confirmed: type publish to run this workflow.'; exit 1; }

      - name: Check the package visibility before publishing anything
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          visibility=$(gh api "$PACKAGE_API" --jq '.visibility' 2>/dev/null || echo absent)
          echo "Package visibility now: $visibility (expected: $EXPECTED)"
          if [ "$visibility" = "absent" ]; then
            echo 'No readable package yet: a first publish creates it. It is checked again after the push.'
          elif [ "$visibility" != "$EXPECTED" ]; then
            echo "The package is $visibility but this run expects $EXPECTED. Nothing was published."
            echo 'Change the package visibility in its settings, or run again with the matching choice.'
            exit 1
          fi

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require a passing App image run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}" \
            --jq '[.workflow_runs[] | select(.name == "App image")] | first | .conclusion // "none"')
          [ "$conclusion" = "success" ] \
            || { echo "App image for this commit is '$conclusion', not success. Publish refused."; exit 1; }

      - name: Build the image
        run: docker build --file infra/azure/app.Dockerfile --tag "$IMAGE:${{ github.sha }}" .

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Push and record the digest
        id: push
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          ref=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:${{ github.sha }}")
          digest=${ref#*@sha256:}
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Report the digest to deploy
        run: |
          {
            echo "### Image published (package expected: $EXPECTED)"
            echo
            echo 'Deploy this digest, and nothing else:'
            echo
            echo '```'
            echo 'imageSha256=${{ steps.push.outputs.digest }}'
            echo '```'
            echo
            echo 'Next: infra/azure/container-apps-app.md'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check the visibility again after a first publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          visibility=$(gh api "$PACKAGE_API" --jq '.visibility' 2>/dev/null || echo unknown)
          echo "Package visibility after the push: $visibility (expected: $EXPECTED)"
          if [ "$visibility" = "unknown" ]; then
            echo 'Could not read the visibility; check it by hand in the package settings.'
          elif [ "$visibility" != "$EXPECTED" ]; then
            echo "The package is $visibility but this run expected $EXPECTED."
            echo 'The image above WAS published. Fix the visibility in the package settings now.'
            exit 1
          fi
