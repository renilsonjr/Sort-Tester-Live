  .lab-top { position: sticky; top: 0; z-index: 25; padding: 11px 18px; gap: 8px; background: var(--dock-bg); border-bottom: 1px solid var(--glass-border-subtle); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); }
  .lab-mark { width: 31px; height: 31px; border-radius: 10px; font-size: 12px; }
  .lab-brand { font-size: 18px; gap: 9px; }
  /* 44x44, not 40x38 (#341). Two earlier rules in this file already set
     44x44 on these four; this compact-header layer was quietly undoing both,
     which is why they measured 40x38 in the running app while the source
     looked correct in three places out of four.
     The room comes from the gap beside the brand: measured at 375px, the
     four controls plus their gaps grow from 180px to 194px, and there were
     44px of empty space between the brand and the first control. */
  .lab-language button, .lab-theme-btn { width: 44px; min-height: 44px; border-radius: 11px; }

  /* On a narrow phone the header row cannot hold the wordmark and four
     44px targets at once. Measured at 339px: the row has 284px to give, and
     the brand plus the controls want 321px -- it already overflowed before
     this change, at 303px, and the theme button was being clipped at the
     right edge. The targets are what matter here, so the wordmark goes and
     the RJ mark stays; the app is still named in the page title and on the
     sign-in screen. */
  @media (max-width: 360px) {
    .lab-wordmark { display: none; }
    .lab-top-actions { gap: 5px; }
  }
  /* Sized the flag before the flags were dropped (#326); now it is the label. */
  .lab-language button span:first-child { font-size: 13px; }
  .lab-language button { font-weight: 900; }
  .lab-main { padding-top: 14px; }

  /* The header controls draw at 40x38 so the compact header stays compact,
     but a finger needs 44x44. The drawn box keeps its size and the tappable
     box is pushed out to 44x44 with a pseudo-element: 2px either side (40+4)
     and 3px top and bottom (38+6).

     Those numbers are not free choices. The buttons sit 6 to 7px apart, so
     2px of horizontal growth each leaves 2 to 3px between neighbours and no
     two hit areas ever overlap. Growing the buttons themselves to 44x44
     instead would add 16px across a row that already ends 18px from the edge
     of a 375px screen, and would squeeze the app name beside it.

     The width below is 40px on purpose: the quiz header drew these at 38px,
     which made the hit area 42px wide there and the one measurement that
     matters inconsistent between screens. (`.card-header` carries the same
     38px, but no screen renders that class any more, so it is left alone.) */
  /* 44, not 40 (#379). The main header's four were raised in #341; the quiz
     has a header of its own, and this rule kept its two at 40 wide -- on the
     screen a player spends the most time on. Cancel on the same bar is
     already 80x44, so the row had the room. */
  .quiz-topline .lab-language button { width: 44px; }
  .lab-language button, .lab-theme-btn { position: relative; }
  .lab-language button::after,
  .lab-theme-btn::after {
    content: "";
    position: absolute;
    /* Sized outright, not with a negative inset. An absolutely positioned
       child resolves its offsets against the padding box, which has already
       had the 1px border and the 2px padding taken off it, so `inset: -3px
       -2px` measured 40x40 instead of the 44x44 it reads like. Centring a box
       of a stated size does not care what the button's border or padding are.
       Measured after this change: 44x44, and a point 1.5px outside the drawn
       edge hit-tests to the button on all four sides. */
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    transform: translate(-50%, -50%);
    /* Out of flow, so it is not a flex or grid item and changes no layout.
       No background: this is a hit area, not something to look at. */
  }

  /* Drawn icons (dock, Home shortcuts) */
  .lab-nav i svg, .home-short-ic svg, .lab-choice-icon svg, .lab-btn-ic svg { display: block; width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  /* The header's sound and theme icons join that family instead of being
     system emoji (#326). `currentColor` is what makes one drawing serve every
     state: the button already sets the gold, and the day theme redefines it. */
  .lab-btn-ic { display: grid; place-items: center; }
  /* The Settings chip is 12px text, so its mark is 15px rather than the 19px
     the tiles and the dock use -- the glyph it replaces drew at 14px (#404). */
  .lab-settings-btn .lab-btn-ic svg { width: 15px; height: 15px; }
  .lab-nav i { display: block; }

  /* #440: the two badge marks. They size in `em`, so the font-size each
     context already declares goes on deciding how big the mark is -- 22px
     on both feedback screens, 16px on the podium's own crown -- and a 2.4
     stroke, because each replaces a font-weight 900 glyph.

     #443 took the crown out of the winner's disc and out of the list's
     place column, so `.pdisc svg` and `.board-place svg` have nothing left
     to size and are gone with it, along with the two disc overrides that
     existed only to make a 10.8px crown big enough to see. */
  .rq-mark svg, .pcrown svg { display: block; width: 1em; height: 1em;
    fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

  /* Home stripes */
  .home-screen { gap: 16px; }
  .home-stripe { display: flex; flex-direction: column; gap: 8px; }
  .home-stripe[hidden] { display: none; }
  /* 32px: the Play Ranked button inside carries the 14px --r-sm radius, and
     the card pads it by 18px. (The bottom padding is 16px, so the two lower
     corners run 2px over-round -- not worth a second radius to chase.) */
  .home-spot { position: relative; overflow: hidden; padding: 18px 18px 16px; border-radius: 32px; border: 1px solid var(--soft-line); background: linear-gradient(135deg, var(--soft) 0%, var(--glass-surface-sub) 62%); box-shadow: var(--glass-shadow), 0 0 28px -6px rgba(244, 189, 56, 0.32); }
  .home-spot::before { content: ""; position: absolute; top: 0; left: 28px; right: 28px; height: 1px; background: linear-gradient(90deg, transparent, var(--glass-highlight), transparent); }
  .home-pill { display: inline-block; margin-bottom: 10px; padding: 4px 10px; border-radius: 999px; background: var(--gold); color: #2a1c10; font-size: 10.5px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; }
  .home-spot-title { margin: 0 0 4px; font-size: 24px; font-weight: 900; letter-spacing: -.04em; line-height: 1.12; text-transform: none; color: var(--ink); }
  .home-spot-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--glass-border); }
  .home-standing { min-width: 0; }
  .home-standing small { display: block; color: var(--muted); font-size: 10px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; }
  .home-standing b { display: block; font-size: 15px; font-weight: 900; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .home-standing b.home-standing-note { font-size: 12.5px; font-weight: 800; white-space: normal; line-height: 1.3; }
  .home-spot-row .primary { flex: none; width: auto; padding: 11px 14px; font-size: 13.5px; white-space: nowrap; }

  .home-climb { padding: 14px; border-radius: var(--r-md); background: var(--glass-surface-sub); border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow); }
  .home-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .home-tile { display: flex; flex-direction: column; align-items: center; padding: 12px 8px; border-radius: 16px; background: var(--glass-surface-sub); border: 1px solid var(--glass-border-subtle); text-align: center; perspective: 700px; }
  .home-tile strong { margin-top: 6px; font-size: 14px; font-weight: 900; }
  .home-tile small { color: var(--muted); font-size: 10px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; }
  .home-obj { position: relative; width: 104px; height: 92px; display: grid; place-items: center; }
  .home-obj-badge { width: 84px; height: 84px; object-fit: contain; transform: rotateY(-14deg) rotateX(8deg) rotateZ(-3deg); filter: drop-shadow(0 12px 16px rgba(0, 0, 0, 0.4)); }
  .home-obj-hat { width: 104px; height: auto; transform: rotate(-4deg); filter: drop-shadow(0 12px 14px rgba(0, 0, 0, 0.42)); }
  .home-shine { position: absolute; top: -4px; left: 16%; width: 68%; height: 34%; border-radius: 50%; background: linear-gradient(180deg, var(--glass-highlight), transparent); filter: blur(5px); pointer-events: none; z-index: 1; opacity: .7; }
  .home-meter { height: 6px; margin-top: 14px; border-radius: 99px; overflow: hidden; }
  .home-meter i { display: block; height: 100%; border-radius: 99px; }
  .home-climb-note { margin: 7px 0 0; color: var(--muted); font-size: 12px; font-weight: 700; }

  .home-shortcuts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  /* 26px: the icon square below is 12px, with 14px of padding around it. */
  .home-short { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding: 14px; text-align: left; color: var(--ink); border-radius: 26px; background: var(--glass-surface-sub); border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow); }
  .home-short-ic { width: 40px; height: 40px; margin-bottom: 7px; border-radius: 12px; display: grid; place-items: center; background: var(--soft); border: 1px solid var(--soft-line); color: var(--gold); }
  .home-short strong { font-size: 15px; font-weight: 900; letter-spacing: -.02em; }
  .home-short small { color: var(--muted); font-size: 11.5px; font-weight: 700; line-height: 1.35; }

  html[data-theme="day"] .home-spot { box-shadow: var(--glass-shadow), 0 0 28px -6px rgba(201, 138, 16, 0.22); }
  html[data-theme="day"] .home-obj-badge { filter: drop-shadow(0 12px 16px rgba(90, 60, 25, 0.3)); }
  html[data-theme="day"] .home-obj-hat { filter: drop-shadow(0 12px 14px rgba(90, 60, 25, 0.32)); }

  /* ============================================================
     Redesign v5 — Practice, Ranked, Leaderboard and Profile in the
     Home-in-stripes style. Presentation only.
     ============================================================ */
  .tab-title { font-size: 24px; letter-spacing: -.04em; line-height: 1.12; }
  .tab-intro { margin: -6px 0 0; font-size: 13px; font-weight: 700; line-height: 1.45; }
  .home-stripe .lab-choice { margin-bottom: 0; }
  .tab-chip { float: right; margin-top: -3px; padding: 3px 9px; border-radius: 999px; background: var(--soft); border: 1px solid var(--soft-line); color: var(--ink); font-size: 10px; letter-spacing: .06em; }

  /* Ranked: season, balance, progress and the way to play in one card */
  .rk-bal { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .rk-bal .lab-study-meta { margin: 0; }
  .rk-spot .profile-points { margin: 2px 0 0; font-size: 34px; font-variant-numeric: tabular-nums; }
  .rk-spot .profile-points i { font-style: normal; font-size: 15px; font-weight: 800; letter-spacing: 0; color: var(--muted); }
  .rk-obj, .pf-ident-obj { width: 76px; height: 76px; flex: none; }
  .rk-obj .home-obj-badge, .pf-ident-obj .home-obj-badge { width: 72px; height: 72px; }
  .rk-spot .primary { width: 100%; margin-top: 14px; padding: 13px 16px; font-size: 14.5px; }
  .rk-note { margin: 0; color: var(--muted); font-size: 12px; font-weight: 700; line-height: 1.5; }
  #ranked-panel { display: flex; flex-direction: column; gap: 14px; }
  #ranked-panel > .lab-intro { margin: 0; }

  /* Leaderboard: the podium in a card of its own */
  #board-panel { display: flex; flex-direction: column; gap: 14px; }
  #board-panel > .lab-intro { margin-bottom: 0; }
  .podium-card { padding: 14px 12px 0; border-radius: var(--r-md); background: var(--glass-surface-sub); border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow); overflow: hidden; }
  .podium-card .podium { margin: 0; }

  /* Profile: identity card, then numbers, climb and history */
  .pf-ident { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: var(--r-md); background: var(--glass-surface-sub); border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow); }
  .pf-ident-obj:empty { display: none; }
  .pf-ident-text { min-width: 0; }
  .pf-ident .lab-title { font-size: 26px; overflow-wrap: anywhere; }
  .pf-ident .lab-intro { margin: 2px 0 0; font-size: 13px; font-weight: 700; }
  .pf-climb .pf-badges { margin-top: 0; }

  /* Notices (not in the standings, could not load, tie-break restarted…) were
     a cream card with a faint title at night; they follow the theme now. */
  .board-notice { border: 1px solid var(--soft-line); border-radius: var(--r-sm); background: var(--soft); }
  /* A notice heading is a title, not an enlarged eyebrow (#386).
     The app's base `h2` is eyebrow styling -- uppercase, 0.12em tracking,
     12px -- which reads as a label at that size. This rule blew it up to
     16px and weight 900 while keeping the caps and the tracking, so a
     routine message ("You are not in the standings", whose own body text
     then says your points and badge count as usual) shouted over two lines
     and competed with the 24px page title beside it.
     Sentence case, no tracking, and a weight under the page title's. The
     notices that really are bad news keep their own red-tinted surface --
     .board-notice-bad -- which is the channel that should carry that, not
     capital letters on every notice in the app. */
  .board-notice h2 {
    color: var(--ink); font-size: 15px; font-weight: 800;
    text-transform: none; letter-spacing: -.01em;
  }
  .board-notice p { color: var(--muted); }
  .board-notice-bad { border-color: rgba(240, 138, 138, 0.45); background: rgba(240, 138, 138, 0.12); }
  #board-panel > .board-notice { margin-top: 0; }

  /* ============================================================
     Redesign v6 — quiz screens (Ranked and Practice: question,
     feedback, result) in the Home-in-stripes style. Presentation only.
     Sized so a 390x693 phone shows each screen without scrolling.
     ============================================================ */

  /* The route card: the hero of a question, a reminder on feedback */
  .rq-route { margin: 0; padding: 14px 16px 16px; text-align: center; border-radius: var(--r-md); }
  .rq-route:not(.home-spot), .quiz-route { background: var(--glass-surface-sub); border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow); }
  .rq-route .home-pill { margin-bottom: 8px; }
  .rq-route .rq-code { margin-top: 6px; font-size: clamp(54px, 11dvh, 84px); }
  .rq-route-sm { padding: 12px 16px 14px; }
  .rq-route-sm .rq-service { font-size: 12px; }
  .rq-route-sm .rq-code { margin-top: 4px; font-size: clamp(38px, 7dvh, 50px); }

  /* Ranked question */
  #rq-play { gap: 10px; }
  #rq-play .tb-bar { margin: 0; }
  #rq-question { display: flex; flex-direction: column; gap: 10px; }
  #rq-question .belts { margin: 0; }
  .rq-cue { margin: 2px 0 0; }
  /* #428: at zero the cue stops asking and says what happened, so it stops
     looking like the prompt it was. The belts dim themselves: `.belts
     .belt:disabled` is already half opacity. */
  .rq-cue.over { color: var(--bad); }
  #rq-question .belts .belt { min-height: clamp(70px, 12.5dvh, 104px); }

  /* Ranked feedback */
  .rq-head { display: flex; align-items: center; gap: 12px; }
  .rq-head .rq-mark { width: 48px; height: 48px; margin: 0; font-size: 22px; flex: none; }
  .rq-head-text { min-width: 0; }
  .rq-head .rq-verdict, .rq-head .rq-worth { text-align: left; }
  .rq-head .rq-verdict { font-size: 24px; line-height: 1.1; }
  .rq-head .rq-worth { margin: 2px 0 0; font-size: 13px; }
  .rq-cmp { margin: 0; gap: 0; padding: 2px 14px; border-radius: var(--r-md); }
  .rq-cmp > div { border: 0; border-radius: 0; padding: 11px 0; font-size: 13.5px; font-weight: 800; }
  .rq-cmp > div + div { border-top: 1px solid var(--glass-border); }
  .rq-why { margin: 0; }

  /* Ranked result */
  .rq-score { padding: 18px; }
  .rq-score-line { margin: 0 0 12px; font-size: 20px; letter-spacing: -.02em; }
  .rq-score-line b { margin-right: 4px; font-size: 46px; letter-spacing: -.04em; line-height: 1; }
  .rq-score .home-meter { margin-top: 0; }
  .sum { margin: 0; gap: 0; padding: 2px 14px; border-radius: var(--r-md); }
  .sum > div { align-items: center; padding: 11px 0; font-weight: 800; }
  .sum > div + div { border-top: 1px solid var(--glass-border); }
  .sum b { font-size: 16px; font-variant-numeric: tabular-nums; }
  .sum .total { margin-top: 0; padding-top: 11px; border-top-style: solid; }
  .sum .total b { font-size: 22px; color: var(--gold); }

  /* Practice quiz: its top line becomes a bar like the app header */
  .quiz-top { gap: 10px; }
  .quiz-topline { min-height: 0; margin: -20px -16px 0; padding: 11px 18px; background: var(--dock-bg); border-bottom: 1px solid var(--glass-border-subtle); }
  .quiz-topline .progress { font-size: 11px; font-weight: 900; letter-spacing: .14em; }
  .quiz-step { color: var(--gold); font-size: 11px; font-weight: 900; letter-spacing: .16em; }
  .quiz-timer { width: 42px; height: 42px; border-width: 3px; font-size: 14px; }
  .quiz-bar { margin: 0; }
  /* The quiz is a column of cards now, not one big card; and it has no dock,
     so it needs neither the full-height stretch nor the dock's bottom gap. */
  .quiz-card { justify-content: flex-start; }
  .quiz-card, .quiz-feedback { min-height: 0; }

  /* ...but dropping the stretch left 247px of dead background under the
     answer buttons at 375x812 (#330), and this app is used in a warehouse,
     with gloves: that is space a target should be using.
     `space-between` is NOT the way back -- it would scatter the column, which
     is what the rule above was written to stop. Instead the page is the flex
     column, the card fills it, and only the grid of answers absorbs the
     slack, so everything above it stays packed exactly where it was.
     Measured at 375x812: buttons 122px -> 231px, empty band 247px -> 28px
     (the page's own bottom padding), and nothing scrolls. */
  #app.quiz-page { display: flex; flex-direction: column; }
  .quiz-card { flex: 1; }
  .quiz-card .options { flex: 1; grid-auto-rows: 1fr; }
  .quiz-card .belt { height: 100%; }
  #app.quiz-page { padding-bottom: calc(28px + env(safe-area-inset-bottom)); }
  .quiz-route { margin: 0; padding: 14px 16px 16px; border-radius: var(--r-md); }
  .quiz-route .p-line { color: var(--muted); font-size: 14px; font-weight: 800; letter-spacing: .14em; }
  .quiz-cue { text-align: left; color: var(--gold); font-weight: 900; letter-spacing: .16em; }
  .quiz-card .belt { min-height: clamp(84px, 15dvh, 124px); }

  /* BLACK, as an answer button, in the night theme (#335).
     The belt colours are routing information and are not restyled: the fill
     stays the inline #000 that BELT_STYLE gives it, and the chart chips and
     the feedback rows are untouched. What changes is only how the button is
     drawn. Pure #000 on a near-black page read as a hole rather than a
     button -- the Practice quiz's `.belt` has no border at all, so there was
     nothing but the gap between cells to tell them apart, and on a dirty
     screen or in sunlight that is nothing.
     Measured, and worth correcting the issue on: the fill CANNOT do this
     job. #000 against the page is 1.09:1 and the lifted #1f1f1f is 1.17:1 --
     both are nothing, because the page is near-black too. It is the BORDER
     that makes the button a button: 4.67:1 against the page and 4.00:1
     against its own fill. The lift is kept because it gives the body the
     look of a surface rather than a void, not because it separates anything.
     The 100px fill is listed LAST so the layers above it still paint on
     top.
     The leading `html` is load-bearing, not decoration. An unscoped
     `[data-belt="BLACK"]` rule already existed for the chart chips and the
     feedback rows -- a 1px ring, which is the "thin border" the issue
     describes -- and its day-theme twin is `html[data-theme="day"]
     [data-belt="BLACK"]`. Without the `html` here, that twin would outweigh
     these rules and the day theme would silently get a different button
     from the night one. With it, both themes are drawn the same way on
     purpose, and the chips and feedback rows keep their own 1px ring,
     untouched. */
  html .belt[data-belt="BLACK"] {
    border: 2px solid rgba(255, 255, 255, 0.42);
    box-shadow: inset 0 0 0 100px rgba(255, 255, 255, 0.12);
  }
  html .belts .belt[data-belt="BLACK"] {
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22),
                0 10px 20px -12px rgba(0, 0, 0, 0.6),
                inset 0 0 0 100px rgba(255, 255, 255, 0.12);
  }

  /* Practice feedback */
  .quiz-verdict { display: flex; align-items: center; gap: 12px; }
  .quiz-verdict .rq-mark { width: 48px; height: 48px; margin: 0; font-size: 22px; flex: none; }
  .quiz-feedback .verdict { margin: 0; font-size: 24px; }
  .quiz-verdict .quiz-auto { margin-top: 2px; text-align: left; font-size: 13px; font-weight: 800; }
  .quiz-feedback .quiz-route { padding: 12px 16px 14px; }
  .quiz-feedback .quiz-route .p-line { font-size: 12px; }
  .quiz-feedback .quiz-route .p-code { font-size: clamp(38px, 7dvh, 50px); }
  .quiz-feedback .answer-compare { gap: 0; padding: 2px 14px; border: 1px solid var(--glass-border); border-radius: var(--r-md); background: var(--glass-surface-sub); box-shadow: var(--glass-shadow); }
  .quiz-feedback .answer-row { padding: 11px 0; font-size: 13.5px; font-weight: 800; }
  .quiz-feedback .answer-row + .answer-row { border-top: 1px solid var(--glass-border); }
  .quiz-feedback .answer-row .answer { min-width: 0; padding: 5px 12px; border-radius: 999px; font-size: 11.5px; font-weight: 900; letter-spacing: .06em; }
  /* The explanation (#384). It was the only block on this screen with no
     surface at all -- the route and the answer comparison both sit on glass
     while the one sentence that actually teaches the chart was 13px of
     muted text under them, reading as a footnote. The other two blocks only
     restate what already happened; this is the screen's point.
     It gets the same glass the comparison has, and the ink colour, so it
     ranks with them instead of under them. */
  .quiz-feedback .why {
    padding: 12px 14px; border: 1px solid var(--glass-border); border-radius: var(--r-md);
    background: var(--glass-surface-sub); box-shadow: var(--glass-shadow);
    color: var(--ink); font-size: 14px; font-weight: 700; line-height: 1.5;
  }

  /* The screen stopped two-thirds of the way down, leaving 242px of empty
     background under Continue at 375x812 (#383) -- while the question
     screen it alternates with now fills the phone (#330). The section
     fills the page and Continue is pinned to the bottom of it, where a
     thumb already is after answering.
     On a CORRECT answer there is no Continue: that screen advances by
     itself, so there is nothing to pin and nothing to reach.
     The child combinator matters: the stop panel is a child of this same
     section, so a plain `.quiz-feedback .primary` also caught its "Keep
     going" button and pushed it to the bottom of that centred panel. */
  .quiz-feedback { flex: 1; }
  .quiz-feedback > .primary { margin-top: auto; }

  /* Continue (and the stop panel's main action) were painted with the theme's
     surface colour: dark on dark at night. Gold, like every other primary. */
  .quiz-card .primary, .quiz-feedback .primary, .bail .primary { background: linear-gradient(135deg, var(--gold) 0%, #d89115 100%); color: #2a1c10; border: 1px solid rgba(255, 255, 255, 0.45); }

  /* Practice results */
  /* #387: the one line of advice over the missed list. .lab-intro carries an
     8px bottom margin for stacked shell screens, which here lands on top of
     the column's own 12px gap -- measured 12px above the line and 20px below.
     The screen's gap is the only spacing. */
  .screen-results > .lab-intro { margin-bottom: 0; }
  .score-line { display: grid; grid-template-columns: 1fr 1fr; gap: 0; padding: 16px 10px; text-align: center; border-radius: var(--r-md); border: 1px solid var(--soft-line); background: linear-gradient(135deg, var(--soft) 0%, var(--glass-surface-sub) 62%); box-shadow: var(--glass-shadow), 0 0 28px -6px rgba(244, 189, 56, 0.32); }
  /* #388: the name used to float between the card and the MISSED list with
     no label and no surface. It is who this result belongs to, so it is the
     card's first line, across both columns, with the hairline under it --
     the same shape a Shift log row already uses: name, then the score.
     The divider is now between the two stat cells only; `div + div` would
     have put a left border on the first stat, which now follows the name.

     The field it comes from has no maxlength and takes an ID as readily as
     a name, so one unbroken 40-character token used to push the page 133px
     wide at 320. Loose on the page that was ugly; inside a bordered card it
     would break the border, so the name wraps anywhere it must. */
  .score-line > .who { grid-column: 1 / -1; padding-bottom: 10px; margin-bottom: 12px; border-bottom: 1px solid var(--glass-border); font-size: 14px; font-weight: 900; overflow-wrap: anywhere; }
  .score-line > .stat + .stat { border-left: 1px solid var(--glass-border); }
  .score-line .big { font-size: 40px; font-weight: 900; letter-spacing: -.04em; }
  .score-line .label { font-size: 10px; font-weight: 900; letter-spacing: .1em; }
  .score-line ~ .deckname { order: -1; margin: 0; color: var(--gold); font-size: 11px; font-weight: 900; letter-spacing: .16em; }
  .score-line ~ h2 { margin: 0; color: var(--gold); font-size: 11px; font-weight: 900; letter-spacing: .16em; }
  .missed { display: flex; flex-direction: column; gap: 8px; }
  .missed li { padding: 12px 14px; border: 1px solid var(--glass-border); border-radius: 18px; background: var(--glass-surface-sub); }
  .mans { color: var(--muted); font-size: 12.5px; font-weight: 800; }
  .mans strong { color: var(--ink); }

  html[data-theme="day"] .score-line { box-shadow: var(--glass-shadow), 0 0 28px -6px rgba(201, 138, 16, 0.22); }


  /* The two desktop wrappers are invisible to layout until the breakpoint.
     Without this they would be one flex item each inside .lab-screen, which
     is a flex column with a 16px gap -- so the stripes they wrap would lose
     the space between them on a phone. The phone must not change (#273). */
  .home-split, .board-split { display: contents; }
  /* Same reason, same trick: the chart's controls are grouped so the desktop
     can put them in a column beside the list, and the group dissolves below
     the breakpoint so the phone still sees them as plain children of
     .lab-screen with its own 16px gap between them. */
  .chart-aside { display: contents; }

  /* Five tabs and a long label (#396).

     Handler's tab makes the signed-in dock five wide. Measured rather than
     eyeballed: at 320px each tab is 64px, and "Clasificatorio" -- the
     Spanish Ranked label -- is 68.9px of text at the dock's 11px, so it was
     clipped. At 10px it is 62.7px and fits, with 65.8px at 375px.

     The size drops only when the dock is five wide, so a guest's three tabs
     and the four-tab dock are untouched. The word itself is not shortened:
     it is the owner's, and a label the player has to decode is worse than a
     slightly smaller one.
     --------------------------------------------------------------------- */
  .lab-nav-tight button { font-size: 10px; }

  /* ---------------------------------------------------------------------
     Handler, the conveyor mini-game (#395).

     Handler has a SKIN OF ITS OWN and stays dark in both app themes (owner
     decision, 2026-11-26). It is a game inside the app, not another app
     screen, and this is the look the owner approved on the prototype. That is
     why this block declares its own tokens on .hd instead of using the app's:
     nothing here should follow html[data-theme="day"].

     Two rules in this block are owner corrections, not taste:
       * .hd-combo is pinned to the RIGHT and sits ABOVE the destinations. It
         must never cover the code on the package coming down, and reading
         that code early is the whole skill the game trains.
       * The combo effect is a sparkle. An earlier version set the package and
         the belt on fire and the owner rejected it. Do not add a glow to the
         belt, the frame or the stage.
     --------------------------------------------------------------------- */
  .hd {
    --hd-ink: #f6e8d2; --hd-ink-soft: #c7a988; --hd-ink-faint: #9b7f61;
    --hd-900: #1d1310; --hd-800: #2a1b15; --hd-700: #3a271d; --hd-600: #4d3425;
    --hd-orange: #dc8542; --hd-gold: #ffca6a; --hd-spark: #9fe8ff; --hd-dark: #0b2230;
    display: flex; flex-direction: column; gap: 12px;
    color: var(--hd-ink);
    /* Handler brings its own dark ground with it. Its ink is cream, so on the
       app's light page the title and every line outside a card vanished
       (seen on the owner's iPhone, 2026-11-26). The negative margin lets the
       ground reach into the page's own padding, so the stage keeps the width
       stageLayout() was measured for. */
    background: var(--hd-900); margin: -12px; padding: 12px; border-radius: 22px;
  }
  .hd-play-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .hd-leave {
    flex: none; min-height: 44px; padding: 0 12px; border-radius: 12px; cursor: pointer;
    background: var(--hd-700); color: var(--hd-ink); border: 1px solid var(--hd-600);
    font-weight: 700; font-size: 13px; white-space: nowrap;
  }
  .hd-eyebrow { margin: 0; color: var(--hd-ink-faint); font-size: 10px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
  .hd-title { margin: 0; font-size: clamp(30px, 8vw, 40px); line-height: 1.05; letter-spacing: -.03em; color: var(--hd-ink); text-wrap: balance; }

  .hd-strip {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.5fr); margin: 0;
    background: var(--hd-800); border: 1px solid var(--hd-700); border-radius: 14px; overflow: hidden;
  }
  /* The label may wrap in Spanish; the numbers still share one baseline. */
  .hd-strip > div { padding: 9px 11px; border-left: 1px solid var(--hd-700); display: flex; flex-direction: column; justify-content: space-between; }
  .hd-strip > div:first-child { border-left: 0; }
  .hd-strip dt { margin: 0 0 2px; color: var(--hd-ink-faint); font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; text-wrap: balance; }
  .hd-strip dd { margin: 0; font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .hd-strip > div:first-child dd { color: var(--hd-gold); }

  .hd-mode-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
  .hd-mode {
    width: 100%; min-height: 64px; display: grid; gap: 2px; text-align: left;
    padding: 12px 14px; border-radius: 14px; cursor: pointer;
    background: var(--hd-800); border: 1px solid var(--hd-700); color: var(--hd-ink);
  }
  .hd-mode-name { font-weight: 800; letter-spacing: -.01em; }
  .hd-mode-best { color: var(--hd-ink-soft); font-size: 0.84rem; }
  .hd-mode-best strong { color: var(--hd-gold); }
  .hd-rules { background: var(--hd-800); border: 1px solid var(--hd-700); border-radius: 14px; padding: 12px 14px; }
  .hd-rules h3 { margin: 0 0 6px; font-size: 0.95rem; text-wrap: balance; }
  .hd-rules li { text-wrap: pretty; }
  .hd-rules ul { margin: 0; padding-left: 18px; color: var(--hd-ink-soft); font-size: 0.84rem; display: grid; gap: 4px; }

  .hd-count { align-items: center; justify-content: center; min-height: 46vh; }
  .hd-count-number { margin: 0; font-size: 5rem; font-weight: 800; color: var(--hd-gold); font-variant-numeric: tabular-nums; }
  /* Each number arrives rather than swapping: scale, fade and blur together. */
  .hd-count-number.pop { animation: hd-pop .28s cubic-bezier(.2,0,0,1); }
  @keyframes hd-pop { from { opacity: 0; scale: .25; filter: blur(4px); } }

  .hd-stage {
    position: relative; height: min(58vh, 560px); min-height: 340px;
    border-radius: 16px; overflow: hidden; background: var(--hd-800);
    border: 1px solid var(--hd-700);
  }
  .hd-canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  .hd-canvas:active { cursor: grabbing; }
  .hd-edges {
    position: absolute; top: 14px; left: 16px; right: 16px; margin: 0;
    display: flex; justify-content: space-between; pointer-events: none;
  }
  .hd-edges span { font-size: 8.5px; letter-spacing: .14em; color: var(--hd-ink-faint); font-weight: 700; }
  .hd-paused {
    position: absolute; inset: 0; margin: 0; display: grid; place-items: center;
    background: #1d1310c4; color: var(--hd-ink); font-weight: 800; font-size: 1.2rem;
  }

  /* The destinations: tabs on the belt's own edges, where the thumbs are. */
  .hd-dest {
    position: absolute; top: 57%; transform: translateY(-50%);
    width: 22%; max-width: 150px; min-height: 108px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    padding: 10px 4px; border-radius: 14px; cursor: pointer;
    border: 1px solid #ffffff38; border-bottom: 5px solid #0006;
    box-shadow: 0 14px 28px #0004; user-select: none;
  }
  .hd-dest.left { left: 2%; }
  .hd-dest.right { right: 2%; }
  .hd-dest:active { filter: brightness(.9); }
  .hd-dest:disabled { opacity: .45; cursor: default; }
  .hd-dest-arrow { font-size: 26px; line-height: 1; font-weight: 600; opacity: .85; }
  .hd-dest-name { font-size: clamp(12px, 3.2vw, 18px); font-weight: 800; letter-spacing: .04em; }
  .hd-dest-sub { font-size: 9.5px; letter-spacing: .08em; opacity: .75; font-weight: 700; }

  /* The cartoon combo badge: top right, above the destinations, clear of
     the belt by the gutter stageLayout() reserves. Scale and blur on the way
     in and out, so it pops rather than merely appearing. */
  .hd-combo {
    --spark: #9fe8ff;
    position: absolute; right: 12px; top: 36px; margin: 0; z-index: 2; pointer-events: none;
    /* Stacked, not side by side. The prototype sets the two parts in a row,
       which makes the badge wide enough to sit over the belt again -- the one
       thing the owner said it must never do. Stacking keeps his badge and his
       rule at the same time, inside the column stageLayout() reserves. */
    display: flex; flex-direction: column; align-items: center; gap: 1px;
    width: 58px; padding: 5px 2px; border-radius: 14px; text-align: center;
    color: var(--hd-dark); background: var(--spark);
    border: 3px solid var(--hd-dark);
    box-shadow: 0 4px 0 var(--hd-dark), 0 0 22px -2px var(--spark);
    translate: 0 0; rotate: -3deg; scale: 1; opacity: 1; filter: blur(0);
    transition: opacity .2s cubic-bezier(.2,0,0,1), scale .2s cubic-bezier(.2,0,0,1),
                filter .2s cubic-bezier(.2,0,0,1), translate .2s ease-out,
                background-color .18s ease-out, box-shadow .18s ease-out;
  }
  .hd-combo b { font-size: 21px; line-height: 1; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .hd-combo small { font-size: 8px; line-height: 1.15; letter-spacing: .04em; color: #2b5468; text-transform: uppercase; font-weight: 700; }
  /* A sparkle sits on the corner, the way a cartoon shine does. */
  .hd-combo::after {
    content: ""; position: absolute; right: -7px; top: -9px; width: 16px; height: 16px;
    background: #fff;
    clip-path: polygon(50% 0, 58% 42%, 100% 50%, 58% 58%, 50% 100%, 42% 58%, 0 50%, 42% 42%);
    filter: drop-shadow(0 0 5px var(--spark));
  }
  .hd-combo.t3 { --spark: #6dd8ff; box-shadow: 0 4px 0 var(--hd-dark), 0 0 32px 0 var(--spark); }
  .hd-combo.t4 { --spark: #c6f3ff; padding: 6px 2px; box-shadow: 0 4px 0 var(--hd-dark), 0 0 44px 4px #7fe0ff; }
  .hd-combo.t4 b { font-size: 24px; }
  /* Only the top tier twinkles, and it twinkles three times rather than for
     ever. The prototype loops this one; the app does not allow an infinite
     animation anywhere in this stylesheet (tests/promotion-celebration.test.mjs
     asserts it for the whole page), so Handler follows the app here. Three
     passes reads almost the same and then rests. */
  .hd-combo.t4::after { animation: hd-twinkle 1.1s ease-in-out 3; }
  @keyframes hd-twinkle { 50% { scale: 1.45; rotate: 40deg; } }
  .hd-combo.off { opacity: 0; scale: .25; filter: blur(4px); translate: 0 -6px; }
  .hd-combo.lost {
    opacity: 0; scale: 1; filter: blur(2px); translate: 0 -14px;
    transition: opacity .16s ease-out, filter .16s ease-out, translate .16s ease-out;
  }
  .hd-combo.bump { animation: hd-bump .3s cubic-bezier(.2,0,0,1); }
  @keyframes hd-bump { 40% { scale: 1.16; rotate: -6deg; } }

  .hd-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .hd-icon-btn {
    min-height: 44px; padding: 0 10px; border-radius: 12px; cursor: pointer;
    background: var(--hd-700); color: var(--hd-ink); border: 1px solid var(--hd-600); font-weight: 700;
    font-size: 14px; line-height: 1.15; text-wrap: balance;
  }
  .hd-icon-btn[aria-pressed="false"] { opacity: .72; }
  .hd-hint { margin: 0; color: var(--hd-ink-faint); font-size: 11px; }
  .hd-board-open:focus-visible, .hd-board-tab:focus-visible, .hd-leave:focus-visible,
  .hd-icon-btn:focus-visible, .hd-mode:focus-visible, .hd-dest:focus-visible,
  .hd-again:focus-visible, .hd-back:focus-visible { outline: 3px solid var(--hd-gold); outline-offset: 3px; }

  .hd-final { display: flex; align-items: baseline; justify-content: space-between; margin: 0; }
  .hd-final strong { font-size: 2.4rem; color: var(--hd-gold); font-variant-numeric: tabular-nums; }
  .hd-best-new { margin: 0; color: var(--hd-gold); font-weight: 800; }
  .hd-best-old { margin: 0; color: var(--hd-ink-soft); }
  .hd-stats { margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .hd-stats > div { background: var(--hd-800); border: 1px solid var(--hd-700); border-radius: 12px; padding: 8px 10px; }
  .hd-stats dt { color: var(--hd-ink-faint); font-size: 0.76rem; }
  .hd-stats dd { margin: 0; font-weight: 800; font-variant-numeric: tabular-nums; }
  .hd-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .hd-again, .hd-back { min-height: 48px; border-radius: 14px; cursor: pointer; font-weight: 800; }
  .hd-again { background: var(--hd-orange); color: #2b1c10; border: 1px solid #b4632a; }
  .hd-back { background: var(--hd-700); color: var(--hd-ink); border: 1px solid var(--hd-600); }

  /* The Handler leaderboard (#417). Same skin as the rest of Handler, and it
     says Handler and the season in its title so it is never read as Ranked. */
  .hd-board-open {
    min-height: 48px; border-radius: 14px; cursor: pointer; font-weight: 800;
    background: var(--hd-700); color: var(--hd-gold); border: 1px solid var(--hd-600);
  }
  .hd-board-tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .hd-board-tab {
    min-height: 44px; padding: 0 4px; border-radius: 12px; cursor: pointer; font-weight: 800; font-size: 13px;
    background: var(--hd-800); color: var(--hd-ink-soft); border: 1px solid var(--hd-700);
  }
  .hd-board-tab[aria-pressed="true"] { background: var(--hd-orange); color: #2b1c10; border-color: #b4632a; }
  .hd-board-note, .hd-board-you { margin: 0; color: var(--hd-ink-soft); font-size: 0.84rem; text-wrap: pretty; }
  .hd-board-you { color: var(--hd-ink); font-weight: 700; }
  .hd-board-rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; transition: opacity .15s ease-out; }
  .hd-board-rows[aria-busy="true"] { opacity: .5; }
  .hd-board-row {
    display: grid; grid-template-columns: 34px 32px minmax(0, 1fr) auto; align-items: center; gap: 10px;
    min-height: 48px; padding: 6px 12px; border-radius: 12px;
    background: var(--hd-800); border: 1px solid var(--hd-700);
  }
  .hd-board-row.you { border-color: var(--hd-gold); background: var(--hd-700); }
  .hd-board-place { font-weight: 800; font-variant-numeric: tabular-nums; color: var(--hd-ink-soft); }
  .hd-board-place abbr { text-decoration: none; margin-left: 1px; color: var(--hd-ink-faint); }
  .hd-board-icon {
    width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
    background: var(--hd-600); font-weight: 800; font-size: 15px; line-height: 1;
  }
  .hd-board-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
  .hd-board-name small { color: var(--hd-ink-faint); font-weight: 600; margin-left: 2px; }
  .hd-board-name em { font-style: normal; font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--hd-gold); margin-left: 4px; }
  .hd-board-score { font-size: 1.15rem; color: var(--hd-gold); font-variant-numeric: tabular-nums; }

  /* Every Handler button answers the press the same way, and the answer can
     be interrupted: a transition, not a keyframe. */
  .hd-mode, .hd-icon-btn, .hd-again, .hd-back, .hd-dest, .hd-board-open, .hd-board-tab, .hd-leave {
    transition: scale .12s ease-out, filter .12s ease-out, background-color .15s ease-out;
    -webkit-tap-highlight-color: transparent;
  }
  .hd-mode:active, .hd-icon-btn:active, .hd-again:active, .hd-back:active, .hd-dest:active,
  .hd-board-open:active, .hd-board-tab:active, .hd-leave:active { scale: .96; }
  @media (hover: hover) {
    .hd-mode:hover, .hd-icon-btn:hover, .hd-back:hover { background: var(--hd-600); }
    .hd-again:hover { filter: brightness(1.06); }
  }
  /* The mode list and the summary are arrived at, a few times a session, so
     their parts come in one after another. The playing screen does not: it
     is re-entered on every round and has to be there at once. */
  .hd-modes > *, .hd-summary > * { animation: hd-rise .32s cubic-bezier(.2,0,0,1) both; }
  .hd-modes > :nth-child(2), .hd-summary > :nth-child(2) { animation-delay: .05s; }
  .hd-modes > :nth-child(3), .hd-summary > :nth-child(3) { animation-delay: .1s; }
  .hd-modes > :nth-child(4), .hd-summary > :nth-child(4) { animation-delay: .15s; }
  .hd-modes > :nth-child(n+5), .hd-summary > :nth-child(n+5) { animation-delay: .2s; }
  @keyframes hd-rise { from { opacity: 0; translate: 0 8px; } }

  /* Reduced motion stills the twinkle, the bump, the lift and the running
     slats. It changes no game rule: the tier is still carried by the badge's
     colour and by the written multiplier, and the verdict keeps its glyph. */
  @media (prefers-reduced-motion: reduce) {
    .hd-combo, .hd-combo::after { transition: none; animation: none !important; rotate: 0deg; }
    .hd-combo.off, .hd-combo.lost { scale: 1; translate: 0 0; filter: blur(0); }
    .hd-mode:active, .hd-icon-btn:active, .hd-again:active, .hd-back:active, .hd-dest:active,
    .hd-board-open:active, .hd-board-tab:active, .hd-leave:active { scale: 1; }
    .hd-modes > *, .hd-summary > *, .hd-count-number.pop { animation: none; }
  }

  /* ---------------------------------------------------------------------
     Desktop (#273, mock approved 2026-11-23).

     One breakpoint, and it is the last block in the stylesheet so it wins on
     equal specificity. Below 900px nothing here applies: the phone keeps its
     bottom dock and its single column, untouched.

     The rule the whole thing follows: width is given only where it helps.
     Lists and dashboards get a second column; forms and the quiz stay narrow,
     because four belt buttons stretched across a wide screen would put the
     route code and the answers at opposite ends of the eye's travel.
     --------------------------------------------------------------------- */
  @media (min-width: 900px) {
    /* The shell fills the window: the sidebar is chrome and belongs against
       the edge, like every app with one. The reading width is held further
       in, on the content itself (--desk-col below), so a wide monitor buys
       room for columns and never a 1300px-long sentence. */
    #app.lab-page { max-width: none; border-radius: 0; margin-block: 0; min-height: 100dvh; }

    /* The DOM order is header, main, nav. Grid areas place the nav first
       without moving it in the markup, so the tab order still reads
       header -> content -> navigation. */
    .lab-shell {
      display: grid;
      grid-template-columns: 232px minmax(0, 1fr);
      grid-template-areas: "nav top" "nav main";
      /* No align-content here. The default stretches the rows, which is what
         carries the sidebar to the bottom of the window on a short screen
         such as Practice. `start` packed the rows and left the sidebar
         floating with the page background under it. */
      min-height: 100dvh;
    }
    .lab-top { grid-area: top; }
    /* #427: the rail is the dock here, so hiding it has to close its column
       too -- `display: none` alone would leave 232px of empty page beside a
       live attempt. */
    #app.attempt-live .lab-shell { grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "main"; }
    /* No dock at the bottom any more, so none of its clearance either. */
    .lab-main { grid-area: main; padding-top: 4px; padding-inline: 30px; padding-bottom: 34px; }

    /* One reading column, shared by the header row and the screen below it so
       the two line up. Wider than the old 808px card, because lists and the
       leaderboard use the room; forms and the quiz keep their own narrower
       caps further down and stay centred inside this one. */
    .lab-shell { --desk-col: 1080px; }
    /* width:100% matters: .lab-top-row is a flex item, and margin-inline:auto
       alone cancels the stretch and shrinks it to its contents. */
    .lab-top-row, .lab-main > .lab-screen { width: 100%; max-width: var(--desk-col); margin-inline: auto; }
    .lab-nav {
      grid-area: nav;
      position: static !important;
      width: auto !important;
      height: auto !important;
      transform: none !important;
      display: grid !important;
      grid-template-columns: 1fr !important;
      align-content: start;
      gap: 4px !important;
      padding: 18px 14px !important;
      border: 0 !important;
      border-right: 1px solid var(--glass-border) !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      /* The token, not a literal. This is the same dock that sits at the
         bottom on a phone, so it takes the dock's own colour, and that one
         is redefined for the day theme. The literal it replaced was a dark
         brown at 45%, which over the cream day background turned grey. */
      background: var(--dock-bg) !important;
    }
    .lab-nav button {
      display: flex !important;
      /* the dock stacks icon over label; a sidebar row reads left to right */
      flex-direction: row !important;
      align-items: center !important;
      justify-content: flex-start !important;
      gap: 11px;
      height: auto !important;
      min-height: 44px !important;
      padding: 11px 12px !important;
      border-radius: 12px !important;
      font-size: 15px !important;
      text-align: left;
    }
    .lab-nav i { margin: 0 !important; width: 22px; text-align: center; }

    /* Home: the hero keeps the left, what you tap sits beside it, and the
       climb spans both. `display: contents` above means the phone never
       sees this wrapper at all. */
    .home-split {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
      grid-template-areas: "hero actions" "climb climb";
      gap: 18px;
      align-items: start;
    }
    .home-split-hero { grid-area: hero; }
    .home-split-actions { grid-area: actions; }
    .home-split-climb { grid-area: climb; }
    .home-shortcuts { grid-template-columns: 1fr; }

    /* Leaderboard: the podium and the standings together, so a player sees
       their own row without scrolling past the top three. */
    /* Two columns only when there is a list to put in the second one: with
       three players or fewer everybody is on the podium, and half the width
       would sit empty beside it. */
    .board-split-two { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr); gap: 20px; align-items: start; }

    /* ---- Practice: the two shelves side by side -------------------------
       The shelves hold one card each, so stacked they left a 1080px-wide
       button around 310px of content. Side by side each card gets a column
       of about 530px, which is close to the 560px the forms use. */
    .screen-practice {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px 18px;
      align-content: start;
    }
    .screen-practice > .lab-eyebrow,
    .screen-practice > .lab-title,
    .screen-practice > .lab-intro { grid-column: 1 / -1; }

    /* ---- Know the chart: the controls beside the list -------------------
       The list is 91 rows and over 8000px tall. Putting the service tabs and
       the search in a sticky column means the reader keeps their filters
       while scrolling it, which is the only reason this screen earns a
       second column at all. */
    .screen-chart {
      display: grid;
      grid-template-columns: minmax(0, 320px) minmax(0, 1fr);
      gap: 14px 26px;
      align-content: start;
    }
    .screen-chart > .lab-eyebrow,
    .screen-chart > .lab-title,
    .screen-chart > .lab-intro,
    .screen-chart > .lab-disclaimer { grid-column: 1 / -1; }
    .screen-chart > .chart-aside {
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: sticky;
      /* Clears the sticky header, whose bottom edge measures 61px here.
         At 18px the service tabs slid underneath it while scrolling. */
      top: 74px;
      align-self: start;
    }
    .screen-chart > #chart-rows { grid-column: 2; }

    /* ---- Profile: the numbers beside the climb --------------------------
       Only the panel splits. The identity banner above it stays full width,
       because it reads as a header for both columns. */
    .screen-profile > #profile-panel {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px 18px;
      align-items: start;
    }
    .screen-profile > #profile-panel > #pf-history { grid-column: 1 / -1; }

    /* Everything in the panel that is not one of the choices crosses both
       columns, so the choices pair from the first row down.

       Without this the panel laid out whatever it was given, in order, two
       per row. Back is prepended to the panel, so it took the first cell:
       the first choice was pushed into the right column and every row below
       it was offset by one, which is the stagger in the owner's screenshots
       of 2026-11-26. The tail (the version line, the security badge and the
       privacy link) was dealt into cells the same way, which is why the
       badge and the link sat under different columns on the owner and
       non-owner screens.

       The arrow's own alignment is not here: it is on .lab-back itself, so
       every screen that carries one gets it, the phone included. */
    .screen-profile > #profile-panel > .lab-back {
      grid-column: 1 / -1;
      justify-self: start;
    }
    .screen-profile > #profile-panel > #profile-version,
    .screen-profile > #profile-panel > .profile-security,
    .screen-profile > #profile-panel > .auth-footer { grid-column: 1 / -1; }

    /* ---- Owner tools: the actions in two columns ------------------------ */
    .screen-owner {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px 18px;
      align-content: start;
    }
    .screen-owner > .lab-eyebrow,
    .screen-owner > .lab-title,
    .screen-owner > .lab-intro,
    .screen-owner > .ghost,
    .screen-owner > .lab-disclaimer { grid-column: 1 / -1; }

    /* ---- Promotion: a decision, so it stays narrow ----------------------
       Offer, result and celebration are all one choice or one verdict. They
       follow the form rule, not the list rule.

       The `.lab-main >` is load-bearing, not decoration: the --desk-col rule
       above is `.lab-main > .lab-screen`, two classes, so a bare
       `.screen-promo` loses to it and the screen stayed 1080px wide. */
    .lab-main > .screen-promo { max-width: 560px; }

    /* ---- Results and Shift log: reading, so they keep a measure ----------
       #382 moved both inside the shell, which made them full-column (1080px
       measured at 1440). The explanation under a missort is prose and the log
       rows are one line each, so they follow the form rule like the promo
       above -- and for the same reason that needs `.lab-main >`: the
       --desk-col rule is two classes and a bare class would lose to it. */
    .lab-main > .screen-results, .lab-main > .screen-log { max-width: 560px; }

    /* Narrow on purpose. */
    #rq-play { max-width: 560px; margin-inline: auto; }
    .lab-screen > .lab-choice, .auth-screen { max-width: 560px; margin-inline: auto; }
    .lab-screen .field, .lab-screen .glass-input { max-width: 560px; }

    /* A keyboard is a desktop certainty, so the key that answers is drawn on
       the belt and focus is always visible. */
    .belt-key::before { content: attr(data-key); }
    .belt-key {
      display: inline-grid; place-items: center; min-width: 22px; height: 22px;
      margin-left: 9px; padding: 0 6px; border-radius: 6px; vertical-align: 2px;
      background: rgba(0, 0, 0, 0.35); font-size: 12px; font-weight: 800;
    }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  }
</style>
