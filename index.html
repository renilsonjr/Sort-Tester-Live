<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sort Lab · Saddle Brook Twilight</title>
<style>
  :root {
    --bg: #fbfaf6; --panel: #ffffff; --sunk: #e9eee9;
    --ink: #193042; --muted: #61717a; --line: #dbe2dd;
    --accent: #193042; --accent-ink: #ffffff;
    --good: #295b38; --bad: #a3332c;
  }
  * { box-sizing: border-box; }

  /* The Artifact host injects this; nothing else does. Without it a class that
     sets `display` beats the browser's default [hidden] rule, and .bail below
     sets display:flex — so the stop panel would sit open over every card. */
  [hidden] { display: none !important; }

  body {
    /* The Artifact host injects a reset, but the Pages weblayer does not. Without
       this the browser's default 8px body margin overflows the 100dvh card
       screen and every card scrolls. */
    margin: 0;
    background: #e9eee9; color: var(--ink);
    font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 16px; line-height: 1.45; -webkit-text-size-adjust: 100%;
  }
  #app { margin: 0 auto; background: var(--bg); box-shadow: 0 16px 70px #1b3c4a1c; }
  #app.quiz-page { max-width: 520px; min-height: 100dvh; padding: 20px 16px 48px; }
  #app.lab-page { max-width: 430px; min-height: 100dvh; }
  .screen { display: flex; flex-direction: column; gap: 16px; }

  h1 { font-family: "Space Grotesk", sans-serif; font-size: 28px; font-weight: 700; margin: 0; letter-spacing: -0.04em; }
  h2 { font-size: 12px; margin: 6px 0 0; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); font-weight: 600; }
  .sub { margin: -10px 0 0; color: var(--muted); font-size: 14px; }
  .notice { margin: 0; color: var(--bad); font-size: 14px; font-weight: 600; }
  .warn { margin: 0; color: var(--muted); font-size: 13px; }
  .disclaimer {
    margin: 8px 0 0; padding: 14px 16px; border: 1px solid var(--line);
    border-radius: 12px; color: var(--muted); background: var(--panel);
    font-size: 13px; line-height: 1.5;
  }
  .disclaimer strong { color: var(--ink); }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; }
  input {
    font: inherit; font-size: 18px; padding: 15px; border-radius: 12px; width: 100%;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  button { font: inherit; cursor: pointer; border: 0; }
  .primary {
    background: var(--accent); color: var(--accent-ink);
    padding: 17px; border-radius: 12px; font-size: 17px; font-weight: 600;
  }
  .ghost {
    background: transparent; color: var(--ink);
    border: 1px solid var(--line); padding: 14px; border-radius: 12px; font-size: 15px;
  }
  .ghost.danger { color: var(--bad); }

  .decks { display: flex; flex-direction: column; gap: 10px; }
  .deckbtn {
    display: flex; flex-direction: column; gap: 2px; text-align: left;
    background: var(--panel); border: 1px solid var(--line); color: var(--ink);
    border-radius: 12px; padding: 15px 16px;
  }
  .deckbtn .dname { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .dsort {
    font-style: normal; font-size: 10px; font-weight: 700;
    letter-spacing: 0.12em; text-transform: uppercase;
    border: 1px solid var(--line); border-radius: 999px;
    padding: 2px 8px; color: var(--muted);
  }
  .deckbtn .dblurb { font-size: 14px; color: var(--muted); }
  .deckbtn .dmeta {
    font-size: 11px; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.1em; font-weight: 600; margin-top: 5px;
  }
  .deckbtn.locked { opacity: 0.5; border-style: dashed; cursor: default; }
  .deckname { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; margin-top: -10px; }

  .progress { font-size: 12px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; }
  .progress-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .progress-row .progress { margin: 0; }
  .stopbtn {
    background: transparent; color: var(--muted);
    border: 1px solid var(--line); padding: 6px 14px; border-radius: 999px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    flex-shrink: 0;
  }
  .stopbtn:active { color: var(--bad); border-color: var(--bad); }

  /* The card fills the phone so the belt pads sit low, in thumb reach, instead
     of floating in the upper half with dead space beneath them. */
  .card-screen, .feedback {
    min-height: calc(100vh - 68px);
    min-height: calc(100dvh - 68px);
  }
  .card-screen { justify-content: space-between; }
  .feedback { justify-content: center; }

  .prompt { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  /* The card is sized to the phone it is held in: every dimension scales with
     viewport height between a small-phone floor and a large-phone ceiling, so
     the prompt and the pads both grow to fill the screen without overflowing a
     short one. vh first, dvh second for browsers that support it. */
  .ring {
    --ring: clamp(92px, 13.5vh, 118px);
    --ring: clamp(92px, 13.5dvh, 118px);
    width: var(--ring); height: var(--ring); border-radius: 50%;
    display: grid; place-items: center; margin-bottom: 2px;
    background: conic-gradient(var(--accent) 0 100%, var(--sunk) 100% 100%);
  }
  .ring i {
    width: calc(var(--ring) - 15px); height: calc(var(--ring) - 15px);
    border-radius: 50%; background: var(--bg);
    display: grid; place-items: center; font-style: normal; font-weight: 700;
    font-size: clamp(28px, 4.6vh, 38px);
    font-size: clamp(28px, 4.6dvh, 38px);
    font-variant-numeric: tabular-nums;
  }
  .p-line {
    font-size: clamp(18px, 2.7vh, 23px);
    font-size: clamp(18px, 2.7dvh, 23px);
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink); font-weight: 700; text-align: center;
  }
  .p-code {
    font-size: clamp(58px, 10.5vh, 86px);
    font-size: clamp(58px, 10.5dvh, 86px);
    font-weight: 700; letter-spacing: -0.015em; line-height: 1.02;
    font-variant-numeric: tabular-nums; text-align: center;
  }
  .prompt.small .p-code {
    font-size: clamp(36px, 6.4vh, 54px);
    font-size: clamp(36px, 6.4dvh, 54px);
  }

  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .belt {
    padding: 8px; border-radius: 18px; font-weight: 700; letter-spacing: 0.05em;
    font-size: clamp(19px, 2.9vh, 25px);
    font-size: clamp(19px, 2.9dvh, 25px);
    min-height: clamp(100px, 15.5vh, 146px);
    min-height: clamp(100px, 15.5dvh, 146px);
  }

  .bail {
    position: fixed; inset: 0; z-index: 10;
    background: var(--bg); padding: 24px 20px;
    display: flex; flex-direction: column; justify-content: center; gap: 12px;
  }
  .bail h1 { text-align: center; }
  .bail .sub { margin: 0 0 8px; text-align: center; max-width: 34ch; align-self: center; }

  .feedback { align-items: center; text-align: center; }
  .verdict {
    font-weight: 700;
    font-size: clamp(26px, 3.9vh, 34px);
    font-size: clamp(26px, 3.9dvh, 34px);
  }
  .feedback.good .verdict { color: var(--good); }
  .feedback.bad .verdict { color: var(--bad); }
  .answer {
    padding: clamp(20px, 3.2vh, 30px); border-radius: 18px; font-weight: 700;
    letter-spacing: 0.05em; align-self: stretch;
    font-size: clamp(24px, 3.6vh, 32px);
    font-size: clamp(24px, 3.6dvh, 32px);
  }
  .why { color: var(--muted); font-size: 14px; margin: 0; max-width: 42ch; }

  .score-line { display: flex; gap: 34px; }
  .big { font-size: 46px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; font-variant-numeric: tabular-nums; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); font-weight: 600; margin-top: 4px; }
  .who { font-size: 18px; font-weight: 600; }
  .clean { color: var(--good); font-weight: 600; margin: 0; }

  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .missed li { border-left: 3px solid var(--bad); padding: 2px 0 2px 12px; }
  .mcard { font-weight: 700; font-size: 15px; letter-spacing: 0.02em; }
  .mans { font-size: 14px; margin: 1px 0 4px; }
  .mans.timeout { color: var(--muted); }
  .logl li {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px;
    display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: baseline;
  }
  .logl .sc { font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
  .logl .when { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
  .logmiss { grid-column: 1 / -1; margin-top: 8px; gap: 7px; }
  .logmiss li {
    background: none; border: 0; border-left: 3px solid var(--bad);
    border-radius: 0; padding: 0 0 0 10px; display: block;
  }
  .logmiss .mcard { font-size: 14px; }
  .logmiss .mans { font-size: 13px; margin: 0; }
  .exportnote { margin: 0; font-size: 13px; color: var(--muted); }
  .exportnote.bad { color: var(--bad); }
  .logclean { grid-column: 1 / -1; font-size: 13px; color: var(--good); font-weight: 600; margin-top: 4px; }

  /* Approved Sort Lab home and study design. The timed card stays on its own
     full-height screen so the belt buttons remain in thumb reach. */
  .lab-shell { min-height: 100dvh; display: flex; flex-direction: column; }
  .lab-top { display: flex; flex-direction: column; gap: 8px; padding: 25px 22px 18px; }
  .lab-top-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .lab-site { color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
  .lab-brand { display: flex; align-items: center; gap: 10px; font: 700 20px "Space Grotesk", sans-serif; letter-spacing: -.05em; white-space: nowrap; }
  .lab-mark { display: grid; place-items: center; width: 34px; height: 34px; flex: none; background: var(--ink); color: #fff; border-radius: 11px; font-size: 13px; transform: rotate(-5deg); }
  .lab-tag { color: #1d5d83; background: #e9f1f4; padding: 6px 9px; border-radius: 999px; font-size: 10px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; text-align: center; }
  .lab-main { flex: 1; padding: 0 22px 105px; }
  .lab-screen { display: flex; flex-direction: column; gap: 12px; }
  .lab-eyebrow { margin: 0; color: #a04b2a; font-size: 11px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
  .lab-title { font-size: clamp(34px, 9vw, 42px); line-height: 1.06; margin: 0; }
  .lab-intro { margin: 0 0 8px; color: var(--muted); font-size: 15px; line-height: 1.5; }
  .lab-hero { position: relative; overflow: hidden; border-radius: 25px; padding: 25px 22px 21px; background: #dfebe7; margin-bottom: 7px; }
  .lab-hero::before { content: ""; position: absolute; width: 180px; height: 180px; border: 1px solid #a5c6bf; border-radius: 50%; right: -55px; top: -88px; box-shadow: 0 0 0 34px #cfe2dc, 0 0 0 35px #b4d0c7; }
  .lab-hero > * { position: relative; }
  .lab-hero .lab-eyebrow { color: #2d745f; margin-bottom: 10px; }
  .lab-hero h1 { max-width: 310px; font-size: clamp(35px, 10vw, 46px); line-height: 1.04; margin-bottom: 14px; }
  .lab-hero p:not(.lab-eyebrow) { max-width: 300px; margin: 0; color: #36575b; font-size: 15px; line-height: 1.5; }
  .lab-route { display: flex; gap: 7px; margin-top: 18px; }
  .lab-route span { height: 8px; flex: 1; border-radius: 999px; background: #e9c355; }
  .lab-route span:nth-child(2) { background: #e77e53; }
  .lab-route span:nth-child(3) { background: #42769d; }
  .lab-route span:nth-child(4) { background: #9e4c76; }
  .lab-section-heading { margin: 3px 0 0; color: var(--ink); font: 700 17px "Space Grotesk", sans-serif; letter-spacing: -.04em; text-transform: none; }
  .lab-choice { width: 100%; display: flex; align-items: center; gap: 14px; text-align: left; border: 1px solid var(--line); border-radius: 19px; background: #fff; color: var(--ink); padding: 16px; box-shadow: 0 3px 12px #1c405208; }
  .lab-choice-icon { display: grid; place-items: center; width: 49px; height: 49px; flex: none; border-radius: 15px; background: #e8f0ee; color: #28735e; font: 700 20px "Space Grotesk", sans-serif; }
  .lab-choice-quiz .lab-choice-icon { background: #fff0e7; color: #bc5b30; }
  .lab-choice strong, .lab-choice small { display: block; }
  .lab-choice strong { font-size: 16px; }
  .lab-choice small { color: var(--muted); margin-top: 3px; font-size: 12px; line-height: 1.35; }
  .lab-arrow { margin-left: auto; color: #8fa6ac; font-size: 22px; }
  .lab-log-link { display: flex; justify-content: space-between; align-items: center; padding: 11px 3px; background: none; color: #1d5d83; font-size: 14px; font-weight: 800; text-align: left; }
  .lab-log-link span:last-child { margin-left: auto; font-size: 20px; }
  .lab-disclaimer { border: 1px solid #e6e2d7; background: #f6f3e9; padding: 13px 14px; border-radius: 15px; color: #566165; font-size: 12px; line-height: 1.5; }
  .lab-disclaimer strong { color: var(--ink); }
  .lab-nav { position: fixed; z-index: 20; left: 50%; bottom: 0; transform: translateX(-50%); width: min(100%, 430px); display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 10px 18px max(10px, env(safe-area-inset-bottom)); background: #fbfaf6ed; backdrop-filter: blur(15px); border-top: 1px solid var(--line); }
  .lab-nav button { border: 0; border-radius: 11px; background: transparent; color: #72818a; padding: 8px 5px; font-size: 12px; font-weight: 700; }
  .lab-nav button[aria-current="page"] { background: #e9f0ec; color: var(--ink); }
  .lab-nav i { display: block; margin: 0 auto 3px; font: 700 18px "Space Grotesk", sans-serif; }
  .lab-study-sections { display: flex; flex-direction: column; gap: 10px; margin: 6px 0; }
  .lab-study-card { border: 1px solid var(--line); border-radius: 19px; background: #fff; overflow: hidden; }
  .lab-study-card summary { list-style: none; display: flex; align-items: center; gap: 13px; padding: 16px; cursor: pointer; }
  .lab-study-card summary::-webkit-details-marker { display: none; }
  .lab-study-card summary::after { content: "+"; margin-left: auto; font: 600 24px "Space Grotesk", sans-serif; color: #7f9698; }
  .lab-study-card[open] summary::after { content: "−"; }
  .lab-count { display: grid; place-items: center; width: 39px; height: 39px; flex: none; background: #eef1ec; border-radius: 12px; color: #557461; font: 700 14px "Space Grotesk", sans-serif; }
  .lab-study-card summary strong, .lab-study-card summary small { display: block; }
  .lab-study-card summary strong { font-size: 15px; }
  .lab-study-card summary small { color: var(--muted); margin-top: 3px; font-size: 12px; line-height: 1.35; }
  .lab-study-body { border-top: 1px solid var(--line); padding: 16px; }
  .lab-sort-tabs { display: flex; gap: 7px; margin-bottom: 15px; }
  .lab-sort-tabs button { border: 1px solid var(--line); border-radius: 999px; background: #fff; color: var(--ink); padding: 8px 13px; font-size: 12px; font-weight: 700; }
  .lab-sort-tabs button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .lab-study-cards { display: flex; flex-direction: column; gap: 10px; }
  .lab-study-row { background: #f5f7f4; border-radius: 13px; padding: 14px; }
  .lab-study-meta { color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
  .lab-study-answer { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 5px 0; }
  .lab-study-answer strong { font: 700 22px "Space Grotesk", sans-serif; letter-spacing: -.04em; }
  .lab-belt-chip { min-width: 72px; padding: 9px 11px; border-radius: 10px; text-align: center; font-size: 12px; font-weight: 800; letter-spacing: .05em; }
  .lab-study-row p { margin: 6px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
  .lab-main .field { margin: 8px 0; }
  .lab-main .decks { margin: 6px 0; }
  .lab-main .deckbtn { border-radius: 19px; padding: 16px; box-shadow: 0 3px 12px #1c405208; }
  .lab-main .deckbtn .dname { font-family: "Space Grotesk", sans-serif; letter-spacing: -.03em; }

  /* The approved Twilight redesign: a plain black and white interface with
     the mascot's muted blue. Belt answer colors still come from BELT_STYLE. */
  :root { --bg: #fff; --panel: #fff; --sunk: #e9edf1; --ink: #17191d; --muted: #565d67; --line: #d9dde2; --accent: #17191d; }
  body { background: #e9edf1; color: var(--ink); font-family: Arial, Helvetica, sans-serif; }
  h1, .lab-brand, .lab-section-heading, .lab-choice-icon, .lab-main .deckbtn .dname, .lab-nav i { font-family: Arial, Helvetica, sans-serif; }
  #app { box-shadow: 0 12px 45px #1c2a3b18; }
  .lab-top { padding: 20px 22px 15px; border-bottom: 1px solid var(--line); gap: 8px; }
  .lab-brand { font-size: 19px; font-weight: 800; letter-spacing: -.035em; }
  .lab-mark { border-radius: 5px; transform: none; }
  .lab-tag { border: 1px solid #b7c9df; border-radius: 0; background: #eaf2fa; color: #293d56; font-size: 9px; letter-spacing: .04em; }
  .lab-site { letter-spacing: .055em; }
  .lab-main { padding: 20px 22px 100px; }
  .lab-eyebrow { color: var(--ink); letter-spacing: .13em; }
  .lab-title { font-size: 35px; font-weight: 800; letter-spacing: -.065em; }
  .lab-hero { border: 1px solid #c8d7e7; border-radius: 0; background: #d8e5f4; padding: 0; margin: 0; }
  .lab-hero::before { content: none; }
  .lab-hero-copy { padding: 22px 20px 8px; }
  .lab-hero .lab-eyebrow { color: var(--ink); margin-bottom: 10px; }
  .lab-hero h1 { font: 800 35px/1.02 Arial, Helvetica, sans-serif; letter-spacing: -.065em; margin: 0; }
  .lab-hero p:not(.lab-eyebrow) { margin: 12px 0 0; color: var(--ink); font-size: 14px; }
  .lab-mascot { display: block; width: 100%; height: 225px; object-fit: cover; object-position: 50% 46%; }
  .lab-section-heading { margin: 16px 0 1px; font-size: 20px; font-weight: 800; }
  .lab-choice { border-radius: 0; box-shadow: none; padding: 17px 15px; }
  .lab-choice-icon, .lab-choice-quiz .lab-choice-icon { border: 1px solid #d9e5f2; border-radius: 0; background: #edf3fa; color: var(--ink); width: 44px; height: 44px; font-size: 17px; }
  .lab-arrow { color: var(--ink); }
  .lab-log-link { color: #263c58; }
  .lab-disclaimer { border-color: var(--line); border-radius: 0; background: #f5f6f7; color: var(--muted); }
  .lab-nav { background: #fff; backdrop-filter: none; gap: 0; padding: 0 max(0px, env(safe-area-inset-right)) max(0px, env(safe-area-inset-bottom)) max(0px, env(safe-area-inset-left)); }
  .lab-nav button { border-radius: 0; padding: 10px 5px 12px; }
  .lab-nav button[aria-current="page"] { background: #fff; box-shadow: inset 0 3px var(--ink); }
  .lab-main .deckbtn, .ghost, .primary, input { border-radius: 0; }
  .lab-main .deckbtn { box-shadow: none; }
  .lab-main .deckbtn .dname { letter-spacing: 0; }
  .lab-picker-heading { margin: 16px 0 2px; font-size: 16px; letter-spacing: -.02em; text-transform: none; color: var(--ink); }
  .lab-service-tabs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; margin: 9px 0 18px; }
  .lab-service-tabs button { border: 1px solid var(--line); background: #fff; color: var(--ink); padding: 11px 8px; font-size: 13px; font-weight: 700; }
  .lab-service-tabs button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: #fff; }
  .lab-chart-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; border-bottom: 2px solid var(--ink); padding: 8px 0; }
  .lab-chart-heading strong { font-size: 17px; }
  .lab-chart-heading span, .lab-chart-count { color: var(--muted); font-size: 12px; }
  .lab-chart-count { margin: 7px 0 12px; }
  .lab-search-label { display: block; margin-bottom: 6px; font-size: 11px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
  .lab-chart-search { width: 100%; padding: 12px; margin: 0 0 12px; border: 1px solid var(--line); font-size: 15px; }
  .lab-chart-block { margin: 22px 0 3px; font-size: 13px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--ink); }
  .lab-chart-row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .lab-chart-state, .lab-chart-row small { display: block; color: var(--muted); font-size: 12px; }
  .lab-chart-row strong { display: block; margin-top: 2px; font-size: 17px; }
  .lab-chart-row small { margin-top: 2px; font-size: 11px; }
  .lab-chart-row .lab-belt-chip { min-width: 75px; border-radius: 0; padding: 7px 8px; font-size: 11px; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<main id="app"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
