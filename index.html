<style>
  /* The opening mark: drawn by this page alone, before any script runs,
     so the screen is never bare while the modules load. The app's first
     render replaces the whole of #app, which removes it; nothing has to
     remember to. The owner asked for the RJ mark spinning (2026-11-26).
     The spin runs 45 turns, not forever: the page bans looping animation
     (the celebration tests hold it to that), and a load still going after
     a minute has bigger problems than a mark at rest. */
  .boot { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  .boot-mark { width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, #f7c948, #e0a82e); color: #3b2a12; font-weight: 900; font-size: 22px; display: grid; place-items: center; animation: boot-spin 1.6s cubic-bezier(.45,.1,.35,.9) 45; }
  .boot-name { color: var(--muted, #b9a88f); font-weight: 800; letter-spacing: .04em; }
  @keyframes boot-spin { 0% { transform: rotate(0); } 55% { transform: rotate(360deg); } 100% { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .boot-mark { animation: none; } }
  @font-face {
    font-family: Nunito;
    src: url("assets/nunito-variable.ttf") format("truetype");
    font-style: normal;
    font-weight: 200 1000;
    font-display: swap;
  }
  /* One palette, from mockups/design-library (the approved brown, gold and
     warm white refresh). Two later :root blocks used to stack on top of this
     one; they are gone, so these values are the ones in force. Belt colours
     come from BELT_STYLE in src/belts.js and are routing information, never
     restyled here. */
  :root {
    /* Twilight palette (dark glass). Belt colours stay in BELT_STYLE
       (src/belts.js) and are routing information, never restyled. */
    --bg: #140d09; --panel: #241811; --sunk: #1a110a;
    --ink: #fffdf8; --muted: #c9bbab; --line: rgba(255, 255, 255, 0.12);
    --accent: #38261b; --accent-ink: #fffdf8;
    --gold: #f4bd38; --gold-line: #b47d15;
    --soft: rgba(244, 189, 56, 0.14); --soft-line: rgba(244, 189, 56, 0.3);
    /* The focus ring follows the gold, which the day theme redefines to a
       darker #c98a10 that reads on cream. It used to be #6db6ff -- the only
       blue in a brown-and-gold app, and it showed on the sign-in code field,
       the new-account username, the quiz name field and the chart search
       (#327). The ring sits 4px outside the control, so it lands on the page
       background, not on a gold button, in both themes. */
    /* Any thin gold line drawn ON the page background rather than on a card:
       the focus ring, and the ring marking the current badge (#337). Both
       need the same thing -- a gold that survives on this theme's page -- and
       the day theme's plain gold does not, so they share one value here and
       stay separate tokens, in case the focus ring ever has to change on its
       own for an accessibility preference. */
    --gold-ring: var(--gold);
    --focus: var(--gold-ring); --good: #6cd39a; --bad: #f08a8a;
  }
  * { box-sizing: border-box; }

  /* The Artifact host injects this; nothing else does. Without it a class that
     sets `display` beats the browser's default [hidden] rule, and .bail below
     sets display:flex — so the stop panel would sit open over every card. */
  [hidden] { display: none !important; }

  body {
    /* The Artifact host injects a reset, but the Pages weblayer does not. Without
       this the browser's default 8px body margin overflows the 100dvh card
       screen and every card scrolls. */
    margin: 0;
    background: radial-gradient(130% 90% at 50% -10%, #2b1b11 0%, #160d07 52%, #0a0504 100%) fixed;
    color: var(--ink);
    font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 16px; line-height: 1.45; -webkit-text-size-adjust: 100%;
    /* DM Sans at 600-900 weight over a dark background renders heavier than
       it should with subpixel antialiasing; this is the macOS/iOS pair that
       drops to grayscale so the letterforms keep their drawn weight (#349).
       It applies in both themes, and was checked on the cream day
       background too, where the text is dark on light. */
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* Headings get `balance`, which evens the lines of a short block so a
     two-word title does not leave one word alone on line two. Body copy gets
     `pretty`, which only pulls back orphans and leaves the rest of the
     ragged edge alone -- `balance` on a paragraph would reflow every line.
     Checked in Spanish as well, where the same strings run longer (#348).

     `.lab-section-heading` is deliberately NOT in this list. It is styled in
     four places in this file but nothing ever renders it -- the eyebrow
     labels are `.lab-eyebrow` -- so adding a declaration to it would be dead
     CSS of exactly the kind #343 was about. */
  h1, h2, .home-spot-title {
    text-wrap: balance;
  }
  .lab-disclaimer, .home-short small, .lab-choice small {
    text-wrap: pretty;
  }
  #app { margin: 0 auto; background: var(--bg); box-shadow: 0 16px 70px #38261b1c; }
  #app.quiz-page { max-width: 520px; min-height: 100dvh; padding: 20px 16px 48px; }
  #app.lab-page { max-width: 430px; min-height: 100dvh; }
  .screen { display: flex; flex-direction: column; gap: 16px; }

  h1 { font-family: "Space Grotesk", sans-serif; font-size: 28px; font-weight: 700; margin: 0; letter-spacing: -0.04em; }
  h2 { font-size: 12px; margin: 6px 0 0; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); font-weight: 600; }
  .sub { margin: -10px 0 0; color: var(--muted); font-size: 14px; }
  .notice { margin: 0; color: var(--bad); font-size: 14px; font-weight: 600; }
  /* The same line after an action that worked: a result, not a warning. */
  .notice.done { color: var(--good); }
  /* The running version, at the foot of Settings (#274). Quiet on purpose:
     there when it is looked for, invisible when it is not. */
  .profile-version { margin: 14px 0 0; text-align: center; color: var(--muted); font-size: 12px; font-weight: 700; }
  .profile-security { margin: 10px 0 0; text-align: center; }
  .security-badge-link { display: inline-block; border-radius: 6px; line-height: 0; }
  .security-badge-link:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  .security-badge { display: block; width: 150px; height: 50px; border-radius: 4px; }
  /* The fifteen profile icons (#272): a tappable grid, 48px targets. */
  .avatar-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 4px 0 10px; }
  .avatar-pick { min-height: 56px; font-size: 26px; line-height: 1; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); cursor: pointer; }
  .avatar-pick[aria-pressed="true"] { border-color: var(--gold); box-shadow: inset 0 0 0 2px var(--gold); }
  .avatar-pick:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  /* The chosen icon (#272). It replaces a letter, so it was drawn at a
     letter's size and left most of the podium disc empty; the owner asked
     for it to fill the circle. Emoji carry their own padding, so ~0.78 of
     the disc is what actually touches the edges. */
  .pdisc.has-avatar { font-size: 36px; line-height: 1; }
  .pslot.p1 .pdisc.has-avatar { font-size: 44px; line-height: 1; }
  /* The profile keeps the podium's size, which is what the owner asked for. */
  .pf-avatar:not(:empty) { display: block; font-size: 36px; line-height: 1; margin: 0 0 2px; }
  .board-avatar { margin-right: 8px; font-size: 22px; line-height: 1; vertical-align: -3px; }
  .warn { margin: 0; color: var(--muted); font-size: 13px; }
  .disclaimer {
    margin: 8px 0 0; padding: 14px 16px; border: 1px solid var(--line);
    border-radius: 12px; color: var(--muted); background: var(--panel);
    font-size: 13px; line-height: 1.5;
  }
  .disclaimer strong { color: var(--ink); }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; }
  input {
    font: inherit; font-size: 18px; padding: 15px; border-radius: 12px; width: 100%;
    /* Frosted like every other surface (mockup `.glass-input`). A lighter
       blur than the cards, so a field reads as something you type into
       rather than another panel. */
    border: 1px solid var(--glass-border-subtle); color: var(--ink);
    background: var(--glass-surface-sub);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  input:focus-visible, button:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }

  button { font: inherit; cursor: pointer; border: 0; }
  .primary {
    background: var(--accent); color: var(--accent-ink);
    padding: 17px; border-radius: 12px; font-size: 17px; font-weight: 600;
  }
  /* The mockup's `.btn-secondary`. `.primary` is deliberately left solid:
     an action that should stand out cannot be made of the same material
     as the panel behind it. */
  .ghost {
    background: var(--glass-surface-sub); color: var(--ink);
    backdrop-filter: var(--blur-md); -webkit-backdrop-filter: var(--blur-md);
    border: 1px solid var(--glass-border); padding: 14px; border-radius: 12px; font-size: 15px;
  }
  .ghost.danger { color: var(--bad); }

  #auth-panel {
    position: fixed; inset: 0; z-index: 100;
    /* Transparent on purpose. This panel covers the whole viewport above
       everything else, so an opaque fill here hides the ambient lighting
       and makes every frosted surface on the entry screen read as plain
       white -- the design was applied correctly and simply could not be
       seen. The page keeps its own background behind it. */
    background: transparent; display: flex; flex-direction: column; align-items: center;
    padding: 20px; overflow-y: auto;
  }
  .auth-screen { width: min(360px, 100%); margin-block: auto; flex-shrink: 0; display: flex; flex-direction: column; gap: 14px; }
  .auth-choices { display: flex; flex-direction: column; gap: 14px; }
  .auth-buttons { display: flex; flex-direction: column; gap: 10px; }
  /* The approved entry screen: two cards that say what each way in gives
     you. See mockups/entry-navigation.html. */
  .auth-brand { display: flex; align-items: center; gap: 10px; font-size: 21px; font-weight: 900; letter-spacing: -.05em; }
  .auth-card { display: flex; flex-direction: column; gap: 8px; padding: 17px; border-radius: 20px; background: var(--soft); border: 1px solid var(--soft-line); }
  /* Translucent, so the guest card is the same material as the one
     beside it. An opaque fill here outranks the glass rule, which is
     how one card ended up solid next to a frosted one. */
  .auth-card.guest { background: rgba(232, 239, 223, 0.58); border-color: #c4d3b4; }
  .auth-card h2 { margin: 0; font-size: 19px; font-weight: 900; letter-spacing: -.035em; text-transform: none; color: var(--ink); }
  .auth-eyebrow { margin: 0; color: var(--accent); font-size: 11px; font-weight: 900; letter-spacing: .13em; text-transform: uppercase; }
  .auth-copy { margin: 0 0 4px; color: #54412f; font-size: 14px; line-height: 1.45; }
  .auth-screen input[readonly] { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0.05em; }
  /* The sign-up and change-code forms only tie username + code together
     for the browser's password manager; they add no box of their own, so
     the card's spacing and full-width buttons reach their fields. */
  #register-save-form, #change-code-form, #change-code-result { display: contents; }
  /* The username shown beside a new code is a name, not a code. */
  .auth-screen input#generated-username { font-family: inherit; letter-spacing: normal; }

  /* The new-account screen (#333). The code field and a Copy button sit on
     one line; the button never shrinks below the 44px touch minimum, and
     the field takes whatever is left. */
  .code-row { display: flex; gap: 8px; align-items: stretch; }
  /* Measured at 375px. The field's normal 18px with its 0.9px letter-spacing
     draws the 19-character code 36px wider than the space left beside the
     Copy button, so it scrolled sideways and the player could not see the
     whole code at once -- on the one screen where it is ever shown. At 15px
     with normal spacing the text is 172px in a 197px box: 25px of slack, so
     a slightly wider monospace fallback on another phone still fits. */
  .auth-screen .code-row input { flex: 1 1 auto; min-width: 0; font-size: 15px; letter-spacing: normal; padding-left: 10px; padding-right: 10px; }
  .code-field { position: relative; }
  .code-field .glass-input { padding-right: 64px; }
  .code-eye { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: transparent; border: 0; color: var(--gold); font-weight: 800; font-size: 13px; padding: 6px 8px; cursor: pointer; min-height: 32px; }
  .code-copy {
    flex: 0 0 auto; min-width: 72px; min-height: 44px; padding: 0 14px;
    border: 1px solid var(--gold); border-radius: 12px;
    background: transparent; color: var(--gold);
    font-size: 13px; font-weight: 800; cursor: pointer;
  }

  /* The confirmation was a raw browser checkbox, centred, with its label on
     the line below and not tied to it. It is one tappable row now: the real
     input stays in the DOM for the keyboard and for screen readers, and the
     square that is actually drawn follows its checked state. */
  .check-row {
    display: flex; align-items: center; gap: 11px;
    min-height: 44px; padding: 4px 2px; cursor: pointer; text-align: left;
  }
  /* #419: the delete-account acknowledgement shares this control instead of
     keeping the browser's own checkbox. One set of selectors, so the two
     boxes cannot drift apart again. */
  .check-row input, .delete-ack input { position: absolute; opacity: 0; width: 0; height: 0; }
  .check-box {
    flex: none; width: 22px; height: 22px; border-radius: 7px;
    border: 2px solid var(--gold); display: grid; place-items: center;
  }
  .check-box::after {
    content: "✓"; font-size: 15px; font-weight: 900; line-height: 1;
    /* #419: --accent-ink is #fffdf8 at night, and the box it sits in is
       gold in BOTH themes -- so at night the tick was white on gold,
       measured 1.70:1. The fill never changes with the theme, so neither
       should the tick: #38261b is the ink the app already puts on gold
       (the chosen service chip), 8.37:1 at night and 4.88:1 by day.
       This was already true on the account-creation screen; adopting the
       control for the delete acknowledgement is what made it worth
       fixing rather than copying. */
    color: #38261b; opacity: 0;
  }
  .check-row input:checked + .check-box, .delete-ack input:checked + .check-box { background: var(--gold); }
  .check-row input:checked + .check-box::after, .delete-ack input:checked + .check-box::after { opacity: 1; }
  .check-row input:focus-visible + .check-box, .delete-ack input:focus-visible + .check-box { outline: 3px solid var(--focus); outline-offset: 3px; }
  .check-label { font-size: 14px; font-weight: 700; color: var(--ink); }

  /* The picker's rows are .lab-choice now, the same row the Practice tab
     uses, so the .deckbtn component this file restyled in each of its four
     skin layers is gone (#331). What is left is the list that holds them,
     the third line a test row has and the Practice tab's rows do not, and
     the state for a deck not yet checked against the chart. */
  .decks { display: flex; flex-direction: column; gap: 10px; }
  .lab-choice-meta {
    font-size: 11px; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.1em; font-weight: 600; margin-top: 5px;
  }
  .lab-choice.locked { opacity: 0.5; border-style: dashed; cursor: default; }

  /* The way back from a sub-screen. It was a full-width ghost button, which
     is the shape of a primary action, sitting above the content it is meant
     to be subordinate to. The 44px minimum hit area is kept by padding, not
     by width.

     Which is also why the arrow used to sit 10px right of the title it
     belongs under: the padding that makes the target pushes the ink in.
     The negative margin moves the box back onto the title's line and
     leaves the 44px alone -- the arrow lines up, the target does not
     shrink. Measured on all twelve screens that carry it. */
  .lab-back {
    display: inline-flex; align-items: center; gap: 7px;
    align-self: flex-start; min-height: 44px; padding: 10px 14px 10px 10px;
    margin-left: -10px;
    border: 0; background: transparent; color: var(--muted);
    font-size: 14px; font-weight: 800; cursor: pointer;
  }
  .lab-back:hover { color: var(--ink); }
  .deckname { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; margin-top: -10px; }

  .progress { font-size: 12px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; }
  .progress-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .progress-row .progress { margin: 0; }
  .card-header { display: flex; flex-direction: column; gap: 4px; }
  .card-header > .stopbtn { align-self: flex-end; }
  .card-header .lab-language button { width: 38px; min-height: 44px; }
  .stopbtn {
    background: transparent; color: var(--muted);
    border: 1px solid var(--line); padding: 6px 14px; border-radius: 999px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    flex-shrink: 0;
  }
  .stopbtn:active { color: var(--bad); border-color: var(--bad); }

  /* The card fills the phone so the belt pads sit low, in thumb reach, instead
     of floating in the upper half with dead space beneath them. */
  .card-screen, .feedback {
    min-height: calc(100vh - 68px);
    min-height: calc(100dvh - 68px);
  }
  .card-screen { justify-content: space-between; }
  .feedback { justify-content: center; }

  .prompt { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  /* The card is sized to the phone it is held in: every dimension scales with
     viewport height between a small-phone floor and a large-phone ceiling, so
     the prompt and the pads both grow to fill the screen without overflowing a
     short one. vh first, dvh second for browsers that support it. */
  .ring {
    --ring: clamp(92px, 13.5vh, 118px);
    --ring: clamp(92px, 13.5dvh, 118px);
    width: var(--ring); height: var(--ring); border-radius: 50%;
    display: grid; place-items: center; margin-bottom: 2px;
    background: conic-gradient(var(--accent) 0 100%, var(--sunk) 100% 100%);
  }
  .ring i {
    width: calc(var(--ring) - 15px); height: calc(var(--ring) - 15px);
    border-radius: 50%; background: var(--bg);
    display: grid; place-items: center; font-style: normal; font-weight: 700;
    font-size: clamp(28px, 4.6vh, 38px);
    font-size: clamp(28px, 4.6dvh, 38px);
    font-variant-numeric: tabular-nums;
  }
  .p-line {
    font-size: clamp(18px, 2.7vh, 23px);
    font-size: clamp(18px, 2.7dvh, 23px);
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink); font-weight: 700; text-align: center;
  }
  .p-code {
    font-size: clamp(58px, 10.5vh, 86px);
    font-size: clamp(58px, 10.5dvh, 86px);
    font-weight: 700; letter-spacing: -0.015em; line-height: 1.02;
    font-variant-numeric: tabular-nums; text-align: center;
  }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
  .range-display { display: inline-flex; align-items: center; justify-content: center; max-width: 100%; white-space: nowrap; vertical-align: middle; }
  .range-number { line-height: 1; }
  .range-dash { display: block; flex: none; width: .48em; height: .105em; margin: 0 .025em; border-radius: 999px; background: currentColor; }
  .prompt.small .p-code {
    font-size: clamp(36px, 6.4vh, 54px);
    font-size: clamp(36px, 6.4dvh, 54px);
  }

  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .belt {
    padding: 8px; border-radius: 18px; font-weight: 700; letter-spacing: 0.05em;
    font-size: clamp(19px, 2.9vh, 25px);
    font-size: clamp(19px, 2.9dvh, 25px);
    min-height: clamp(100px, 15.5vh, 146px);
    min-height: clamp(100px, 15.5dvh, 146px);
  }

  .bail {
    position: fixed; inset: 0; z-index: 10;
    background: var(--bg); padding: 24px 20px;
    display: flex; flex-direction: column; justify-content: center; gap: 12px;
  }
  .bail h1 { text-align: center; }
  .bail .sub { margin: 0 0 8px; text-align: center; max-width: 34ch; align-self: center; }

  .feedback { align-items: center; text-align: center; }
  .verdict {
    font-weight: 700;
    font-size: clamp(26px, 3.9vh, 34px);
    font-size: clamp(26px, 3.9dvh, 34px);
  }
  .feedback.good .verdict { color: var(--good); }
  .feedback.bad .verdict { color: var(--bad); }
  /* Quiz preview approved for the live card: the supplied mascot fills its
     natural image ratio, while the timer stays between progress and Cancel. */
  .quiz-card, .quiz-feedback { gap: 12px; min-height: calc(100dvh - 68px); }
  .quiz-card { justify-content: space-between; }
  .quiz-top { display: flex; flex-direction: column; gap: 7px; }
  .quiz-topline, .quiz-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .quiz-topline { min-height: 44px; }
  /* 44 here too. This rule is overridden by the compact-header layer below,
     so it changes nothing today -- but leaving a 38px behind is exactly the
     trap #341 fell into, where three places said 44 and the one that won
     said 38. */
  .quiz-topline .lab-language button { width: 44px; }
  .quiz-actions { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); }
  .quiz-actions .stopbtn { justify-self: end; min-height: 44px; border-radius: 22px; }
  .quiz-step { color: var(--muted); font-size: 12px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; }
  .quiz-timer { width: 48px; height: 48px; border: 4px solid var(--ink); border-radius: 50%; display: grid; place-items: center; background: var(--panel); font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .quiz-timer.urgent { border-color: var(--bad); color: var(--bad); }
  .quiz-route { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .quiz-route .p-line { font-size: clamp(16px, 2.4dvh, 21px); }
  .quiz-route .p-code { font-size: clamp(48px, 10dvh, 72px); font-weight: 800; letter-spacing: -.04em; }
  .quiz-cue { margin: 0; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
  .quiz-card .options { gap: 9px; }
  .quiz-card .belt { min-height: clamp(76px, 12dvh, 104px); border-radius: 12px; }
  .quiz-feedback .verdict { line-height: 1.05; letter-spacing: -.04em; text-align: left; align-self: stretch; }
  .quiz-feedback.good .verdict { color: var(--good); }
  .quiz-feedback.bad .verdict { color: var(--bad); }
  .quiz-feedback .answer-compare { align-self: stretch; display: grid; gap: 8px; padding: 12px; border: 1px solid var(--line); background: #f3ece0; }
  .quiz-feedback .answer-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; }
  .quiz-feedback .answer-row strong { font-size: 15px; }
  .quiz-feedback .answer-row .answer { min-width: 96px; padding: 7px 10px; border-radius: 5px; font-size: 14px; text-align: center; align-self: auto; }
  .quiz-feedback .why { align-self: stretch; max-width: none; border-left: 3px solid var(--ink); padding-left: 10px; color: #54412f; }
  .quiz-feedback .primary { width: 100%; border-radius: 0; min-height: 52px; }
  .quiz-auto { margin: 0; align-self: center; color: var(--muted); font-size: 12px; text-align: center; }
  @media (max-width: 340px) { .quiz-step { font-size: 10px; letter-spacing: .02em; white-space: nowrap; } .quiz-actions .stopbtn { padding-inline: 12px; } }
  @media (max-height: 700px) { .quiz-card, .quiz-feedback { gap: 9px; } .quiz-card .belt { min-height: 76px; } }
  .answer {
    padding: clamp(20px, 3.2vh, 30px); border-radius: 18px; font-weight: 700;
    letter-spacing: 0.05em; align-self: stretch;
    font-size: clamp(24px, 3.6vh, 32px);
    font-size: clamp(24px, 3.6dvh, 32px);
  }
  .why { color: var(--muted); font-size: 14px; margin: 0; max-width: 42ch; }

  .score-line { display: flex; gap: 34px; }
  .big { font-size: 46px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; font-variant-numeric: tabular-nums; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); font-weight: 600; margin-top: 4px; }
  .who { font-size: 18px; font-weight: 600; }
  .clean { color: var(--good); font-weight: 600; margin: 0; }

  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .missed li { border-left: 3px solid var(--bad); padding: 2px 0 2px 12px; }
  .mcard { font-weight: 700; font-size: 15px; letter-spacing: 0.02em; }
  .mans { font-size: 14px; margin: 1px 0 4px; }
  .mans.timeout { color: var(--muted); }
  .logl li {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px;
    display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: baseline;
  }
  /* #412: the name column is `1fr` in a grid, and a grid item will not go
     below its own content, so one unbroken 40-character badge ID -- the
     field that writes it has no maxlength -- pushed the page 240px sideways
     at 375. `anywhere` lets the token break; `min-width: 0` lets the column
     accept the smaller size. The same guard the results card got in #388,
     in the shape this row needs. */
  .logl .who { overflow-wrap: anywhere; min-width: 0; }
  .logl .sc { font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
  .logl .when { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
  .logmiss { grid-column: 1 / -1; margin-top: 8px; gap: 7px; }
  .logmiss li {
    background: none; border: 0; border-left: 3px solid var(--bad);
    border-radius: 0; padding: 0 0 0 10px; display: block;
  }
  .logmiss .mcard { font-size: 14px; }
  .logmiss .mans { font-size: 13px; margin: 0; }
  .exportnote { margin: 0; font-size: 13px; color: var(--muted); }
  .exportnote.bad { color: var(--bad); }
  .logclean { grid-column: 1 / -1; font-size: 13px; color: var(--good); font-weight: 600; margin-top: 4px; }

  /* Approved Sort Quiz home and study design. The timed card stays on its own
     full-height screen so the belt buttons remain in thumb reach. */
  .lab-shell { min-height: 100dvh; display: flex; flex-direction: column; }
  .lab-top { display: flex; flex-direction: column; gap: 8px; padding: 25px 22px 18px; }
  .lab-top-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .lab-language { display: flex; gap: 4px; margin-left: auto; flex: none; }
  .lab-language button { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 44px; min-height: 44px; padding: 2px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); color: var(--ink); font: 800 10px/1.1 Arial, Helvetica, sans-serif; cursor: pointer; }
  /* This used to size the flag emoji that sat above the label. The flags are
     gone (#326): a flag is not a language -- Spanish is not only Spain's --
     and an 11px flag is harder to read than two letters. The rule now sizes
     the label itself, which is the only child left. */
  .lab-language button span:first-child { font-size: 13px; line-height: 1.1; }
  .lab-language button[aria-pressed="true"] { border: 2px solid var(--ink); background: #f7eac7; }
  /* This was a second blue, hardcoded -- #175e94 -- so the token change alone
     would have left the language buttons ringed in blue (#327). */
  .lab-language button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .lab-site { color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
  .lab-brand { display: flex; align-items: center; gap: 10px; font: 700 20px "Space Grotesk", sans-serif; letter-spacing: -.05em; white-space: nowrap; }
  .lab-mark { display: grid; place-items: center; width: 34px; height: 34px; flex: none; background: var(--ink); color: var(--accent-ink); border-radius: 11px; font-size: 13px; transform: rotate(-5deg); }
  .lab-tag { color: #38261b; background: #f7eac7; padding: 6px 9px; border-radius: 999px; font-size: 10px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; text-align: center; }
  .lab-main { flex: 1; padding: 0 22px 105px; }
  .lab-screen { display: flex; flex-direction: column; gap: 12px; }
  .lab-eyebrow { margin: 0; color: #8a5a12; font-size: 11px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
  .lab-title { font-size: clamp(34px, 9vw, 42px); line-height: 1.06; margin: 0; }
  .lab-intro { margin: 0 0 8px; color: var(--muted); font-size: 15px; line-height: 1.5; }
  .lab-hero { position: relative; overflow: hidden; border-radius: 25px; padding: 25px 22px 21px; background: #e8efdf; margin-bottom: 7px; }
  .lab-hero::before { content: ""; position: absolute; width: 180px; height: 180px; border: 1px solid #d6bc75; border-radius: 50%; right: -55px; top: -88px; box-shadow: 0 0 0 34px #f7eac7, 0 0 0 35px #e4d3a8; }
  .lab-hero > * { position: relative; }
  .lab-hero .lab-eyebrow { color: #38261b; margin-bottom: 10px; }
  .lab-hero h1 { max-width: 310px; font-size: clamp(35px, 10vw, 46px); line-height: 1.04; margin-bottom: 14px; }
  .lab-hero p:not(.lab-eyebrow) { max-width: 300px; margin: 0; color: #54412f; font-size: 15px; line-height: 1.5; }
  .lab-route { display: flex; gap: 7px; margin-top: 18px; }
  /* Decorative only: these four bars are not belts and carry no routing
     meaning, so they follow the warm palette. */
  .lab-route span { height: 8px; flex: 1; border-radius: 999px; background: #f4bd38; }
  .lab-route span:nth-child(2) { background: #d79a3a; }
  .lab-route span:nth-child(3) { background: #a8773f; }
  .lab-route span:nth-child(4) { background: #6e5c4d; }
  .lab-section-heading { margin: 3px 0 0; color: var(--ink); font: 700 17px "Space Grotesk", sans-serif; letter-spacing: -.04em; text-transform: none; }
  .lab-choice { width: 100%; display: flex; align-items: center; gap: 14px; text-align: left; border: 1px solid var(--line); border-radius: 19px; background: var(--panel); color: var(--ink); padding: 16px; box-shadow: 0 3px 12px #38261b0d; }
  .lab-choice-icon { display: grid; place-items: center; width: 49px; height: 49px; flex: none; border-radius: 15px; background: #e8efdf; color: #38261b; font: 700 20px "Space Grotesk", sans-serif; }
  .lab-choice-quiz .lab-choice-icon { background: #f6e2c6; color: #8a5a12; }
  .lab-choice strong, .lab-choice small { display: block; }
  .lab-choice strong { font-size: 16px; }
  .lab-choice small { color: var(--muted); margin-top: 3px; font-size: 12px; line-height: 1.35; }
  .lab-arrow { margin-left: auto; color: #9a876f; font-size: 22px; }
  .lab-log-link { display: flex; justify-content: space-between; align-items: center; padding: 11px 3px; background: none; color: #38261b; font-size: 14px; font-weight: 800; text-align: left; }
  .lab-log-link span:last-child { margin-left: auto; font-size: 20px; }
  .lab-disclaimer { border: 1px solid #ded4c5; background: #f3ece0; padding: 13px 14px; border-radius: 15px; color: #6e5c4d; font-size: 12px; line-height: 1.5; }
  .lab-disclaimer strong { color: var(--ink); }
  /* Leaderboard (#12, built to the screen approved in #16). No timestamps:
     the first-reached-score rule was superseded by tie-break quizzes. */
  .board { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  /* No `background` here: the glass rule below supplies a translucent
     one, and an opaque colour at this point would sit on top of it. */
  .board li { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 17px; padding: 12px 14px; }
  .board li.board-you { border: 2px solid var(--accent); }
  /* Tinted, not painted: an opaque fill would hide the blur that every
     other row has, and the tie marker would read as a different surface
     rather than the same one highlighted. */
  .board li.board-tied { border-color: #c79a2c; background: rgba(253, 246, 228, 0.62); }
  /* Shown only when the player is ranked past the rows the server sends,
     so their place is stated instead of being looked for in vain. */
  .board-your-place { margin: .6rem 0 0; font-size: .95rem; }
  .board b { font-weight: 900; }
  .board small { display: block; color: var(--muted); font-size: 12px; }
  .board-place { font-weight: 900; font-variant-numeric: tabular-nums; }
  /* A long username must not push the points off the row. */
  .board-who { min-width: 0; }
  .board-who b { display: block; overflow-wrap: anywhere; }
  .board-marker { grid-column: 1 / -1; margin-top: 4px; color: #7a5200; font-size: 12px; font-weight: 800; }
  /* Owner tools (#11). The approved list is not a ranking, so it is not
     the board grid: a name, the roster reference under it, and the way to
     withdraw. */
  .approved { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .approved li { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 17px; background: var(--panel); padding: 12px 14px; }
  .approved-who { min-width: 0; flex: 1; }
  .approved-who b { display: block; font-weight: 900; overflow-wrap: anywhere; }
  .approved-who small { display: block; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  /* #430: this used to carry `min-height: 0`, which cancelled the 44px that
     .ghost gives every other button in the app -- on Delete and Withdraw,
     the two most consequential actions there are. Measured at 375x812:
     70x39 and 93x39, with 36px between one Delete and the next in a list of
     37 accounts. The neighbouring `.case-actions .ghost` already keeps its
     44. The padding stays small so a long list is still scannable; the
     minimum does the rest. */
  .approved .ghost { flex: none; width: auto; min-height: 44px; padding: 9px 13px; font-size: 13px; }
  .owner-form { border: 1px solid var(--line); border-radius: 17px; background: var(--panel); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  /* #432: these were 16px/900 grey -- bigger and heavier than the eyebrow
     naming the screen above them, and a different colour from every other
     section label in the app. They are .lab-eyebrow now, and what is left
     here is only the space each one needs. Leaving the old size would have
     been dead weight for .owner-count (the eyebrow rule wins later in the
     sheet) and would have BEATEN it for `.owner-form h2`, which is one
     class plus an element. */
  .owner-count { margin-top: 4px; }
  /* Withdrawing is the one destructive thing on that screen, so it is the
     quieter button and keeping the approval is the easy one. */
  .owner-danger { color: var(--bad); border-color: #d8b6b6; }
  .owner-note { margin-top: 2px; }
  .acct-you { flex: none; color: var(--muted); font-size: 12px; font-weight: 800; }
  .acct-name { font-size: 20px; font-weight: 900; overflow-wrap: anywhere; }
  .acct-meta { color: var(--muted); font-size: 13px; }
  /* The login ID is read out loud from a phone held at arm's length, so
     it is large, spaced and selectable rather than pretty. */
  /* Case review (#11). A case is a card: who, what they said, the
     evidence, how long it is kept, and the outcomes. No sanction. */
  .cases { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .cases li { border: 1px solid var(--line); border-radius: 17px; background: var(--panel); padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .cases h2 { font-size: 17px; overflow-wrap: anywhere; }
  .case-said { margin: 0; padding-left: 11px; border-left: 3px solid var(--soft-line); color: #54412f; font-size: 14px; overflow-wrap: anywhere; }
  .case-keep { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.45; }
  .case-events { margin: 0; padding-left: 18px; color: var(--muted); font-size: 12px; }
  .case-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .case-actions .ghost { flex: 1 1 150px; width: auto; min-height: 44px; font-size: 13px; padding: 10px; }
  .lab-fold { border: 1px solid var(--line); border-radius: 13px; padding: 10px 12px; }
  .lab-fold summary { font-size: 13px; font-weight: 800; cursor: pointer; }
  /* Reauthentication (#11 box 5): a small dialog over the screen, so the
     action it guards is still visible behind it. */
  .reauth-dialog { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 16px; background: #35271e66; }
  .reauth-card { width: min(100%, 380px); display: flex; flex-direction: column; gap: 10px; padding: 18px; border-radius: 19px; background: var(--panel); box-shadow: 0 18px 50px #35271e40; }
  .reauth-card h2 { font-size: 18px; }
  /* Prize tie-break, player side (#24). The question looks like an
     ordinary Ranked one: service and code, then four belt buttons. */
  .tb-top { display: flex; justify-content: space-between; align-items: baseline; }
  .tb-bar { height: 8px; border-radius: 99px; background: #ede3d2; overflow: hidden; margin: 8px 0 14px; }
  .tb-bar i { display: block; height: 100%; width: 100%; background: var(--danger); border-radius: 99px; transition: width .2s linear; }
  .rq-prompt { text-align: center; margin: 6px 0; }
  .rq-service { color: var(--muted); font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
  .rq-code { font: 900 clamp(34px, 7dvh, 52px)/1 "Space Grotesk", sans-serif; letter-spacing: -.02em; margin-top: 4px; }
  .belts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; }
  .belts .belt { min-height: clamp(76px, 12dvh, 104px); border-radius: 14px; font-weight: 900; font-size: clamp(18px, 2.6dvh, 24px); border: 0; transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.15s ease; }
  .belts .belt:disabled { opacity: .5; }
  .belts .belt.picked { opacity: 1; outline: 3px solid var(--ink); outline-offset: 2px; }

  /* The quiz feedback rules and their keyframes used to be declared twice,
     identically, here and ~400 lines further down. The second copy won, so
     nothing ever looked wrong -- the risk was editing one and leaving the
     other behind. Only the later copy survives (#350). */
  .lab-rules { margin: 4px 0 10px 0; padding-left: 20px; color: var(--ink); font-size: 14px; line-height: 1.5; display: flex; flex-direction: column; gap: 6px; }

  /* Ranked and promotion feedback/result (built to the screens approved
     in #17): verdict heading, this question's worth, the your-choice vs
     correct-belt comparison, and the balance breakdown on a result. */
  .rq-stake { display: block; color: var(--muted); font-size: 12px; font-weight: 800; margin: 2px 0 10px; }
  .rq-verdict.good { color: var(--good); }
  .rq-verdict.bad { color: var(--bad); }
  .rq-worth { font-weight: 800; font-size: 15px; margin: 2px 0 10px; }
  .rq-worth.good { color: var(--good); }
  .rq-worth.bad { color: var(--bad); }
  .rq-cmp { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
  .rq-cmp > div { display: flex; justify-content: space-between; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; font-size: 13px; }
  .rq-cmp .chip { padding: 5px 10px; border-radius: 999px; font-weight: 900; font-size: 12px; letter-spacing: .03em; }
  /* The BLACK belt is pure #000 and vanishes on the dark app background;
     give it a light ring so the chip reads as a swatch, not a hole. */
  [data-belt="BLACK"] { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.55); }
  html[data-theme="day"] [data-belt="BLACK"] { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.25); }
  .rq-why { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 6px 0 14px; }
  .sum { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; border: 1px solid var(--line); border-radius: 15px; padding: 12px 14px; background: var(--panel); }
  .sum > div { display: flex; justify-content: space-between; font-size: 14px; }
  .sum .lost b { color: var(--bad); }
  .sum .total { border-top: 1px dashed var(--line); margin-top: 4px; padding-top: 8px; font-weight: 900; }
  /* Prize selection (#24): the tied players with their tie-break history. */
  .sel-list { list-style: none; margin: 4px 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .sel-list li { border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
  .sel-list label { display: flex; align-items: center; gap: 8px; font-size: 15px; overflow-wrap: anywhere; }
  .sel-list label input { width: auto; flex: none; }
  .sel-hist { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
  .handover-id { font: 900 26px/1.3 "Space Grotesk", sans-serif; letter-spacing: .06em; overflow-wrap: anywhere; user-select: all; }
  /* Same reason as the tied row: translucent, so the hat winner is the
     same surface as everyone else, lit differently. */
  .board li.board-hat { border-color: var(--gold-line); background: rgba(253, 246, 228, 0.62); }
  .board-marker-hat { color: #7a5200; }
  .board li.board-hat .board-place { color: var(--gold-line); }
  .board-notice-bad { border-color: #d8b6b6; background: #fbf0ee; }
  .board-notice { margin-top: 12px; border: 1px solid #e4d3a8; border-radius: 17px; background: #fbf3e1; padding: 13px 15px; }
  .board-notice h2 { font-size: 16px; }
  .board-notice p { margin-top: 4px; color: #54412f; font-size: 13px; }

  /* The inactivity warning. It sits above the navigation, not over the
     question, so a player reading a card is never covered by it. */
  .idle-warning { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: calc(68px + env(safe-area-inset-bottom)); width: min(100% - 28px, 402px); display: flex; align-items: center; gap: 11px; padding: 12px 14px; border: 1px solid var(--soft-line); border-radius: 15px; background: var(--soft); color: var(--ink); box-shadow: 0 10px 30px #35271e26; }
  .idle-warning p { margin: 0; font-size: 13px; font-weight: 700; line-height: 1.35; }
  /* Brown, not gold. This bar can appear over a quiz card, where the gold
     #f4bd38 is a near match for the YELLOW belt and would read as a belt
     answer. Same reason the quiz and promotion screens use brown: do not
     "fix" it back to gold. */
  .idle-warning button { margin-left: auto; flex: none; width: auto; padding: 9px 13px; font-size: 13px; background: var(--accent); color: var(--accent-ink); }
  .lab-nav { position: fixed; z-index: 20; left: 50%; bottom: 0; transform: translateX(-50%); width: min(100%, 430px); display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 10px 18px max(10px, env(safe-area-inset-bottom)); background: #fffdf8ed; backdrop-filter: blur(15px); border-top: 1px solid var(--line); }

  .profile-ladder li { display: grid; grid-template-columns: 44px 1fr; align-items: center; gap: 3px 11px; border: 1px solid var(--line); border-radius: 13px; padding: 9px 11px; font-size: 14px; font-weight: 900; }

  /* Friendly study concept: softer learning surfaces and a stronger reading

  body { background: #f7f3ec; color: var(--ink); font-family: Nunito, "Trebuchet MS", sans-serif; font-weight: 600; }

  .lab-hero-copy { padding: 24px 22px 4px; }

  .lab-hero p:not(.lab-eyebrow) { color: #54412f; font-size: 15px; }

  /* 44px, not 40: these are the chart's filters, tapped with a gloved thumb.
     Only the height ever failed -- the labels make every chip at least 71px
     wide -- so the padding is untouched and nothing re-wraps. The row grows
     8px in all, on a screen whose list is over 8000px long. */
  .lab-service-tabs button { min-height: 44px; border-radius: 999px; padding: 9px 13px; font-size: 12px; font-weight: 900; }
  /* The selected service, marked the way the app marks "this one" (#380).
     It used to be var(--accent), which measured 1.20:1 against an
     unselected chip at night and 1.18:1 in day -- and the selected chip
     also had its border set to its own fill, so selecting a service took
     its outline AWAY. Marking by subtraction again, as in #337.
     This is the dock's own selected treatment, gold on #38261b, so the app
     says "this one" the same way in both places. The chip tells you which
     of the four tables you are reading, and reading the wrong table is the
     mistake this app exists to prevent.
     The border is --gold-line, not the fill again. Measured: the gold fill
     alone separates the selected chip from an unselected one by 10.04:1 at
     night but only 2.84:1 in day, just under the 3:1 a state difference
     needs. The darker gold edge carries that gap in day without darkening
     the fill, which would have pushed the label below its own 4.5:1. */
  .lab-service-tabs button[aria-pressed="true"] {
    background: var(--gold); border-color: var(--gold-line); color: #38261b;
  }

  .lab-chart-heading { border-color: var(--accent); }

  .lab-chart-row strong { font-size: 20px; font-weight: 900; letter-spacing: -.03em; }
  .lab-chart-row .lab-belt-chip { min-width: 84px; min-height: 38px; border-radius: 11px; padding: 7px 10px; font-size: 12px; }
  .lab-main .primary, .lab-main .ghost, .primary, .ghost { border-radius: 14px; font-weight: 900; }
  /* The library's primary action: gold with dark text, not a brown fill.

     It stays opaque on purpose while the panels around it are frosted: an
     action meant to be found cannot be made of the same material as the
     surface behind it. */
  .primary {

  /* Promotion celebration (#95). Every piece starts invisible or small and
     ends where it belongs, so when the animations are switched off -- the
     reduced-motion rule below, or the Skip button -- what stays on screen

  .promo-cheer .cheer-stage { position: relative; display: grid; place-items: center; height: 212px; margin: 4px 0; }
  .cheer-badge { width: 136px; height: 136px; object-fit: contain; animation: cheer-badge-in .62s cubic-bezier(.18,.9,.32,1.25) both; }
  .cheer-glow { position: absolute; width: 196px; height: 196px; border-radius: 50%; opacity: 0;

  .cheer-spark { position: absolute; width: 9px; height: 9px; border-radius: 2px; background: #f4bd38; opacity: 0;
    animation: cheer-spark .78s ease-out both; animation-delay: calc(260ms + var(--delay)); }
  .cheer-name { margin-top: 2px; }
  /* Skip lands on the same finished state the reduced-motion rule gives. */
  .promo-cheer.skipped .cheer-badge,
  .promo-cheer.skipped .cheer-glow,
  .promo-cheer.skipped .cheer-spark { animation: none; }
  @keyframes cheer-badge-in { from { opacity: 0; transform: scale(.42); } to { opacity: 1; transform: none; } }
  @keyframes cheer-glow { 0% { opacity: 0; transform: scale(.55); } 45% { opacity: 1; } 100% { opacity: 0; transform: scale(1.3); } }
  @keyframes cheer-spark {
    0% { opacity: 0; transform: rotate(var(--a)) translateY(0); }
    18% { opacity: 1; }
    100% { opacity: 0; transform: rotate(var(--a)) translateY(calc(var(--d) * -1)); }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  /* Glassmorphism twilight tokens & surfaces (dark glass over the twilight
     gradient). These replace the earlier light/warm-white glass values. */
  :root {
    --glass-surface: rgba(38, 26, 18, 0.62);
    --glass-surface-sub: rgba(56, 38, 27, 0.5);
    --glass-border: rgba(255, 255, 255, 0.14);
    --glass-border-subtle: rgba(255, 255, 255, 0.08);
    --glass-highlight: rgba(255, 255, 255, 0.22);
    --glass-shadow: 0 16px 40px -4px rgba(0, 0, 0, 0.5), 0 4px 12px rgba(0, 0, 0, 0.3);
    --dock-bg: rgba(28, 19, 13, 0.85);
    --blur-lg: blur(24px);
    --blur-md: blur(14px);
  }

  /* Ambient Lighting Orbs */
  .ambient-canvas {
    position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
  }
  .orb { position: absolute; border-radius: 50%; filter: blur(85px); }
  .orb-gold { width: 440px; height: 440px; background: radial-gradient(circle, #f4bd38 0%, rgba(244, 189, 56, 0.02) 70%); top: -60px; left: 15%; opacity: 0.55; }
  .orb-amber { width: 460px; height: 460px; background: radial-gradient(circle, #c96b1b 0%, rgba(201, 107, 27, 0.02) 70%); top: 35%; right: 10%; opacity: 0.45; }
  .orb-blue { width: 360px; height: 360px; background: radial-gradient(circle, #175e94 0%, rgba(23, 94, 148, 0.02) 70%); bottom: -40px; left: 20%; opacity: 0.3; }

  /* Glass App Shell & Floating Glass Dock */
  #app {
    position: relative; z-index: 1;
    backdrop-filter: var(--blur-lg); -webkit-backdrop-filter: var(--blur-lg);
    background: var(--glass-surface);
    border: 1px solid var(--glass-border);
  }
  /* Static dock: pinned flush to the bottom of the app column (no longer a
     floating pill that covers the tappable content). Content clears it with
     the bottom padding added to .lab-main / .quiz-page below. */
  .lab-nav {
    position: fixed !important;
    bottom: 0 !important;
    left: 50% !important;
    transform: translateX(-50%) !important;
    width: min(100%, 430px) !important;
    height: 60px !important;
    background: var(--dock-bg) !important;
    backdrop-filter: blur(18px) !important;
    -webkit-backdrop-filter: blur(18px) !important;
    border: 0 !important;
    border-top: 1px solid var(--glass-border) !important;
    border-radius: 0 !important;
    box-shadow: 0 -8px 24px -8px rgba(0,0,0,0.28) !important;
    z-index: 50 !important;
    display: grid !important;
    align-items: center !important;
    padding: 0 6px max(0px, env(safe-area-inset-bottom)) !important;
  }
  .lab-nav button {
    border-radius: 24px !important;
    min-height: 48px !important;
    font-weight: 800 !important;
    background: transparent !important;
    border: 0 !important;
    /* `transition: all 0.2s ease !important` used to sit here, and it never
       animated anything: the whole shell, dock included, is rebuilt on every
       navigation, so the selected tab is a brand-new node that starts out
       gold with nothing to transition from. What the declaration DID do was
       win on !important over the shared press rule below, dragging the dock's
       press onto `all` for 0.2s instead of the named properties at 0.12s the
       other controls use. Removing it is what makes the dock feel like the
       rest of the app under the finger (#343). */
  }
  .lab-nav button[aria-current="page"] {
    background: var(--gold) !important;
    color: #38261b !important;
    box-shadow: 0 4px 14px rgba(244, 189, 56, 0.4) !important;
  }

  /* Glass Cards across Ranked & Quiz */
  .lab-choice, .auth-card, .rq-cmp, .sum, .profile-balance, .board li {
    background: var(--glass-surface-sub);
    backdrop-filter: var(--blur-md); -webkit-backdrop-filter: var(--blur-md);
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow);
  }

  /* Interactive quiz feedback: the belt settles onto a coloured ring.

     Both of these fire on EVERY answer -- up to 30 times in one Hard quiz --
     so they are deliberately quiet. What they used to do:

     - correctGlow ran 0.6s on cubic-bezier(.175,.885,.32,1.275), a curve that
       ends above 1, so it overshot and sprang back, and the keyframes pushed
       the belt to scale(1.04) on the way. A bounce is a poor fit for anything
       this frequent, and it should never be the thing a player waits out.
     - incorrectShake slid the belt +/-5px sideways for half a second, during
       a timed quiz, at the moment the player is already under pressure.

     Neither animation was the only signal, and still is not: right and wrong
     also carry the ring colour, the sound, and the feedback screen. The
     movement was the part that added nothing. (#346, #347) */
  .belt.belt-correct {
    opacity: 1 !important;
    animation: correctGlow 0.35s ease-out forwards;
    z-index: 2;
  }
  .belt.belt-incorrect {
    opacity: 1 !important;
    animation: incorrectSettle 0.2s ease-out forwards;
    z-index: 2;
  }

  @keyframes correctGlow {
    from { box-shadow: 0 0 0 0 rgba(34, 100, 66, 0.9); }
    to { box-shadow: 0 0 0 4px rgba(34, 100, 66, 0.7), 0 0 16px 3px var(--good); }
  }

  /* Renamed from incorrectShake, which is what it used to do. */
  @keyframes incorrectSettle {
    from { box-shadow: 0 0 0 0 rgba(161, 45, 45, 0.8); }
    to { box-shadow: 0 0 0 4px rgba(161, 45, 45, 0.7), 0 0 16px 3px var(--bad); }
  }

  /* ============================================================
     Twilight glass — component port to match the approved mock
     (mockups/app-redesign-mock.html). Appended last, so these are
     the styles in force. Visual only; behaviour unchanged. Belt
     colours (src/belts.js) are never restyled here.
     ============================================================ */
  :root { --r-md: 22px; --r-sm: 14px; }

  /* Crisper glass cards with a soft top highlight */
  .lab-choice, .auth-card, .rq-cmp, .sum,
  .profile-balance, .board li, .reauth-card, .owner-form, .cases li, .approved li {
    background: rgba(48, 32, 22, 0.62);
    border: 1px solid rgba(255, 255, 255, 0.11);
    border-radius: var(--r-md);
    box-shadow: 0 20px 45px -14px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }

  /* Hero art rounded like the mock */
  .lab-campaign { margin: 0; }
  .lab-campaign img { display: block; width: 100%; height: auto; border-radius: var(--r-md); border: 1px solid rgba(255, 255, 255, 0.08); }

  /* Gold eyebrows / section headings */

  /* Choice cards — gold-tinted icon and gold arrow (mock .choice) */
  /* 26px, not the --r-sm token: outer radius = inner radius + padding, and
     the icon tile inside is 12px with 14px of padding around it. At 14px the
     card's own corner was tighter than the tile it holds, which is what made
     it look pinched. The token itself is untouched -- nine other rules use
     it, and most of them hold nothing nested. */
  .lab-choice { border-radius: 26px; padding: 14px; gap: 12px; box-shadow: 0 10px 26px -12px rgba(0,0,0,0.6); }
  .lab-choice-icon, .lab-choice-quiz .lab-choice-icon {
    background: rgba(244, 189, 56, 0.14); border: 1px solid rgba(244, 189, 56, 0.32);
    color: var(--gold); border-radius: 12px; width: 44px; height: 44px; font-size: 16px; font-weight: 800;
  }
  .lab-choice small { color: var(--muted); }
  .lab-arrow { color: var(--gold); font-weight: 900; }

  /* Buttons matched to the mock (.btn / .btn.ghost): radius 14, padding 14 */
  .primary {
    background: linear-gradient(135deg, var(--gold) 0%, #d89115 100%);
    color: #2a1c10; border: 1px solid rgba(255, 255, 255, 0.45);
    border-radius: var(--r-sm); padding: 14px; font-size: 15px; font-weight: 900;
    box-shadow: 0 8px 20px -6px rgba(244, 189, 56, 0.5);
  }
  .ghost { border-radius: var(--r-sm); padding: 14px; font-weight: 800; background: var(--glass-surface-sub); border: 1px solid var(--glass-border); }
  input, .glass-input { border-radius: var(--r-sm); }

  /* Brand mark in gold (mock brandmark) */
  .lab-mark {
    background: linear-gradient(135deg, var(--gold), #d89115); color: #2a1c10;
    border-radius: 12px;
  }

  /* Dock labels/icons readable on the dark glass dock */
  .lab-nav button { color: var(--muted); }

  /* Language toggle as glass */
  .lab-language button { background: var(--glass-surface-sub); border: 1px solid var(--glass-border); color: var(--ink); backdrop-filter: var(--blur-md); -webkit-backdrop-filter: var(--blur-md); }
  /* The selected language was the hardest thing in the header to read:
     near-white ink on the cream fill two layers up, 1.18:1 measured at
     375x812 in both themes -- the chip that says which language you are IN
     was less legible than the one you are not. This layer restyled the
     unpressed chips as glass and changed the pressed one's ink, but left
     that older `background: #f7eac7` standing underneath.

     Selected now reads the way the rest of the app marks selection: the
     gold tint, the gold border and gold ink, which composites to 7.94:1
     over the header. */
  .lab-language button[aria-pressed="true"] {
    border-color: var(--gold); background: var(--soft); color: var(--gold);
  }



  /* Ranked quiz — belts and timer bar */
  .rq-stake { color: var(--muted); }
  /* Ring timer (mock): conic gold ring with the seconds on a dark disc */
  .rq-ring { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 14px; color: var(--gold); background: conic-gradient(var(--gold) calc(var(--pct, 100) * 1%), rgba(255, 255, 255, 0.12) 0); }
  .rq-ring.low { color: var(--bad); background: conic-gradient(var(--bad) calc(var(--pct, 0) * 1%), rgba(255, 255, 255, 0.12) 0); }
  .rq-ring span { width: 36px; height: 36px; border-radius: 50%; background: #1a110a; display: grid; place-items: center; }
  .tb-bar { background: rgba(255, 255, 255, 0.1); }
  .tb-bar i { background: linear-gradient(90deg, var(--gold), #ffe08a); }
  /* Balance meter on Ranked home / Profile: dark track, gold fill */
  .profile-bar { background: rgba(255, 255, 255, 0.1); }
  .profile-bar i { background: linear-gradient(90deg, var(--gold), #ffe08a); }

  /* Profile laid out like the mock: centered badge, stats grid, climb row */
  .pf-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .pf-stat { padding: 14px; border-radius: var(--r-sm); text-align: center; background: var(--glass-surface-sub); border: 1px solid var(--glass-border); }
  .pf-stat b { display: block; font-size: 24px; font-weight: 900; }
  .pf-stat small { font-size: 11px; color: var(--muted); }
  /* An empty tile says "Not yet" instead of a dash. Words do not fit the
     size the numbers use, so they drop to a readable one and stay on the
     tile's own line height, which keeps the four tiles the same height. */
  .pf-stat b.words { font-size: 15px; font-weight: 800; letter-spacing: 0; }
  /* #328 listed this as a fourth block floating with no card. It is not a
     block: it is the caption for the four tiles directly above it, and a card
     with a gold eyebrow of its own would make a footnote look like a section.
     What it was missing is the tie to what it explains, so it is pulled up
     against the tiles and indented to their edge instead of sitting centred
     in the gap between two sections. */
  .pf-climb { padding: 14px; border-radius: var(--r-md); background: var(--glass-surface-sub); border: 1px solid var(--glass-border); }
  .pf-badges { display: flex; justify-content: space-between; gap: 8px; margin-top: 9px; }
  .pf-badges img { width: 46px; height: 46px; object-fit: contain; filter: drop-shadow(0 3px 7px rgba(0, 0, 0, 0.4)); }
  /* Three states, not two. "done" is a badge already earned, so it keeps its
     colour and needs no rule of its own. "now" is the current badge: dimming
     the others was the only mark it had, and that mark is invisible when the
     current artwork is grey metal (Iron, Silver), so it gets a gold ring.
     An outline is used rather than a border because it takes no space, and
     at 2px wide with a 2px offset it still clears the 8px gap. */
  .pf-badges img.now { outline: 2px solid var(--gold-ring); outline-offset: 2px; border-radius: 10px; }
  .pf-badges img.off { opacity: 0.32; filter: grayscale(1); }
  .belts .belt { border: 1px solid rgba(255, 255, 255, 0.18); box-shadow: inset 0 0 0 100px rgba(255, 255, 255, 0.04); }

  /* Leaderboard — 3D-style podium (match the mock) */
  .podium { display: flex; align-items: flex-end; justify-content: center; gap: 8px; margin: 6px 0 12px; }
  .pslot { display: flex; flex-direction: column; align-items: center; gap: 5px; width: 33%; max-width: 112px; }
  .pcrown { font-size: 16px; color: var(--gold); line-height: 1; }
  .pdisc { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 18px; color: var(--ink); background: var(--glass-surface-sub); border: 2px solid var(--glass-border); }
  .pslot.p1 .pdisc { width: 56px; height: 56px; border-color: var(--gold); box-shadow: 0 0 18px rgba(244, 189, 56, 0.5); }
  .pslot-you .pdisc { border-color: var(--gold); }
  .pname { font-size: 11px; font-weight: 800; }
  .ppts { font-size: 10.5px; color: var(--gold); font-weight: 800; }
  .ppillar { width: 100%; border-radius: 12px 12px 0 0; display: grid; place-items: center; font-weight: 900; font-size: 22px; color: var(--ink); background: linear-gradient(180deg, rgba(244, 189, 56, 0.22), var(--glass-surface-sub)); border: 1px solid var(--glass-border-subtle); border-bottom: 0; }
  .pslot.p1 .ppillar { height: 86px; } .pslot.p2 .ppillar { height: 66px; } .pslot.p3 .ppillar { height: 54px; }

  /* Entry / login — single card like the mock. The panel gets a dark rgba
     scrim (still translucent) so the twilight reads dark, not washed by orbs. */
  #auth-panel { background: rgba(13, 8, 5, 0.86); }
  .auth-screen { align-items: center; text-align: center; }
  .auth-screen .brandmark { width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center; font: 900 26px/1 Arial, Helvetica, sans-serif; color: #2a1c10; background: linear-gradient(135deg, var(--gold), #d89115); box-shadow: 0 10px 26px -6px rgba(244, 189, 56, 0.55); }
  .auth-title { font-size: 26px; font-weight: 900; margin: 0; letter-spacing: -0.03em; }
  .auth-head { margin: 0; }
  #auth-panel .auth-card { text-align: left; width: 100%; }
  #auth-panel .auth-card .auth-eyebrow { color: var(--gold); }
  .auth-note { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; text-align: center; }
  .auth-link { background: transparent; border: 0; color: var(--gold); font-weight: 800; font-size: 13px; width: 100%; padding: 4px; cursor: pointer; }
  /* A quiet line under everything: who made the app (#267). */
  /* #451: How to play, the manual PDF, under the login card */
  .auth-howto { display: flex; width: 100%; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--soft-line); border-radius: var(--r-sm, 14px); background: var(--soft); color: var(--ink); text-decoration: none; text-align: left; }
  .auth-howto > span:first-child { display: grid; place-items: center; width: 32px; height: 32px; flex: none; border-radius: 50%; background: var(--gold); color: #2a1c10; font-weight: 900; }
  .auth-howto strong { display: block; font-size: 15px; }
  .auth-howto small { display: block; color: var(--muted); font-size: 12.5px; }
  .auth-howto:hover { border-color: var(--gold); }
  .auth-howto:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  .auth-footer { margin: 6px 0 0; font-size: 12.5px; text-align: center; }
  .auth-footer-security { margin-top: 4px; }
  .auth-footer-link { color: var(--muted); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; padding: 8px 4px; display: inline-block; }
  .auth-footer-link:hover { color: var(--gold); }
  .auth-footer-link:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; border-radius: 6px; }

  /* The app screen is an opaque dark panel (like the mock's phone screen), so
     the UI reads crisp and dark; the ambient orbs stay behind it and only peek
     at the edges on wide screens. */
  #app { background: radial-gradient(120% 80% at 50% 0%, #2e1d12 0%, #140d08 68%); border: 0; box-shadow: 0 16px 70px rgba(0,0,0,0.5); backdrop-filter: none; -webkit-backdrop-filter: none; }
  .orb-gold { opacity: 0.30; }
  .orb-amber { opacity: 0.24; }
  .orb-blue { opacity: 0.2; }

  /* Leaderboard rows: keep tied/hat/you rows on dark glass, gold accents */
  .board li.board-tied, .board li.board-hat { background: var(--glass-surface-sub); border-color: rgba(244, 189, 56, 0.4); }
  .board li.board-hat .board-place { color: var(--gold); }
  .board li.board-you { border: 2px solid var(--gold); }

  /* ============================================================
     Redesign v2 — static dock spacing, Home identity block,
     theme toggle, and the Day (light) theme.
     ============================================================ */

  /* Content clears the static bottom dock (60px + safe area). */
  .lab-main { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
  #app.quiz-page { padding-bottom: calc(80px + env(safe-area-inset-bottom)); }

  /* Theme toggle button in the header (sun/moon), matching the glass language
     buttons. */
  .lab-top-actions { display: flex; align-items: center; gap: 7px; }
  .lab-theme-btn { background: var(--glass-surface-sub); border: 1px solid var(--glass-border); color: var(--gold); border-radius: var(--r-sm); padding: 8px 11px; font-size: 16px; line-height: 1; cursor: pointer; backdrop-filter: var(--blur-md); -webkit-backdrop-filter: var(--blur-md); }


  /* ===== DAY (light) THEME — overrides tokens, plus the few hard-coded
     surfaces the twilight port set directly. Night stays the default. ===== */
  html[data-theme="day"] {
    --bg: #fbf4e8; --panel: #fffaf2; --sunk: #f1e4d1;
    --ink: #2b1c10; --muted: #7a6650; --line: rgba(120, 90, 50, 0.18);
    --accent: #f3e7d3; --accent-ink: #2b1c10;
    --gold: #c98a10; --gold-line: #a9740d;
    /* NOT var(--gold) here. Measured against the cream page the day gold is
       2.52:1, under the 3:1 a ring that carries meaning needs; this deeper
       brown-gold -- the eyebrow colour -- measures 5.05:1 and still reads as
       the same family. At night it is the plain gold at 10.04:1 (#327, and
       the current-badge ring in #337). */
    --gold-ring: #8a5a12;
    --focus: var(--gold-ring);
    --soft: rgba(201, 138, 16, 0.14); --soft-line: rgba(201, 138, 16, 0.32);
    --good: #2f9e6b; --bad: #c9524a;
    --glass-surface: rgba(255, 255, 255, 0.74); --glass-surface-sub: rgba(255, 252, 246, 0.92);
    --glass-border: rgba(120, 90, 50, 0.18); --glass-border-subtle: rgba(120, 90, 50, 0.1);
    --glass-highlight: rgba(255, 255, 255, 0.6);
    --glass-shadow: 0 16px 40px -8px rgba(90, 60, 25, 0.18), 0 4px 12px rgba(90, 60, 25, 0.08);
    --dock-bg: rgba(255, 250, 242, 0.92);
  }
  html[data-theme="day"] body { background: radial-gradient(130% 90% at 50% -10%, #fef8ee 0%, #f4e7d3 52%, #ecdcc4 100%) fixed; }
  html[data-theme="day"] #app { background: radial-gradient(120% 80% at 50% 0%, #fffaf2 0%, #f3e6d2 68%); box-shadow: 0 16px 60px rgba(120, 90, 40, 0.18); }
  html[data-theme="day"] .orb-gold { opacity: 0.12; }
  html[data-theme="day"] .orb-amber { opacity: 0.1; }
  html[data-theme="day"] .orb-blue { opacity: 0.08; }
  /* Hard-coded card surfaces from the port → light for day */
  html[data-theme="day"] .lab-choice,
  html[data-theme="day"] .auth-card,
  html[data-theme="day"] .rq-cmp, html[data-theme="day"] .sum,
  html[data-theme="day"] .profile-balance, html[data-theme="day"] .board li,
  html[data-theme="day"] .reauth-card, html[data-theme="day"] .owner-form,
  html[data-theme="day"] .cases li, html[data-theme="day"] .approved li {
    background: rgba(255, 252, 246, 0.92);
    border: 1px solid rgba(120, 90, 50, 0.16);
    box-shadow: 0 16px 36px -16px rgba(90, 60, 25, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.6);
  }
  html[data-theme="day"] .rq-ring span { background: var(--sunk); }
  html[data-theme="day"] .tb-bar, html[data-theme="day"] .profile-bar { background: rgba(120, 90, 50, 0.16); }
  html[data-theme="day"] .lab-campaign img { border-color: rgba(120, 90, 50, 0.14); }
  html[data-theme="day"] .belts .belt { border-color: rgba(120, 90, 50, 0.18); box-shadow: inset 0 0 0 100px rgba(255, 255, 255, 0.04); }
  html[data-theme="day"] #auth-panel { background: rgba(255, 250, 242, 0.9); }
  html[data-theme="day"] .lab-choice-icon, html[data-theme="day"] .lab-choice-quiz .lab-choice-icon { background: rgba(201, 138, 16, 0.16); border-color: rgba(201, 138, 16, 0.34); color: var(--gold); }

  /* ============================================================
     Redesign v3 — the quiz avatar is gone (the prompt and belts use
     the space), Profile actions moved, and a refinement pass.
     ============================================================ */

  /* Small labels were dark-on-dark / cream-on-cream; gold reads in both themes */
  .lab-eyebrow { color: var(--gold); font-size: 11px; font-weight: 900; letter-spacing: .16em; }

  /* Header: equal-sized controls, and a row under them for the site line
     (+ Settings on the Profile screen) */
  .lab-top { padding: 18px 20px 12px; gap: 8px; }
  .lab-language { gap: 6px; }
  .lab-language button, .lab-theme-btn { width: 44px; min-height: 44px; border-radius: 13px; }
  .lab-theme-btn { padding: 0; display: grid; place-items: center; }
  .lab-site-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .lab-site-row .lab-site { margin-left: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 10.5px; letter-spacing: .08em; }
  .lab-settings-btn { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 999px; background: var(--glass-surface-sub); border: 1px solid var(--glass-border); color: var(--ink); font-size: 12px; font-weight: 800; white-space: nowrap; }
  .lab-settings-btn span { color: var(--gold); font-size: 14px; line-height: 1; }
  /* #418: the chip was 90x33 with 44x44 controls directly above it. Growing
     it to 44 would have pushed the sub-header down on every Profile screen,
     so the hit area is extended instead and the chip looks the same.
     Measured at 375x812: 8px of clear space above it (the row of buttons
     ends at y=55, the chip starts at 63) and 12px below (the header ends at
     108, the chip at 96), so -6px top and bottom gives 45px of target and
     still touches nothing else. */
  .lab-settings-btn { position: relative; }
  .lab-settings-btn::after { content: ""; position: absolute; inset: -6px 0; }

  /* Ranked question: the route is the hero now */
  .tb-top { align-items: center; }
  .tb-bar { height: 6px; margin: 8px 0 12px; }
  .rq-stake { margin: 0; font-size: 12px; }
  .rq-prompt { margin: clamp(10px, 2.4dvh, 28px) 0 clamp(8px, 2dvh, 22px); }
  .rq-service { margin: 0; font-size: clamp(13px, 2dvh, 16px); font-weight: 800; letter-spacing: .14em; }
  .rq-code { margin: 8px 0 0; font: 900 clamp(60px, 12dvh, 92px)/1 Nunito, "Trebuchet MS", sans-serif; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  #rq-question .lab-study-meta { margin: 0; text-align: center; letter-spacing: .14em; font-weight: 800; }
  .belts { gap: 10px; margin: 10px 0; }
  .belts .belt { min-height: clamp(66px, 10.5dvh, 100px); border-radius: 16px; letter-spacing: .06em; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 10px 20px -12px rgba(0, 0, 0, 0.6); }
  /* 0.96 like every other control. It was the one thing in the app that gave
     press feedback, and it used a value of its own. */
  .belts .belt:active { transform: scale(.96); }

  /* Press feedback (#345). Nothing but the belts responded to a finger:
     Continue, Start Ranked quiz, Log in, the Practice cards and the dock all
     stayed completely still. On a phone that small give is the only
     confirmation a player gets before the screen changes.

     0.96 exactly: below 0.95 the press reads as exaggerated. The transition
     names its properties rather than `all`, so nothing else starts animating
     by accident, and it is short enough not to lag behind the finger.

     The reduced-motion block above already turns every transition off, so
     this needs no guard of its own.

     `.belt` is in the list on its own account. The Ranked quiz draws its
     belts inside `.belts`, which already had both a transition and a press,
     but the Practice quiz draws them inside `.options`, so that pair never
     reached them -- the two quizzes felt different under the same finger.
     `.belts .belt` is the more specific rule and keeps its own 0.15s
     transform transition; this one only reaches the Practice belts. */
  .primary, .ghost, .lab-choice, .home-short, .lab-nav button, .belt {
    transition-property: transform, background-color, color, box-shadow;
    transition-duration: .12s;
    transition-timing-function: ease-out;
  }
  .primary:active, .ghost:active, .lab-choice:active,
  .home-short:active, .lab-nav button:active, .belt:active { transform: scale(.96); }
  .primary:disabled:active, .ghost:disabled:active { transform: none; }

  /* Ranked feedback: a verdict mark where the avatar used to be */
  .rq-mark { width: 56px; height: 56px; margin: 4px auto 0; border-radius: 50%; display: grid; place-items: center; font-size: 26px; font-weight: 900; line-height: 1; }
  .rq-mark.good { color: var(--good); background: rgba(108, 211, 154, 0.14); border: 1px solid rgba(108, 211, 154, 0.45); }
  .rq-mark.bad { color: var(--bad); background: rgba(240, 138, 138, 0.14); border: 1px solid rgba(240, 138, 138, 0.45); }
  .rq-verdict, .rq-worth { text-align: center; }
  .rq-worth { margin: 0 0 4px; }
  .rq-verdict { font-size: clamp(26px, 7vw, 32px); }

  /* Practice quiz: same idea — bigger route, no avatar */
  .quiz-route { margin: clamp(8px, 2.4dvh, 22px) 0; }
  .quiz-route .p-code { font-size: clamp(48px, min(12.5dvh, 19vw), 92px); }
  .quiz-actions .stopbtn { background: var(--glass-surface-sub); border: 1px solid var(--glass-border); color: var(--ink); font-weight: 800; }
  .quiz-timer { border-color: var(--gold); background: var(--sunk); color: var(--ink); }
  .quiz-cue { text-align: center; letter-spacing: .14em; color: var(--muted); }

  /* Profile: even rhythm, stats read as figures, history centred under the climb */
  #profile-panel { display: flex; flex-direction: column; gap: 12px; }
  .pf-stat { padding: 16px 12px; }
  .pf-stat b { font-size: 26px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .pf-stat small { display: block; margin-top: 3px; font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
  .pf-climb { padding: 14px 16px 16px; }

  /* Home: the notice, shift log and disclaimer follow the theme */
  .lab-launch { margin-top: 0; border-radius: var(--r-sm); background: var(--soft); border-color: var(--soft-line); }
  .lab-launch i { background: var(--gold); color: #2a1c10; }
  .lab-launch p { color: var(--muted); }
  /* #452: the season bubble, a speech bubble at the top of Home, login and
     profile. The tail points down at the screen it announces. */
  .season-bubble { position: relative; display: flex; align-items: flex-start; gap: 11px; margin: 0 0 14px; padding: 12px 10px 12px 14px; border: 1px solid var(--soft-line); border-radius: var(--r-sm); background: var(--soft); text-align: left; }
  .season-bubble[hidden] { display: none; }
  .season-bubble::after { content: ""; position: absolute; left: 24px; bottom: -9px; width: 16px; height: 9px; background: var(--soft-line); clip-path: polygon(0 0, 100% 0, 50% 100%); }
  .season-bubble i { display: grid; place-items: center; width: 30px; height: 30px; flex: none; border-radius: 50%; background: var(--gold); color: #2a1c10; font-style: normal; font-size: 15px; font-weight: 900; }
  .season-bubble-body { flex: 1; min-width: 0; }
  .season-bubble h2 { margin: 0; font-size: 15px; font-weight: 900; letter-spacing: -.02em; text-transform: none; color: var(--ink); }
  .season-bubble p { margin: 3px 0 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
  .season-bubble-close { flex: none; width: 32px; height: 32px; margin: -4px -2px 0 0; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--muted); font-size: 20px; line-height: 1; cursor: pointer; }
  .season-bubble-close:hover, .season-bubble-close:focus-visible { background: var(--soft-line); color: var(--ink); }
  .auth-screen > .season-bubble { width: 100%; }
  .lab-log-link { color: var(--ink); padding: 12px 4px; }
  .lab-log-link span:last-child { color: var(--gold); }
  /* #328 asked for a glass surface and a gold eyebrow here. The surface, yes:
     a transparent box with a hairline around it reads as a gap with a line in
     it rather than a thing. The eyebrow, no -- this is the legal small print,
     and a gold heading would announce it above the Practice shortcuts that
     are the point of the screen. It takes the subdued surface, not the one
     the cards use. */
  .lab-disclaimer { background: var(--glass-surface-sub); backdrop-filter: var(--blur-md); -webkit-backdrop-filter: var(--blur-md); border: 1px solid var(--glass-border-subtle); border-radius: var(--r-sm); color: var(--muted); font-size: 11.5px; }

  /* The season line on Ranked, which stood on the bare background under the
     Standings card (#328). Same surface as the disclaimer: it is a status
     line, not an announcement, and the gold banner on Home is the one that
     announces. */
  .rk-note { margin: 0; padding: 12px 14px; background: var(--glass-surface-sub); backdrop-filter: var(--blur-md); -webkit-backdrop-filter: var(--blur-md); border: 1px solid var(--glass-border-subtle); border-radius: var(--r-sm); color: var(--muted); font-size: 12px; line-height: 1.5; }
  .lab-disclaimer strong { color: var(--ink); }

  /* Dock: the active pill sits inside the bar instead of spilling over it */
  .lab-nav { height: calc(62px + env(safe-area-inset-bottom)) !important; padding: 0 10px env(safe-area-inset-bottom) !important; gap: 4px !important; }
  .lab-nav button { min-height: 0 !important; height: 46px; padding: 0 !important; border-radius: 15px !important; font-size: 11px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
  .lab-nav i { margin: 0; font-size: 17px; line-height: 1; }
  .lab-nav button[aria-current="page"] { box-shadow: 0 6px 16px -6px rgba(244, 189, 56, 0.6) !important; }

  /* #427: while a scored attempt is live the dock goes, the way it already
     does in the Practice quiz (#382). A dock under a timed run is a way to
     lose it, and this is the run that costs points: the way out stays the
     deliberate one, "Cancel this attempt", which names its ten points and
     asks. The dock itself is removed in labPage, not hidden here; what is
     left for CSS is the clearance it used to need, which gives the question
     card back 56px. */
  #app.attempt-live .lab-main { padding-bottom: calc(20px + env(safe-area-inset-bottom)); }

  html[data-theme="day"] .rq-mark.good { background: rgba(47, 158, 107, 0.12); border-color: rgba(47, 158, 107, 0.4); }
  html[data-theme="day"] .rq-mark.bad { background: rgba(201, 82, 74, 0.1); border-color: rgba(201, 82, 74, 0.4); }
  html[data-theme="day"] .belts .belt { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28), 0 10px 18px -12px rgba(90, 60, 25, 0.5); }

  /* ============================================================
     Redesign v4 — compact glass header, Home in stripes, drawn icons.
     ============================================================ */

  /* Compact header that stays at the top while the page scrolls under it */
