<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sort Lab · Saddle Brook Twilight</title>
<style>
  @font-face {
    font-family: Nunito;
    src: url("assets/nunito-variable.ttf") format("truetype");
    font-style: normal;
    font-weight: 200 1000;
    font-display: swap;
  }
  /* One palette, from mockups/design-library (the approved brown, gold and
     warm white refresh). Two later :root blocks used to stack on top of this
     one; they are gone, so these values are the ones in force. Belt colours
     come from BELT_STYLE in src/belts.js and are routing information, never
     restyled here. */
  :root {
    --bg: #fffdf8; --panel: #fffdf8; --sunk: #ede3d2;
    --ink: #35271e; --muted: #6e5c4d; --line: #ded4c5;
    --accent: #38261b; --accent-ink: #fffdf8;
    --gold: #f4bd38; --gold-line: #b47d15;
    --soft: #f7eac7; --soft-line: #d6bc75;
    --focus: #175e94; --good: #226442; --bad: #a12d2d;
  }
  * { box-sizing: border-box; }

  /* The Artifact host injects this; nothing else does. Without it a class that
     sets `display` beats the browser's default [hidden] rule, and .bail below
     sets display:flex — so the stop panel would sit open over every card. */
  [hidden] { display: none !important; }

  body {
    /* The Artifact host injects a reset, but the Pages weblayer does not. Without
       this the browser's default 8px body margin overflows the 100dvh card
       screen and every card scrolls. */
    margin: 0;
    background: #f7f3ec; color: var(--ink);
    font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 16px; line-height: 1.45; -webkit-text-size-adjust: 100%;
  }
  #app { margin: 0 auto; background: var(--bg); box-shadow: 0 16px 70px #38261b1c; }
  #app.quiz-page { max-width: 520px; min-height: 100dvh; padding: 20px 16px 48px; }
  #app.lab-page { max-width: 430px; min-height: 100dvh; }
  .screen { display: flex; flex-direction: column; gap: 16px; }

  h1 { font-family: "Space Grotesk", sans-serif; font-size: 28px; font-weight: 700; margin: 0; letter-spacing: -0.04em; }
  h2 { font-size: 12px; margin: 6px 0 0; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); font-weight: 600; }
  .sub { margin: -10px 0 0; color: var(--muted); font-size: 14px; }
  .notice { margin: 0; color: var(--bad); font-size: 14px; font-weight: 600; }
  .warn { margin: 0; color: var(--muted); font-size: 13px; }
  .disclaimer {
    margin: 8px 0 0; padding: 14px 16px; border: 1px solid var(--line);
    border-radius: 12px; color: var(--muted); background: var(--panel);
    font-size: 13px; line-height: 1.5;
  }
  .disclaimer strong { color: var(--ink); }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; }
  input {
    font: inherit; font-size: 18px; padding: 15px; border-radius: 12px; width: 100%;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  }
  input:focus-visible, button:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }

  button { font: inherit; cursor: pointer; border: 0; }
  .primary {
    background: var(--accent); color: var(--accent-ink);
    padding: 17px; border-radius: 12px; font-size: 17px; font-weight: 600;
  }
  .ghost {
    background: transparent; color: var(--ink);
    border: 1px solid var(--line); padding: 14px; border-radius: 12px; font-size: 15px;
  }
  .ghost.danger { color: var(--bad); }

  #auth-panel {
    position: fixed; inset: 0; z-index: 100;
    background: var(--bg); display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .auth-screen { width: min(360px, 100%); display: flex; flex-direction: column; gap: 14px; }
  .auth-buttons { display: flex; flex-direction: column; gap: 10px; }
  /* The approved entry screen: two cards that say what each way in gives
     you. See mockups/entry-navigation.html. */
  .auth-brand { display: flex; align-items: center; gap: 10px; font-size: 21px; font-weight: 900; letter-spacing: -.05em; }
  .auth-avatar { display: block; width: 116px; height: 116px; margin: 0 auto; border-radius: 22px; border: 1px solid var(--line); object-fit: cover; }
  .auth-screen h1 { font-size: 26px; line-height: 1.12; }
  .auth-card { display: flex; flex-direction: column; gap: 8px; padding: 17px; border-radius: 20px; background: var(--soft); border: 1px solid var(--soft-line); }
  .auth-card.guest { background: #e8efdf; border-color: #c4d3b4; }
  .auth-card h2 { margin: 0; font-size: 19px; font-weight: 900; letter-spacing: -.035em; text-transform: none; color: var(--ink); }
  .auth-eyebrow { margin: 0; color: var(--accent); font-size: 11px; font-weight: 900; letter-spacing: .13em; text-transform: uppercase; }
  .auth-copy { margin: 0 0 4px; color: #54412f; font-size: 14px; line-height: 1.45; }
  @media (max-height: 700px) { .auth-avatar { display: none; } .auth-screen h1 { font-size: 22px; } }
  .auth-screen input[readonly] { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0.05em; }

  .decks { display: flex; flex-direction: column; gap: 10px; }
  .deckbtn {
    display: flex; flex-direction: column; gap: 2px; text-align: left;
    background: var(--panel); border: 1px solid var(--line); color: var(--ink);
    border-radius: 12px; padding: 15px 16px;
  }
  .deckbtn .dname { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .dsort {
    font-style: normal; font-size: 10px; font-weight: 700;
    letter-spacing: 0.12em; text-transform: uppercase;
    border: 1px solid var(--line); border-radius: 999px;
    padding: 2px 8px; color: var(--muted);
  }
  .deckbtn .dblurb { font-size: 14px; color: var(--muted); }
  .deckbtn .dmeta {
    font-size: 11px; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.1em; font-weight: 600; margin-top: 5px;
  }
  .deckbtn.locked { opacity: 0.5; border-style: dashed; cursor: default; }
  .deckname { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; margin-top: -10px; }

  .progress { font-size: 12px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; }
  .progress-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .progress-row .progress { margin: 0; }
  .card-header { display: flex; flex-direction: column; gap: 4px; }
  .card-header > .stopbtn { align-self: flex-end; }
  .card-header .lab-language button { width: 38px; min-height: 44px; }
  .stopbtn {
    background: transparent; color: var(--muted);
    border: 1px solid var(--line); padding: 6px 14px; border-radius: 999px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    flex-shrink: 0;
  }
  .stopbtn:active { color: var(--bad); border-color: var(--bad); }

  /* The card fills the phone so the belt pads sit low, in thumb reach, instead
     of floating in the upper half with dead space beneath them. */
  .card-screen, .feedback {
    min-height: calc(100vh - 68px);
    min-height: calc(100dvh - 68px);
  }
  .card-screen { justify-content: space-between; }
  .feedback { justify-content: center; }

  .prompt { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  /* The card is sized to the phone it is held in: every dimension scales with
     viewport height between a small-phone floor and a large-phone ceiling, so
     the prompt and the pads both grow to fill the screen without overflowing a
     short one. vh first, dvh second for browsers that support it. */
  .ring {
    --ring: clamp(92px, 13.5vh, 118px);
    --ring: clamp(92px, 13.5dvh, 118px);
    width: var(--ring); height: var(--ring); border-radius: 50%;
    display: grid; place-items: center; margin-bottom: 2px;
    background: conic-gradient(var(--accent) 0 100%, var(--sunk) 100% 100%);
  }
  .ring i {
    width: calc(var(--ring) - 15px); height: calc(var(--ring) - 15px);
    border-radius: 50%; background: var(--bg);
    display: grid; place-items: center; font-style: normal; font-weight: 700;
    font-size: clamp(28px, 4.6vh, 38px);
    font-size: clamp(28px, 4.6dvh, 38px);
    font-variant-numeric: tabular-nums;
  }
  .p-line {
    font-size: clamp(18px, 2.7vh, 23px);
    font-size: clamp(18px, 2.7dvh, 23px);
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink); font-weight: 700; text-align: center;
  }
  .p-code {
    font-size: clamp(58px, 10.5vh, 86px);
    font-size: clamp(58px, 10.5dvh, 86px);
    font-weight: 700; letter-spacing: -0.015em; line-height: 1.02;
    font-variant-numeric: tabular-nums; text-align: center;
  }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
  .range-display { display: inline-flex; align-items: center; justify-content: center; max-width: 100%; white-space: nowrap; vertical-align: middle; }
  .range-number { line-height: 1; }
  .range-dash { display: block; flex: none; width: .48em; height: .105em; margin: 0 .025em; border-radius: 999px; background: currentColor; }
  .prompt.small .p-code {
    font-size: clamp(36px, 6.4vh, 54px);
    font-size: clamp(36px, 6.4dvh, 54px);
  }

  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .belt {
    padding: 8px; border-radius: 18px; font-weight: 700; letter-spacing: 0.05em;
    font-size: clamp(19px, 2.9vh, 25px);
    font-size: clamp(19px, 2.9dvh, 25px);
    min-height: clamp(100px, 15.5vh, 146px);
    min-height: clamp(100px, 15.5dvh, 146px);
  }

  .bail {
    position: fixed; inset: 0; z-index: 10;
    background: var(--bg); padding: 24px 20px;
    display: flex; flex-direction: column; justify-content: center; gap: 12px;
  }
  .bail h1 { text-align: center; }
  .bail .sub { margin: 0 0 8px; text-align: center; max-width: 34ch; align-self: center; }

  .feedback { align-items: center; text-align: center; }
  .verdict {
    font-weight: 700;
    font-size: clamp(26px, 3.9vh, 34px);
    font-size: clamp(26px, 3.9dvh, 34px);
  }
  .feedback.good .verdict { color: var(--good); }
  .feedback.bad .verdict { color: var(--bad); }
  /* Quiz preview approved for the live card: the supplied mascot fills its
     natural image ratio, while the timer stays between progress and Cancel. */
  .quiz-card, .quiz-feedback { gap: 12px; min-height: calc(100dvh - 68px); }
  .quiz-card { justify-content: space-between; }
  .quiz-top { display: flex; flex-direction: column; gap: 7px; }
  .quiz-topline, .quiz-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .quiz-topline { min-height: 44px; }
  .quiz-topline .lab-language button { width: 38px; }
  .quiz-actions { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); }
  .quiz-actions .stopbtn { justify-self: end; min-height: 44px; border-radius: 22px; }
  .quiz-step { color: var(--muted); font-size: 12px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; }
  .quiz-timer { width: 48px; height: 48px; border: 4px solid var(--ink); border-radius: 50%; display: grid; place-items: center; background: var(--panel); font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .quiz-timer.urgent { border-color: var(--bad); color: var(--bad); }
  .quiz-avatar { display: block; width: 100%; height: auto; aspect-ratio: 1712 / 1152; object-fit: cover; }
  .quiz-route { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .quiz-route .p-line { font-size: clamp(16px, 2.4dvh, 21px); }
  .quiz-route .p-code { font-size: clamp(48px, 10dvh, 72px); font-weight: 800; letter-spacing: -.04em; }
  .quiz-cue { margin: 0; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
  .quiz-card .options { gap: 9px; }
  .quiz-card .belt { min-height: clamp(76px, 12dvh, 104px); border-radius: 12px; }
  .quiz-feedback .verdict { line-height: 1.05; letter-spacing: -.04em; text-align: left; align-self: stretch; }
  .quiz-feedback.good .verdict { color: var(--good); }
  .quiz-feedback.bad .verdict { color: var(--bad); }
  .quiz-feedback .answer-compare { align-self: stretch; display: grid; gap: 8px; padding: 12px; border: 1px solid var(--line); background: #f3ece0; }
  .quiz-feedback .answer-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; }
  .quiz-feedback .answer-row strong { font-size: 15px; }
  .quiz-feedback .answer-row .answer { min-width: 96px; padding: 7px 10px; border-radius: 5px; font-size: 14px; text-align: center; align-self: auto; }
  .quiz-feedback .why { align-self: stretch; max-width: none; border-left: 3px solid var(--ink); padding-left: 10px; color: #54412f; }
  .quiz-feedback .primary { width: 100%; border-radius: 0; min-height: 52px; }
  .quiz-auto { margin: 0; align-self: center; color: var(--muted); font-size: 12px; text-align: center; }
  @media (max-width: 340px) { .quiz-step { font-size: 10px; letter-spacing: .02em; white-space: nowrap; } .quiz-actions .stopbtn { padding-inline: 12px; } }
  @media (max-height: 700px) { .quiz-card, .quiz-feedback { gap: 9px; } .quiz-card .belt { min-height: 76px; } }
  .answer {
    padding: clamp(20px, 3.2vh, 30px); border-radius: 18px; font-weight: 700;
    letter-spacing: 0.05em; align-self: stretch;
    font-size: clamp(24px, 3.6vh, 32px);
    font-size: clamp(24px, 3.6dvh, 32px);
  }
  .why { color: var(--muted); font-size: 14px; margin: 0; max-width: 42ch; }

  .score-line { display: flex; gap: 34px; }
  .big { font-size: 46px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; font-variant-numeric: tabular-nums; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); font-weight: 600; margin-top: 4px; }
  .who { font-size: 18px; font-weight: 600; }
  .clean { color: var(--good); font-weight: 600; margin: 0; }

  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .missed li { border-left: 3px solid var(--bad); padding: 2px 0 2px 12px; }
  .mcard { font-weight: 700; font-size: 15px; letter-spacing: 0.02em; }
  .mans { font-size: 14px; margin: 1px 0 4px; }
  .mans.timeout { color: var(--muted); }
  .logl li {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px;
    display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: baseline;
  }
  .logl .sc { font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
  .logl .when { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
  .logmiss { grid-column: 1 / -1; margin-top: 8px; gap: 7px; }
  .logmiss li {
    background: none; border: 0; border-left: 3px solid var(--bad);
    border-radius: 0; padding: 0 0 0 10px; display: block;
  }
  .logmiss .mcard { font-size: 14px; }
  .logmiss .mans { font-size: 13px; margin: 0; }
  .exportnote { margin: 0; font-size: 13px; color: var(--muted); }
  .exportnote.bad { color: var(--bad); }
  .logclean { grid-column: 1 / -1; font-size: 13px; color: var(--good); font-weight: 600; margin-top: 4px; }

  /* Approved Sort Lab home and study design. The timed card stays on its own
     full-height screen so the belt buttons remain in thumb reach. */
  .lab-shell { min-height: 100dvh; display: flex; flex-direction: column; }
  .lab-top { display: flex; flex-direction: column; gap: 8px; padding: 25px 22px 18px; }
  .lab-top-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .lab-language { display: flex; gap: 4px; margin-left: auto; flex: none; }
  .lab-language button { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 44px; min-height: 44px; padding: 2px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); color: var(--ink); font: 800 10px/1.1 Arial, Helvetica, sans-serif; cursor: pointer; }
  .lab-language button span:first-child { font-size: 19px; line-height: 1.25; }
  .lab-language button[aria-pressed="true"] { border: 2px solid var(--ink); background: #f7eac7; }
  .lab-language button:focus-visible { outline: 3px solid #175e94; outline-offset: 2px; }
  .quiz-language { display: flex; justify-content: flex-end; margin-bottom: 6px; }
  .lab-site { color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
  .lab-brand { display: flex; align-items: center; gap: 10px; font: 700 20px "Space Grotesk", sans-serif; letter-spacing: -.05em; white-space: nowrap; }
  .lab-mark { display: grid; place-items: center; width: 34px; height: 34px; flex: none; background: var(--ink); color: var(--accent-ink); border-radius: 11px; font-size: 13px; transform: rotate(-5deg); }
  .lab-tag { color: #38261b; background: #f7eac7; padding: 6px 9px; border-radius: 999px; font-size: 10px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; text-align: center; }
  .lab-main { flex: 1; padding: 0 22px 105px; }
  .lab-screen { display: flex; flex-direction: column; gap: 12px; }
  .lab-eyebrow { margin: 0; color: #8a5a12; font-size: 11px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
  .lab-title { font-size: clamp(34px, 9vw, 42px); line-height: 1.06; margin: 0; }
  .lab-intro { margin: 0 0 8px; color: var(--muted); font-size: 15px; line-height: 1.5; }
  .lab-hero { position: relative; overflow: hidden; border-radius: 25px; padding: 25px 22px 21px; background: #e8efdf; margin-bottom: 7px; }
  .lab-hero::before { content: ""; position: absolute; width: 180px; height: 180px; border: 1px solid #d6bc75; border-radius: 50%; right: -55px; top: -88px; box-shadow: 0 0 0 34px #f7eac7, 0 0 0 35px #e4d3a8; }
  .lab-hero > * { position: relative; }
  .lab-hero .lab-eyebrow { color: #38261b; margin-bottom: 10px; }
  .lab-hero h1 { max-width: 310px; font-size: clamp(35px, 10vw, 46px); line-height: 1.04; margin-bottom: 14px; }
  .lab-hero p:not(.lab-eyebrow) { max-width: 300px; margin: 0; color: #54412f; font-size: 15px; line-height: 1.5; }
  .lab-route { display: flex; gap: 7px; margin-top: 18px; }
  /* Decorative only: these four bars are not belts and carry no routing
     meaning, so they follow the warm palette. */
  .lab-route span { height: 8px; flex: 1; border-radius: 999px; background: #f4bd38; }
  .lab-route span:nth-child(2) { background: #d79a3a; }
  .lab-route span:nth-child(3) { background: #a8773f; }
  .lab-route span:nth-child(4) { background: #6e5c4d; }
  .lab-section-heading { margin: 3px 0 0; color: var(--ink); font: 700 17px "Space Grotesk", sans-serif; letter-spacing: -.04em; text-transform: none; }
  .lab-choice { width: 100%; display: flex; align-items: center; gap: 14px; text-align: left; border: 1px solid var(--line); border-radius: 19px; background: var(--panel); color: var(--ink); padding: 16px; box-shadow: 0 3px 12px #38261b0d; }
  .lab-choice-icon { display: grid; place-items: center; width: 49px; height: 49px; flex: none; border-radius: 15px; background: #e8efdf; color: #38261b; font: 700 20px "Space Grotesk", sans-serif; }
  .lab-choice-quiz .lab-choice-icon { background: #f6e2c6; color: #8a5a12; }
  .lab-choice strong, .lab-choice small { display: block; }
  .lab-choice strong { font-size: 16px; }
  .lab-choice small { color: var(--muted); margin-top: 3px; font-size: 12px; line-height: 1.35; }
  .lab-arrow { margin-left: auto; color: #9a876f; font-size: 22px; }
  .lab-log-link { display: flex; justify-content: space-between; align-items: center; padding: 11px 3px; background: none; color: #38261b; font-size: 14px; font-weight: 800; text-align: left; }
  .lab-log-link span:last-child { margin-left: auto; font-size: 20px; }
  .lab-disclaimer { border: 1px solid #ded4c5; background: #f3ece0; padding: 13px 14px; border-radius: 15px; color: #6e5c4d; font-size: 12px; line-height: 1.5; }
  .lab-disclaimer strong { color: var(--ink); }
  .lab-nav { position: fixed; z-index: 20; left: 50%; bottom: 0; transform: translateX(-50%); width: min(100%, 430px); display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 10px 18px max(10px, env(safe-area-inset-bottom)); background: #fffdf8ed; backdrop-filter: blur(15px); border-top: 1px solid var(--line); }
  .lab-nav button { border: 0; border-radius: 11px; background: transparent; color: #79634e; padding: 8px 5px; font-size: 12px; font-weight: 700; }
  .lab-nav button[aria-current="page"] { background: var(--soft); color: var(--ink); }
  .lab-nav i { display: block; margin: 0 auto 3px; font: 700 18px "Space Grotesk", sans-serif; }
  .lab-study-sections { display: flex; flex-direction: column; gap: 10px; margin: 6px 0; }
  .lab-study-card { border: 1px solid var(--line); border-radius: 19px; background: var(--panel); overflow: hidden; }
  .lab-study-card summary { list-style: none; display: flex; align-items: center; gap: 13px; padding: 16px; cursor: pointer; }
  .lab-study-card summary::-webkit-details-marker { display: none; }
  .lab-study-card summary::after { content: "+"; margin-left: auto; font: 600 24px "Space Grotesk", sans-serif; color: #9a876f; }
