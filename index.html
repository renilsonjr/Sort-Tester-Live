<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sort Lab · Saddle Brook Twilight</title>
<style>
  @font-face {
    font-family: Nunito;
    src: url("assets/nunito-variable.ttf") format("truetype");
    font-style: normal;
    font-weight: 200 1000;
    font-display: swap;
  }
  /* One palette, from mockups/design-library (the approved brown, gold and
     warm white refresh). Two later :root blocks used to stack on top of this
     one; they are gone, so these values are the ones in force. Belt colours
     come from BELT_STYLE in src/belts.js and are routing information, never
     restyled here. */
  :root {
    --bg: #fffdf8; --panel: #fffdf8; --sunk: #ede3d2;
    --ink: #35271e; --muted: #6e5c4d; --line: #ded4c5;
    --accent: #38261b; --accent-ink: #fffdf8;
    --gold: #f4bd38; --gold-line: #b47d15;
    --soft: #f7eac7; --soft-line: #d6bc75;
    --focus: #175e94; --good: #226442; --bad: #a12d2d;
  }
  * { box-sizing: border-box; }

  /* The Artifact host injects this; nothing else does. Without it a class that
     sets `display` beats the browser's default [hidden] rule, and .bail below
     sets display:flex — so the stop panel would sit open over every card. */
  [hidden] { display: none !important; }

  body {
    /* The Artifact host injects a reset, but the Pages weblayer does not. Without
       this the browser's default 8px body margin overflows the 100dvh card
       screen and every card scrolls. */
    margin: 0;
    background: #f7f3ec; color: var(--ink);
    font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 16px; line-height: 1.45; -webkit-text-size-adjust: 100%;
  }
  #app { margin: 0 auto; background: var(--bg); box-shadow: 0 16px 70px #38261b1c; }
  #app.quiz-page { max-width: 520px; min-height: 100dvh; padding: 20px 16px 48px; }
  #app.lab-page { max-width: 430px; min-height: 100dvh; }
  .screen { display: flex; flex-direction: column; gap: 16px; }

  h1 { font-family: "Space Grotesk", sans-serif; font-size: 28px; font-weight: 700; margin: 0; letter-spacing: -0.04em; }
  h2 { font-size: 12px; margin: 6px 0 0; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); font-weight: 600; }
  .sub { margin: -10px 0 0; color: var(--muted); font-size: 14px; }
  .notice { margin: 0; color: var(--bad); font-size: 14px; font-weight: 600; }
  .warn { margin: 0; color: var(--muted); font-size: 13px; }
  .disclaimer {
    margin: 8px 0 0; padding: 14px 16px; border: 1px solid var(--line);
    border-radius: 12px; color: var(--muted); background: var(--panel);
    font-size: 13px; line-height: 1.5;
  }
  .disclaimer strong { color: var(--ink); }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; }
  input {
    font: inherit; font-size: 18px; padding: 15px; border-radius: 12px; width: 100%;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  }
  input:focus-visible, button:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }

  button { font: inherit; cursor: pointer; border: 0; }
  .primary {
    background: var(--accent); color: var(--accent-ink);
    padding: 17px; border-radius: 12px; font-size: 17px; font-weight: 600;
  }
  .ghost {
    background: transparent; color: var(--ink);
    border: 1px solid var(--line); padding: 14px; border-radius: 12px; font-size: 15px;
  }
  .ghost.danger { color: var(--bad); }

  #auth-panel {
    position: fixed; inset: 0; z-index: 100;
    background: var(--bg); display: flex; flex-direction: column; align-items: center;
    padding: 20px; overflow-y: auto;
  }
  .auth-screen { width: min(360px, 100%); margin-block: auto; flex-shrink: 0; display: flex; flex-direction: column; gap: 14px; }
  .auth-choices { display: flex; flex-direction: column; gap: 14px; }
  .auth-buttons { display: flex; flex-direction: column; gap: 10px; }
  /* The approved entry screen: two cards that say what each way in gives
     you. See mockups/entry-navigation.html. */
  .auth-brand { display: flex; align-items: center; gap: 10px; font-size: 21px; font-weight: 900; letter-spacing: -.05em; }
  .auth-card { display: flex; flex-direction: column; gap: 8px; padding: 17px; border-radius: 20px; background: var(--soft); border: 1px solid var(--soft-line); }
  .auth-card.guest { background: #e8efdf; border-color: #c4d3b4; }
  .auth-card h2 { margin: 0; font-size: 19px; font-weight: 900; letter-spacing: -.035em; text-transform: none; color: var(--ink); }
  .auth-eyebrow { margin: 0; color: var(--accent); font-size: 11px; font-weight: 900; letter-spacing: .13em; text-transform: uppercase; }
  .auth-copy { margin: 0 0 4px; color: #54412f; font-size: 14px; line-height: 1.45; }
  .auth-screen input[readonly] { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0.05em; }

  .decks { display: flex; flex-direction: column; gap: 10px; }
  .deckbtn {
    display: flex; flex-direction: column; gap: 2px; text-align: left;
    background: var(--panel); border: 1px solid var(--line); color: var(--ink);
    border-radius: 12px; padding: 15px 16px;
  }
  .deckbtn .dname { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .dsort {
    font-style: normal; font-size: 10px; font-weight: 700;
    letter-spacing: 0.12em; text-transform: uppercase;
    border: 1px solid var(--line); border-radius: 999px;
    padding: 2px 8px; color: var(--muted);
  }
  .deckbtn .dblurb { font-size: 14px; color: var(--muted); }
  .deckbtn .dmeta {
    font-size: 11px; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.1em; font-weight: 600; margin-top: 5px;
  }
  .deckbtn.locked { opacity: 0.5; border-style: dashed; cursor: default; }
  .deckname { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; margin-top: -10px; }

  .progress { font-size: 12px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; }
  .progress-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .progress-row .progress { margin: 0; }
  .card-header { display: flex; flex-direction: column; gap: 4px; }
  .card-header > .stopbtn { align-self: flex-end; }
  .card-header .lab-language button { width: 38px; min-height: 44px; }
  .stopbtn {
    background: transparent; color: var(--muted);
    border: 1px solid var(--line); padding: 6px 14px; border-radius: 999px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    flex-shrink: 0;
  }
  .stopbtn:active { color: var(--bad); border-color: var(--bad); }

  /* The card fills the phone so the belt pads sit low, in thumb reach, instead
     of floating in the upper half with dead space beneath them. */
  .card-screen, .feedback {
    min-height: calc(100vh - 68px);
    min-height: calc(100dvh - 68px);
  }
  .card-screen { justify-content: space-between; }
  .feedback { justify-content: center; }

  .prompt { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  /* The card is sized to the phone it is held in: every dimension scales with
     viewport height between a small-phone floor and a large-phone ceiling, so
     the prompt and the pads both grow to fill the screen without overflowing a
     short one. vh first, dvh second for browsers that support it. */
  .ring {
    --ring: clamp(92px, 13.5vh, 118px);
    --ring: clamp(92px, 13.5dvh, 118px);
    width: var(--ring); height: var(--ring); border-radius: 50%;
    display: grid; place-items: center; margin-bottom: 2px;
    background: conic-gradient(var(--accent) 0 100%, var(--sunk) 100% 100%);
  }
  .ring i {
    width: calc(var(--ring) - 15px); height: calc(var(--ring) - 15px);
    border-radius: 50%; background: var(--bg);
    display: grid; place-items: center; font-style: normal; font-weight: 700;
    font-size: clamp(28px, 4.6vh, 38px);
    font-size: clamp(28px, 4.6dvh, 38px);
    font-variant-numeric: tabular-nums;
  }
  .p-line {
    font-size: clamp(18px, 2.7vh, 23px);
    font-size: clamp(18px, 2.7dvh, 23px);
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink); font-weight: 700; text-align: center;
  }
  .p-code {
    font-size: clamp(58px, 10.5vh, 86px);
    font-size: clamp(58px, 10.5dvh, 86px);
    font-weight: 700; letter-spacing: -0.015em; line-height: 1.02;
    font-variant-numeric: tabular-nums; text-align: center;
  }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
  .range-display { display: inline-flex; align-items: center; justify-content: center; max-width: 100%; white-space: nowrap; vertical-align: middle; }
  .range-number { line-height: 1; }
  .range-dash { display: block; flex: none; width: .48em; height: .105em; margin: 0 .025em; border-radius: 999px; background: currentColor; }
  .prompt.small .p-code {
    font-size: clamp(36px, 6.4vh, 54px);
    font-size: clamp(36px, 6.4dvh, 54px);
  }

  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .belt {
    padding: 8px; border-radius: 18px; font-weight: 700; letter-spacing: 0.05em;
    font-size: clamp(19px, 2.9vh, 25px);
    font-size: clamp(19px, 2.9dvh, 25px);
    min-height: clamp(100px, 15.5vh, 146px);
    min-height: clamp(100px, 15.5dvh, 146px);
  }

  .bail {
    position: fixed; inset: 0; z-index: 10;
    background: var(--bg); padding: 24px 20px;
    display: flex; flex-direction: column; justify-content: center; gap: 12px;
  }
  .bail h1 { text-align: center; }
  .bail .sub { margin: 0 0 8px; text-align: center; max-width: 34ch; align-self: center; }

  .feedback { align-items: center; text-align: center; }
  .verdict {
    font-weight: 700;
    font-size: clamp(26px, 3.9vh, 34px);
    font-size: clamp(26px, 3.9dvh, 34px);
  }
  .feedback.good .verdict { color: var(--good); }
  .feedback.bad .verdict { color: var(--bad); }
  /* Quiz preview approved for the live card: the supplied mascot fills its
     natural image ratio, while the timer stays between progress and Cancel. */
  .quiz-card, .quiz-feedback { gap: 12px; min-height: calc(100dvh - 68px); }
  .quiz-card { justify-content: space-between; }
  .quiz-top { display: flex; flex-direction: column; gap: 7px; }
  .quiz-topline, .quiz-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .quiz-topline { min-height: 44px; }
  .quiz-topline .lab-language button { width: 38px; }
  .quiz-actions { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); }
  .quiz-actions .stopbtn { justify-self: end; min-height: 44px; border-radius: 22px; }
  .quiz-step { color: var(--muted); font-size: 12px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; }
  .quiz-timer { width: 48px; height: 48px; border: 4px solid var(--ink); border-radius: 50%; display: grid; place-items: center; background: var(--panel); font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .quiz-timer.urgent { border-color: var(--bad); color: var(--bad); }
  .quiz-avatar { display: block; width: 100%; height: auto; aspect-ratio: 1712 / 1152; object-fit: cover; }
  .quiz-route { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .quiz-route .p-line { font-size: clamp(16px, 2.4dvh, 21px); }
  .quiz-route .p-code { font-size: clamp(48px, 10dvh, 72px); font-weight: 800; letter-spacing: -.04em; }
  .quiz-cue { margin: 0; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
  .quiz-card .options { gap: 9px; }
  .quiz-card .belt { min-height: clamp(76px, 12dvh, 104px); border-radius: 12px; }
  .quiz-feedback .verdict { line-height: 1.05; letter-spacing: -.04em; text-align: left; align-self: stretch; }
  .quiz-feedback.good .verdict { color: var(--good); }
  .quiz-feedback.bad .verdict { color: var(--bad); }
  .quiz-feedback .answer-compare { align-self: stretch; display: grid; gap: 8px; padding: 12px; border: 1px solid var(--line); background: #f3ece0; }
  .quiz-feedback .answer-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; }
  .quiz-feedback .answer-row strong { font-size: 15px; }
  .quiz-feedback .answer-row .answer { min-width: 96px; padding: 7px 10px; border-radius: 5px; font-size: 14px; text-align: center; align-self: auto; }
  .quiz-feedback .why { align-self: stretch; max-width: none; border-left: 3px solid var(--ink); padding-left: 10px; color: #54412f; }
  .quiz-feedback .primary { width: 100%; border-radius: 0; min-height: 52px; }
  .quiz-auto { margin: 0; align-self: center; color: var(--muted); font-size: 12px; text-align: center; }
  @media (max-width: 340px) { .quiz-step { font-size: 10px; letter-spacing: .02em; white-space: nowrap; } .quiz-actions .stopbtn { padding-inline: 12px; } }
  @media (max-height: 700px) { .quiz-card, .quiz-feedback { gap: 9px; } .quiz-card .belt { min-height: 76px; } }
  .answer {
    padding: clamp(20px, 3.2vh, 30px); border-radius: 18px; font-weight: 700;
    letter-spacing: 0.05em; align-self: stretch;
    font-size: clamp(24px, 3.6vh, 32px);
    font-size: clamp(24px, 3.6dvh, 32px);
  }
  .why { color: var(--muted); font-size: 14px; margin: 0; max-width: 42ch; }

  .score-line { display: flex; gap: 34px; }
  .big { font-size: 46px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; font-variant-numeric: tabular-nums; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); font-weight: 600; margin-top: 4px; }
  .who { font-size: 18px; font-weight: 600; }
  .clean { color: var(--good); font-weight: 600; margin: 0; }

  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .missed li { border-left: 3px solid var(--bad); padding: 2px 0 2px 12px; }
  .mcard { font-weight: 700; font-size: 15px; letter-spacing: 0.02em; }
  .mans { font-size: 14px; margin: 1px 0 4px; }
  .mans.timeout { color: var(--muted); }
  .logl li {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px;
    display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: baseline;
  }
  .logl .sc { font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
  .logl .when { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
  .logmiss { grid-column: 1 / -1; margin-top: 8px; gap: 7px; }
  .logmiss li {
    background: none; border: 0; border-left: 3px solid var(--bad);
    border-radius: 0; padding: 0 0 0 10px; display: block;
  }
  .logmiss .mcard { font-size: 14px; }
  .logmiss .mans { font-size: 13px; margin: 0; }
  .exportnote { margin: 0; font-size: 13px; color: var(--muted); }
  .exportnote.bad { color: var(--bad); }
  .logclean { grid-column: 1 / -1; font-size: 13px; color: var(--good); font-weight: 600; margin-top: 4px; }

  /* Approved Sort Lab home and study design. The timed card stays on its own
     full-height screen so the belt buttons remain in thumb reach. */
  .lab-shell { min-height: 100dvh; display: flex; flex-direction: column; }
  .lab-top { display: flex; flex-direction: column; gap: 8px; padding: 25px 22px 18px; }
  .lab-top-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .lab-language { display: flex; gap: 4px; margin-left: auto; flex: none; }
  .lab-language button { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 44px; min-height: 44px; padding: 2px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); color: var(--ink); font: 800 10px/1.1 Arial, Helvetica, sans-serif; cursor: pointer; }
  .lab-language button span:first-child { font-size: 19px; line-height: 1.25; }
  .lab-language button[aria-pressed="true"] { border: 2px solid var(--ink); background: #f7eac7; }
  .lab-language button:focus-visible { outline: 3px solid #175e94; outline-offset: 2px; }
  .quiz-language { display: flex; justify-content: flex-end; margin-bottom: 6px; }
  .lab-site { color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
  .lab-brand { display: flex; align-items: center; gap: 10px; font: 700 20px "Space Grotesk", sans-serif; letter-spacing: -.05em; white-space: nowrap; }
  .lab-mark { display: grid; place-items: center; width: 34px; height: 34px; flex: none; background: var(--ink); color: var(--accent-ink); border-radius: 11px; font-size: 13px; transform: rotate(-5deg); }
  .lab-tag { color: #38261b; background: #f7eac7; padding: 6px 9px; border-radius: 999px; font-size: 10px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; text-align: center; }
  .lab-main { flex: 1; padding: 0 22px 105px; }
  .lab-screen { display: flex; flex-direction: column; gap: 12px; }
  .lab-eyebrow { margin: 0; color: #8a5a12; font-size: 11px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
  .lab-title { font-size: clamp(34px, 9vw, 42px); line-height: 1.06; margin: 0; }
  .lab-intro { margin: 0 0 8px; color: var(--muted); font-size: 15px; line-height: 1.5; }
  .lab-hero { position: relative; overflow: hidden; border-radius: 25px; padding: 25px 22px 21px; background: #e8efdf; margin-bottom: 7px; }
  .lab-hero::before { content: ""; position: absolute; width: 180px; height: 180px; border: 1px solid #d6bc75; border-radius: 50%; right: -55px; top: -88px; box-shadow: 0 0 0 34px #f7eac7, 0 0 0 35px #e4d3a8; }
  .lab-hero > * { position: relative; }
  .lab-hero .lab-eyebrow { color: #38261b; margin-bottom: 10px; }
  .lab-hero h1 { max-width: 310px; font-size: clamp(35px, 10vw, 46px); line-height: 1.04; margin-bottom: 14px; }
  .lab-hero p:not(.lab-eyebrow) { max-width: 300px; margin: 0; color: #54412f; font-size: 15px; line-height: 1.5; }
  .lab-route { display: flex; gap: 7px; margin-top: 18px; }
  /* Decorative only: these four bars are not belts and carry no routing
     meaning, so they follow the warm palette. */
  .lab-route span { height: 8px; flex: 1; border-radius: 999px; background: #f4bd38; }
  .lab-route span:nth-child(2) { background: #d79a3a; }
  .lab-route span:nth-child(3) { background: #a8773f; }
  .lab-route span:nth-child(4) { background: #6e5c4d; }
  .lab-section-heading { margin: 3px 0 0; color: var(--ink); font: 700 17px "Space Grotesk", sans-serif; letter-spacing: -.04em; text-transform: none; }
  .lab-choice { width: 100%; display: flex; align-items: center; gap: 14px; text-align: left; border: 1px solid var(--line); border-radius: 19px; background: var(--panel); color: var(--ink); padding: 16px; box-shadow: 0 3px 12px #38261b0d; }
  .lab-choice-icon { display: grid; place-items: center; width: 49px; height: 49px; flex: none; border-radius: 15px; background: #e8efdf; color: #38261b; font: 700 20px "Space Grotesk", sans-serif; }
  .lab-choice-quiz .lab-choice-icon { background: #f6e2c6; color: #8a5a12; }
  .lab-choice strong, .lab-choice small { display: block; }
  .lab-choice strong { font-size: 16px; }
  .lab-choice small { color: var(--muted); margin-top: 3px; font-size: 12px; line-height: 1.35; }
  .lab-arrow { margin-left: auto; color: #9a876f; font-size: 22px; }
  .lab-log-link { display: flex; justify-content: space-between; align-items: center; padding: 11px 3px; background: none; color: #38261b; font-size: 14px; font-weight: 800; text-align: left; }
  .lab-log-link span:last-child { margin-left: auto; font-size: 20px; }
  .lab-disclaimer { border: 1px solid #ded4c5; background: #f3ece0; padding: 13px 14px; border-radius: 15px; color: #6e5c4d; font-size: 12px; line-height: 1.5; }
  .lab-disclaimer strong { color: var(--ink); }
  /* Leaderboard (#12, built to the screen approved in #16). No timestamps:
     the first-reached-score rule was superseded by tie-break quizzes. */
  .board { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .board li { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 17px; background: var(--panel); padding: 12px 14px; }
  .board li.board-you { border: 2px solid var(--accent); }
  .board li.board-tied { border-color: #c79a2c; background: #fdf6e4; }
  /* Shown only when the player is ranked past the rows the server sends,
     so their place is stated instead of being looked for in vain. */
  .board-your-place { margin: .6rem 0 0; font-size: .95rem; }
  .board b { font-weight: 900; }
  .board small { display: block; color: var(--muted); font-size: 12px; }
  .board-place { font-weight: 900; font-variant-numeric: tabular-nums; }
  /* A long username must not push the points off the row. */
  .board-who { min-width: 0; }
  .board-who b { display: block; overflow-wrap: anywhere; }
  .board-marker { grid-column: 1 / -1; margin-top: 4px; color: #7a5200; font-size: 12px; font-weight: 800; }
  /* Owner tools (#11). The approved list is not a ranking, so it is not
     the board grid: a name, the roster reference under it, and the way to
     withdraw. */
  .approved { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .approved li { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 17px; background: var(--panel); padding: 12px 14px; }
  .approved-who { min-width: 0; flex: 1; }
  .approved-who b { display: block; font-weight: 900; overflow-wrap: anywhere; }
  .approved-who small { display: block; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .approved .ghost { flex: none; width: auto; min-height: 0; padding: 9px 13px; font-size: 13px; }
  .owner-form { border: 1px solid var(--line); border-radius: 17px; background: var(--panel); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .owner-form h2 { font-size: 16px; }
  .owner-count { font-size: 16px; margin-top: 4px; }
  /* Withdrawing is the one destructive thing on that screen, so it is the
     quieter button and keeping the approval is the easy one. */
  .owner-danger { color: var(--bad); border-color: #d8b6b6; }
  .owner-note { margin-top: 2px; }
  /* The login ID is read out loud from a phone held at arm's length, so
     it is large, spaced and selectable rather than pretty. */
  /* Case review (#11). A case is a card: who, what they said, the
     evidence, how long it is kept, and the outcomes. No sanction. */
  .cases { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .cases li { border: 1px solid var(--line); border-radius: 17px; background: var(--panel); padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .cases h2 { font-size: 17px; overflow-wrap: anywhere; }
  .case-said { margin: 0; padding-left: 11px; border-left: 3px solid var(--soft-line); color: #54412f; font-size: 14px; overflow-wrap: anywhere; }
  .case-keep { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.45; }
  .case-events { margin: 0; padding-left: 18px; color: var(--muted); font-size: 12px; }
  .case-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .case-actions .ghost { flex: 1 1 150px; width: auto; min-height: 44px; font-size: 13px; padding: 10px; }
  .lab-fold { border: 1px solid var(--line); border-radius: 13px; padding: 10px 12px; }
  .lab-fold summary { font-size: 13px; font-weight: 800; cursor: pointer; }
  /* Reauthentication (#11 box 5): a small dialog over the screen, so the
     action it guards is still visible behind it. */
  .reauth-dialog { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 16px; background: #35271e66; }
  .reauth-card { width: min(100%, 380px); display: flex; flex-direction: column; gap: 10px; padding: 18px; border-radius: 19px; background: var(--panel); box-shadow: 0 18px 50px #35271e40; }
  .reauth-card h2 { font-size: 18px; }
  /* Prize tie-break, player side (#24). The question looks like an
     ordinary Ranked one: service and code, then four belt buttons. */
  .tb-top { display: flex; justify-content: space-between; align-items: baseline; }
  .tb-bar { height: 8px; border-radius: 99px; background: #ede3d2; overflow: hidden; margin: 8px 0 14px; }
  .tb-bar i { display: block; height: 100%; width: 100%; background: var(--danger); border-radius: 99px; transition: width .2s linear; }
  .rq-prompt { text-align: center; margin: 6px 0; }
  .rq-service { color: var(--muted); font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
  .rq-code { font: 900 clamp(34px, 7dvh, 52px)/1 "Space Grotesk", sans-serif; letter-spacing: -.02em; margin-top: 4px; }
  .belts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; }
  .belts .belt { min-height: clamp(76px, 12dvh, 104px); border-radius: 14px; font-weight: 900; font-size: clamp(18px, 2.6dvh, 24px); border: 0; transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.15s ease; }
  .belts .belt:disabled { opacity: .5; }
  .belts .belt.picked { opacity: 1; outline: 3px solid var(--ink); outline-offset: 2px; }

  /* Interactive quiz feedback: correct green glow & incorrect red shake */
  .belt.belt-correct {
    opacity: 1 !important;
    animation: correctGlow 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    z-index: 2;
  }
  .belt.belt-incorrect {
    opacity: 1 !important;
    animation: incorrectShake 0.5s ease-in-out forwards;
    z-index: 2;
  }

  @keyframes correctGlow {
    0% { box-shadow: 0 0 0 0 rgba(34, 100, 66, 0.9); transform: scale(1); }
    40% { box-shadow: 0 0 0 6px rgba(34, 100, 66, 0.4), 0 0 26px 8px var(--good); transform: scale(1.04); filter: brightness(1.15); }
    100% { box-shadow: 0 0 0 4px rgba(34, 100, 66, 0.7), 0 0 16px 3px var(--good); transform: scale(1.02); }
  }

  @keyframes incorrectShake {
    0%, 100% { box-shadow: 0 0 0 0 rgba(161, 45, 45, 0.8); transform: translateX(0); }
    20%, 60% { box-shadow: 0 0 0 5px rgba(161, 45, 45, 0.4), 0 0 20px 4px var(--bad); transform: translateX(-5px); filter: brightness(1.15); }
    40%, 80% { box-shadow: 0 0 0 5px rgba(161, 45, 45, 0.4), 0 0 20px 4px var(--bad); transform: translateX(5px); filter: brightness(1.15); }
  }
  .lab-rules { margin: 4px 0 10px 0; padding-left: 20px; color: var(--ink); font-size: 14px; line-height: 1.5; display: flex; flex-direction: column; gap: 6px; }

  /* Ranked and promotion feedback/result (built to the screens approved
     in #17): verdict heading, this question's worth, the your-choice vs
     correct-belt comparison, and the balance breakdown on a result. */
  .rq-stake { display: block; color: var(--muted); font-size: 12px; font-weight: 800; margin: 2px 0 10px; }
  .rq-verdict.good { color: var(--good); }
  .rq-verdict.bad { color: var(--bad); }
  .rq-worth { font-weight: 800; font-size: 15px; margin: 2px 0 10px; }
  .rq-worth.good { color: var(--good); }
  .rq-worth.bad { color: var(--bad); }
  .rq-cmp { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
  .rq-cmp > div { display: flex; justify-content: space-between; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; font-size: 13px; }
  .rq-cmp .chip { padding: 5px 10px; border-radius: 999px; font-weight: 900; font-size: 12px; letter-spacing: .03em; }
  .rq-why { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 6px 0 14px; }
  .sum { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; border: 1px solid var(--line); border-radius: 15px; padding: 12px 14px; background: var(--panel); }
  .sum > div { display: flex; justify-content: space-between; font-size: 14px; }
  .sum .lost b { color: var(--bad); }
  .sum .total { border-top: 1px dashed var(--line); margin-top: 4px; padding-top: 8px; font-weight: 900; }
  /* Prize selection (#24): the tied players with their tie-break history. */
  .sel-list { list-style: none; margin: 4px 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .sel-list li { border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
  .sel-list label { display: flex; align-items: center; gap: 8px; font-size: 15px; overflow-wrap: anywhere; }
  .sel-list label input { width: auto; flex: none; }
  .sel-hist { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
  .handover-id { font: 900 26px/1.3 "Space Grotesk", sans-serif; letter-spacing: .06em; overflow-wrap: anywhere; user-select: all; }
  .board li.board-hat { border-color: var(--gold-line); background: #fdf6e4; }
  .board-marker-hat { color: #7a5200; }
  .board li.board-hat .board-place { color: var(--gold-line); }
  .board-notice-bad { border-color: #d8b6b6; background: #fbf0ee; }
  .board-notice { margin-top: 12px; border: 1px solid #e4d3a8; border-radius: 17px; background: #fbf3e1; padding: 13px 15px; }
  .board-notice h2 { font-size: 16px; }
  .board-notice p { margin-top: 4px; color: #54412f; font-size: 13px; }

  /* The inactivity warning. It sits above the navigation, not over the
     question, so a player reading a card is never covered by it. */
  .idle-warning { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: calc(68px + env(safe-area-inset-bottom)); width: min(100% - 28px, 402px); display: flex; align-items: center; gap: 11px; padding: 12px 14px; border: 1px solid var(--soft-line); border-radius: 15px; background: var(--soft); color: var(--ink); box-shadow: 0 10px 30px #35271e26; }
  .idle-warning p { margin: 0; font-size: 13px; font-weight: 700; line-height: 1.35; }
  /* Brown, not gold. This bar can appear over a quiz card, where the gold
     #f4bd38 is a near match for the YELLOW belt and would read as a belt
     answer. Same reason the quiz and promotion screens use brown: do not
     "fix" it back to gold. */
  .idle-warning button { margin-left: auto; flex: none; width: auto; padding: 9px 13px; font-size: 13px; background: var(--accent); color: var(--accent-ink); }
  .lab-nav { position: fixed; z-index: 20; left: 50%; bottom: 0; transform: translateX(-50%); width: min(100%, 430px); display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 10px 18px max(10px, env(safe-area-inset-bottom)); background: #fffdf8ed; backdrop-filter: blur(15px); border-top: 1px solid var(--line); }
  .lab-nav button { border: 0; border-radius: 11px; background: transparent; color: #79634e; padding: 8px 5px; font-size: 12px; font-weight: 700; }
  .lab-nav button[aria-current="page"] { background: var(--soft); color: var(--ink); }
  .lab-nav i { display: block; margin: 0 auto 3px; font: 700 18px "Space Grotesk", sans-serif; }
  .lab-study-sections { display: flex; flex-direction: column; gap: 10px; margin: 6px 0; }
  .lab-study-card { border: 1px solid var(--line); border-radius: 19px; background: var(--panel); overflow: hidden; }
  .lab-study-card summary { list-style: none; display: flex; align-items: center; gap: 13px; padding: 16px; cursor: pointer; }
  .lab-study-card summary::-webkit-details-marker { display: none; }
  .lab-study-card summary::after { content: "+"; margin-left: auto; font: 600 24px "Space Grotesk", sans-serif; color: #9a876f; }
  .lab-study-card[open] summary::after { content: "−"; }
  .lab-count { display: grid; place-items: center; width: 39px; height: 39px; flex: none; background: #ebe2d4; border-radius: 12px; color: #6e5c4d; font: 700 14px "Space Grotesk", sans-serif; }
  .lab-study-card summary strong, .lab-study-card summary small { display: block; }
  .lab-study-card summary strong { font-size: 15px; }
  .lab-study-card summary small { color: var(--muted); margin-top: 3px; font-size: 12px; line-height: 1.35; }
  .lab-study-body { border-top: 1px solid var(--line); padding: 16px; }
  .lab-sort-tabs { display: flex; gap: 7px; margin-bottom: 15px; }
  .lab-sort-tabs button { border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--ink); padding: 8px 13px; font-size: 12px; font-weight: 700; }
  .lab-sort-tabs button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--accent-ink); }
  .lab-study-cards { display: flex; flex-direction: column; gap: 10px; }
  .lab-study-row { background: #f3ece0; border-radius: 13px; padding: 14px; }
  .lab-study-meta { color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
  .lab-study-answer { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 5px 0; }
  .lab-study-answer strong { font: 700 22px "Space Grotesk", sans-serif; letter-spacing: -.04em; }
  .lab-belt-chip { min-width: 72px; padding: 9px 11px; border-radius: 10px; text-align: center; font-size: 12px; font-weight: 800; letter-spacing: .05em; }
  .lab-study-row p { margin: 6px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
  .lab-main .field { margin: 8px 0; }
  .lab-main .decks { margin: 6px 0; }
  .lab-main .deckbtn { border-radius: 19px; padding: 16px; box-shadow: 0 3px 12px #38261b0d; }
  .lab-main .deckbtn .dname { font-family: "Space Grotesk", sans-serif; letter-spacing: -.03em; }

  /* The approved Twilight redesign: a plain black and white interface with
     the mascot's muted blue. Belt answer colors still come from BELT_STYLE. */
  body { background: #f7f3ec; color: var(--ink); font-family: Arial, Helvetica, sans-serif; }
  h1, .lab-brand, .lab-section-heading, .lab-choice-icon, .lab-main .deckbtn .dname, .lab-nav i { font-family: Arial, Helvetica, sans-serif; }
  #app { box-shadow: 0 12px 45px #38261b18; }
  .lab-top { padding: 20px 22px 15px; border-bottom: 1px solid var(--line); gap: 8px; }
  .lab-brand { font-size: 19px; font-weight: 800; letter-spacing: -.035em; }
  .lab-mark { border-radius: 5px; transform: none; }
  .lab-tag { align-self: flex-start; border: 1px solid #d6bc75; border-radius: 0; background: #f7eac7; color: #38261b; font-size: 9px; letter-spacing: .04em; }
  .lab-site { letter-spacing: .055em; }
  .lab-main { padding: 20px 22px 100px; }
  .lab-eyebrow { color: var(--ink); letter-spacing: .13em; }
  .lab-title { font-size: 35px; font-weight: 800; letter-spacing: -.065em; }
  .lab-hero { border: 1px solid #d6bc75; border-radius: 0; background: #f7eac7; padding: 0; margin: 0; }
  .lab-hero::before { content: none; }
  .lab-hero-copy { padding: 22px 20px 8px; }
  .lab-hero .lab-eyebrow { color: var(--ink); margin-bottom: 10px; }
  .lab-hero h1 { font: 800 35px/1.02 Arial, Helvetica, sans-serif; letter-spacing: -.065em; margin: 0; }
  .lab-hero p:not(.lab-eyebrow) { margin: 12px 0 0; color: var(--ink); font-size: 14px; }
  .lab-mascot { display: block; width: 100%; height: 225px; object-fit: cover; object-position: 50% 46%; }
  /* The home poster, unlike the mascot, is never cropped: its own
     words are part of the picture, so any crop cuts the message. */
  .lab-campaign { margin: 0; }
  .lab-campaign img { display: block; width: 100%; height: auto; }
  .lab-section-heading { margin: 16px 0 1px; font-size: 20px; font-weight: 800; }
  .lab-choice { border-radius: 0; box-shadow: none; padding: 17px 15px; }
  .lab-choice-icon, .lab-choice-quiz .lab-choice-icon { border: 1px solid #d6bc75; border-radius: 0; background: #f7eac7; color: var(--ink); width: 44px; height: 44px; font-size: 17px; }
  .lab-arrow { color: var(--ink); }
  .lab-log-link { color: #38261b; }
  .lab-disclaimer { border-color: var(--line); border-radius: 0; background: #f3ece0; color: var(--muted); }
  .lab-nav { background: var(--panel); backdrop-filter: none; gap: 0; padding: 0 max(0px, env(safe-area-inset-right)) max(0px, env(safe-area-inset-bottom)) max(0px, env(safe-area-inset-left)); }
  .lab-nav button { border-radius: 0; padding: 10px 5px 12px; }
  .lab-nav button[aria-current="page"] { background: var(--panel); box-shadow: inset 0 3px var(--ink); }
  .lab-main .deckbtn, .ghost, .primary, input { border-radius: 0; }
  .lab-main .deckbtn { box-shadow: none; }
  .lab-main .deckbtn .dname { letter-spacing: 0; }
  .lab-picker-heading { margin: 16px 0 2px; font-size: 16px; letter-spacing: -.02em; text-transform: none; color: var(--ink); }
  .lab-service-tabs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; margin: 9px 0 18px; }
  .lab-service-tabs button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 11px 8px; font-size: 13px; font-weight: 700; }
  .lab-service-tabs button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--accent-ink); }
  .lab-chart-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; border-bottom: 2px solid var(--ink); padding: 8px 0; }
  .lab-chart-heading strong { font-size: 17px; }
  .lab-chart-heading span, .lab-chart-count { color: var(--muted); font-size: 12px; }
  .lab-chart-count { margin: 7px 0 12px; }
  .lab-search-label { display: block; margin-bottom: 6px; font-size: 11px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
  .lab-chart-search { width: 100%; padding: 12px; margin: 0 0 12px; border: 1px solid var(--line); font-size: 15px; }
  .lab-chart-block { margin: 22px 0 3px; font-size: 13px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--ink); }
  .lab-chart-row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .lab-chart-state, .lab-chart-row small { display: block; color: var(--muted); font-size: 12px; }
  .lab-chart-row strong { display: block; margin-top: 2px; font-size: 17px; }
  .lab-chart-row small { margin-top: 2px; font-size: 11px; }
  .lab-chart-row .lab-belt-chip { min-width: 75px; border-radius: 0; padding: 7px 8px; font-size: 11px; }

  /* The season-start notice on the home page (Decision 15) */
  .lab-launch { display: flex; gap: 11px; margin-top: 16px; padding: 14px 15px; border: 1px solid #b9c2e8; border-color: var(--soft-line); border-radius: 19px; background: var(--soft); }
  .lab-launch i { display: grid; place-items: center; width: 34px; height: 34px; flex: none; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-style: normal; font-size: 17px; font-weight: 900; }
  .lab-launch h2 { margin: 0; font-size: 17px; font-weight: 900; letter-spacing: -.03em; text-transform: none; color: var(--ink); }
  .lab-launch p { margin: 3px 0 0; color: #3b4668; color: #54412f; font-size: 13px; line-height: 1.5; }

  /* Support tickets (issue #10, slice 5) */
  .support-list { list-style: none; margin: 10px 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
  .support-list li { border: 1px solid var(--line); border-radius: 17px; background: var(--panel); padding: 13px 14px; }
  .support-list b { display: block; font-size: 16px; font-weight: 900; }
  .support-list small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .support-pill { display: inline-block; margin-bottom: 6px; padding: 3px 10px; border-radius: 99px; font-size: 11px; font-weight: 900; }
  .support-pill.open { background: var(--soft); color: var(--accent); }
  .support-pill.closed { background: #ebe2d4; color: #6e5c4d; }
  .support-keep { display: block; margin-top: 9px; padding-top: 9px; border-top: 1px solid #ebe2d4; color: #6e5c4d; font-size: 12px; font-weight: 700; line-height: 1.45; }
  select, textarea { font: inherit; width: 100%; padding: 14px; border: 1px solid #cdbfae; border-radius: 14px; background: var(--panel); color: var(--ink); font-size: 15px; }
  textarea { resize: vertical; }

  /* Account deletion (issue #10, slice 4) */
  .delete-ack { display: flex; align-items: flex-start; gap: 11px; border: 1px solid var(--line); border-radius: 17px; background: var(--panel); padding: 14px; font-size: 14px; line-height: 1.45; cursor: pointer; }
  .delete-ack input { width: 22px; height: 22px; flex: none; margin: 0; accent-color: var(--accent); }
  .delete-warn { border: 1px solid #e8c5bf; border-radius: 17px; background: #fbefed; padding: 13px 15px; color: #7a2622; margin: 10px 0; }
  .delete-warn h2 { margin: 0; font-size: 16px; font-weight: 900; letter-spacing: -.03em; text-transform: none; color: #7a2622; }
  .delete-warn p { margin: 4px 0 0; font-size: 13px; line-height: 1.5; }
  .delete-danger { background: var(--danger); color: #fffdf8; border-color: #7a2622; }
  /* A disabled button must look disabled. Without this, a primary button
     waiting for a condition (the right number of players chosen, "I saved
     my login ID" ticked) stayed bright gold and read as ready to press. */
  .primary:disabled, .ghost:disabled { background: #ebe2d4; color: #79634e; border-color: #cdbfae; cursor: not-allowed; box-shadow: none; }
  .delete-danger:disabled { background: #ebe2d4; color: #79634e; border-color: #cdbfae; cursor: not-allowed; }

  /* Profile (issue #10, slice 2). The badge art is the approved set from
     mockups/design-library/badges. */
  .profile-tabs { display: flex; flex-wrap: wrap; gap: 2px; border-bottom: 2px solid var(--line); margin: 14px 0 12px; }
  .profile-tabs button { min-height: 44px; padding: 8px 10px; margin-bottom: -2px; border: 0; border-bottom: 3px solid transparent; background: none; color: var(--muted); font-size: 13px; font-weight: 900; }
  .profile-tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--gold-line); }
  .profile-balance { display: flex; align-items: center; gap: 14px; border: 1px solid var(--line); border-radius: 20px; background: var(--panel); padding: 16px; margin-bottom: 10px; }
  .profile-balance > div { min-width: 0; flex: 1; }
  .profile-badge { width: 76px; height: 76px; flex: none; object-fit: contain; border-radius: 14px; }
  .profile-points { margin: 2px 0; font-size: 30px; font-weight: 900; letter-spacing: -.04em; line-height: 1.1; }
  .profile-bar { height: 12px; margin: 8px 0 6px; border-radius: 99px; background: #ede3d2; overflow: hidden; }
  .profile-bar i { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
  .profile-promo { border: 1px solid var(--soft-line); border-radius: 19px; background: var(--soft); padding: 14px 16px; margin-bottom: 10px; }
  .profile-promo h2 { margin: 0; font-size: 17px; font-weight: 900; letter-spacing: -.03em; text-transform: none; color: var(--ink); }
  .profile-promo p { margin: 5px 0 0; color: #54412f; font-size: 13px; line-height: 1.5; }
  .profile-ladder { list-style: none; margin: 0 0 12px; padding: 0; display: flex; flex-direction: column; gap: 7px; }
  .profile-ladder li { display: grid; grid-template-columns: 44px 1fr; align-items: center; gap: 3px 11px; border: 1px solid var(--line); border-radius: 13px; padding: 9px 11px; font-size: 14px; font-weight: 900; }
  .profile-ladder img { width: 44px; height: 44px; object-fit: contain; grid-row: span 2; }
  .profile-ladder span { color: var(--muted); font-size: 12px; font-weight: 600; }
  .profile-ladder li[aria-current="true"] { border: 2px solid var(--gold-line); background: var(--soft); color: var(--accent); }
  .profile-ladder li[aria-current="true"] span { color: var(--accent); font-weight: 900; }
  .profile-history { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .profile-history li { border: 1px solid var(--line); border-radius: 17px; background: var(--panel); padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; }

  /* Friendly study concept: softer learning surfaces and a stronger reading
     hierarchy. The answer buttons and chart chips keep BELT_STYLE colors. */
  body { background: #f7f3ec; color: var(--ink); font-family: Nunito, "Trebuchet MS", sans-serif; font-weight: 600; }

  .lab-hero-copy { padding: 24px 22px 4px; }
  .lab-hero .lab-eyebrow { color: var(--accent); }
  .lab-hero h1 { font: 900 clamp(34px, 9vw, 43px)/1.06 Nunito, "Trebuchet MS", sans-serif; letter-spacing: -.055em; }
  .lab-hero p:not(.lab-eyebrow) { color: #54412f; font-size: 15px; }
  .lab-mascot { height: 209px; object-position: center 52%; }
  .lab-campaign img { border-radius: 0 0 26px 26px; }

  .lab-change-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }

  .lab-change-row p { margin: 2px 0 0; color: #54412f; font-size: 12px; font-weight: 800; }

  .lab-service-tabs button { min-height: 40px; border-radius: 999px; padding: 9px 13px; font-size: 12px; font-weight: 900; }
  .lab-service-tabs button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); }
  .lab-chart-search, .lab-main input { border-radius: 14px; background: var(--panel); }

  .lab-chart-row strong { font-size: 20px; font-weight: 900; letter-spacing: -.03em; }

  .lab-main .deckbtn { margin-bottom: 9px; border-radius: 19px; box-shadow: 0 4px 14px #38261b0d; }

  /* The library's primary action: gold with dark text, not a brown fill. */
  .primary { background: var(--gold); color: var(--ink); border: 1px solid var(--gold-line); }
  .quiz-card, .quiz-feedback { color: var(--ink); }

  .quiz-feedback .answer-row .answer { border-radius: 11px; }

  /* On quiz screens the primary action is brown, not gold: the library's gold
     (#f4bd38) and the YELLOW belt (#f6d33c) are nearly the same colour, and
     on these screens yellow has to mean a belt, never a button. Deliberate,
     settled with the owner 2026-11-14 — do not "fix" it back to gold. */
  .quiz-card .primary, .quiz-feedback .primary, .bail .primary {
    background: var(--accent); color: var(--accent-ink); border-color: var(--accent);
  }
  .quiz-feedback .primary { border-radius: 14px; }
  .logl li { border-radius: 17px; }
  .bail { background: var(--bg); }

  @media (prefers-reduced-motion: no-preference) {
    .lab-choice, .lab-main .deckbtn { transition: transform .18s, box-shadow .18s; }
    .lab-choice:hover, .lab-main .deckbtn:hover { transform: translateY(-2px); box-shadow: 0 12px 30px #38261b12; }

  /* Promotion celebration (#95). Every piece starts invisible or small and
     ends where it belongs, so when the animations are switched off -- the
     reduced-motion rule below, or the Skip button -- what stays on screen
     is the finished state: the badge and the new rank, nothing missing. */
  .promo-cheer .cheer-stage { position: relative; display: grid; place-items: center; height: 212px; margin: 4px 0; }
  .cheer-badge { width: 136px; height: 136px; object-fit: contain; animation: cheer-badge-in .62s cubic-bezier(.18,.9,.32,1.25) both; }
  .cheer-glow { position: absolute; width: 196px; height: 196px; border-radius: 50%; opacity: 0;
    background: radial-gradient(circle, #f4bd3866 0%, #f4bd3800 70%); animation: cheer-glow 1.05s ease-out .12s both; }
  .cheer-spark { position: absolute; width: 9px; height: 9px; border-radius: 2px; background: #f4bd38; opacity: 0;
    animation: cheer-spark .78s ease-out both; animation-delay: calc(260ms + var(--delay)); }
  .cheer-name { margin-top: 2px; }
  /* Skip lands on the same finished state the reduced-motion rule gives. */
  .promo-cheer.skipped .cheer-badge,
  .promo-cheer.skipped .cheer-glow,
  .promo-cheer.skipped .cheer-spark { animation: none; }
  @keyframes cheer-badge-in { from { opacity: 0; transform: scale(.42); } to { opacity: 1; transform: none; } }
  @keyframes cheer-glow { 0% { opacity: 0; transform: scale(.55); } 45% { opacity: 1; } 100% { opacity: 0; transform: scale(1.3); } }
  @keyframes cheer-spark {
    0% { opacity: 0; transform: rotate(var(--a)) translateY(0); }
    18% { opacity: 1; }
    100% { opacity: 0; transform: rotate(var(--a)) translateY(calc(var(--d) * -1)); }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  /* Glassmorphism Trivia UI Tokens & Surfaces for Ranked Mode */
  :root {
    --glass-surface: rgba(255, 253, 248, 0.72);
    --glass-surface-sub: rgba(255, 255, 255, 0.52);
    --glass-border: rgba(255, 255, 255, 0.85);
    --glass-border-subtle: rgba(222, 212, 197, 0.55);
    --glass-highlight: rgba(255, 255, 255, 0.95);
    --glass-shadow: 0 16px 40px -4px rgba(56, 38, 27, 0.12), 0 4px 12px rgba(56, 38, 27, 0.05);
    --dock-bg: rgba(255, 253, 248, 0.88);
    --blur-lg: blur(24px);
    --blur-md: blur(14px);
  }

  /* Ambient Lighting Orbs */
  .ambient-canvas {
    position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
  }
  .orb { position: absolute; border-radius: 50%; filter: blur(85px); }
  .orb-gold { width: 440px; height: 440px; background: radial-gradient(circle, #f4bd38 0%, rgba(244, 189, 56, 0.02) 70%); top: -60px; left: 15%; opacity: 0.55; }
  .orb-amber { width: 460px; height: 460px; background: radial-gradient(circle, #c96b1b 0%, rgba(201, 107, 27, 0.02) 70%); top: 35%; right: 10%; opacity: 0.45; }
  .orb-blue { width: 360px; height: 360px; background: radial-gradient(circle, #175e94 0%, rgba(23, 94, 148, 0.02) 70%); bottom: -40px; left: 20%; opacity: 0.3; }

  /* Glass App Shell & Floating Glass Dock */
  #app {
    position: relative; z-index: 1;
    backdrop-filter: var(--blur-lg); -webkit-backdrop-filter: var(--blur-lg);
    background: var(--glass-surface);
    border: 1px solid var(--glass-border);
  }
  .lab-nav {
    position: fixed !important;
    bottom: 20px !important;
    left: 50% !important;
    transform: translateX(-50%) !important;
    width: min(calc(100% - 32px), 430px) !important;
    height: 64px !important;
    background: var(--dock-bg) !important;
    backdrop-filter: blur(28px) !important;
    -webkit-backdrop-filter: blur(28px) !important;
    border: 1px solid var(--glass-border) !important;
    border-radius: 32px !important;
    box-shadow: 0 14px 34px -4px rgba(0,0,0,0.18) !important;
    z-index: 50 !important;
    display: grid !important;
    align-items: center !important;
    padding: 0 8px !important;
  }
  .lab-nav button {
    border-radius: 24px !important;
    min-height: 48px !important;
    font-weight: 800 !important;
    background: transparent !important;
    border: 0 !important;
    transition: all 0.2s ease !important;
  }
  .lab-nav button[aria-current="page"] {
    background: var(--gold) !important;
    color: #38261b !important;
    box-shadow: 0 4px 14px rgba(244, 189, 56, 0.4) !important;
  }

  /* Glass Cards across Ranked & Quiz */
  .lab-change, .lab-choice, .auth-card, .quiz-card, .rq-cmp, .sum, .profile-balance, .leaderboard-card {
    background: var(--glass-surface-sub);
    backdrop-filter: var(--blur-md); -webkit-backdrop-filter: var(--blur-md);
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow);

  /* Interactive quiz feedback: correct green glow & incorrect red shake */
  .belt.belt-correct {
    opacity: 1 !important;
    animation: correctGlow 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    z-index: 2;
  }
  .belt.belt-incorrect {
    opacity: 1 !important;
    animation: incorrectShake 0.5s ease-in-out forwards;
    z-index: 2;
  }

  @keyframes correctGlow {
    0% { box-shadow: 0 0 0 0 rgba(34, 100, 66, 0.9); transform: scale(1); }
    40% { box-shadow: 0 0 0 6px rgba(34, 100, 66, 0.4), 0 0 26px 8px var(--good); transform: scale(1.04); filter: brightness(1.15); }
    100% { box-shadow: 0 0 0 4px rgba(34, 100, 66, 0.7), 0 0 16px 3px var(--good); transform: scale(1.02); }
  }

  @keyframes incorrectShake {
    0%, 100% { box-shadow: 0 0 0 0 rgba(161, 45, 45, 0.8); transform: translateX(0); }
    20%, 60% { box-shadow: 0 0 0 5px rgba(161, 45, 45, 0.4), 0 0 20px 4px var(--bad); transform: translateX(-5px); filter: brightness(1.15); }
    40%, 80% { box-shadow: 0 0 0 5px rgba(161, 45, 45, 0.4), 0 0 20px 4px var(--bad); transform: translateX(5px); filter: brightness(1.15); }
  }
